<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajustes de campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Iteraciones 32 y 33: ajustes de la app del técnico y datos al día después de un reinicio del servidor.
   Misma base que el prototipo de ajustes de oficina (Precisión). Arriba los casos; a la derecha, el teléfono. */
:root {
  --pagina: #ECEEF2; --pagina-texto: #14161A; --pagina-sec: #50555F; --pagina-panel: #FFFFFF; --pagina-borde: #D6DAE1; --pagina-foco: #1F4FD1;
  --curva: cubic-bezier(0.2, 0, 0, 1);
  --fuente: "Geist", system-ui, -apple-system, sans-serif;
  --lento: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --pagina: #050608; --pagina-texto: #ECEEF2; --pagina-sec: #9BA1AD; --pagina-panel: #0E1116; --pagina-borde: #20252E; --pagina-foco: #8FB0FF; }
}
:root[data-theme="dark"] { color-scheme: dark; --pagina: #050608; --pagina-texto: #ECEEF2; --pagina-sec: #9BA1AD; --pagina-panel: #0E1116; --pagina-borde: #20252E; --pagina-foco: #8FB0FF; }
html[data-lento="si"] { --lento: 4; }

.app, .app[data-tema="claro"] {
  color-scheme: light;
  --fondo: #FAFAFB; --sup: #FFFFFF; --sup2: #F3F4F6; --sup3: #E9EBEF; --linea: #E5E7EB; --linea-fuerte: #D5D8DE;
  --texto: #111317; --sec: #5E646E; --ter: #6F7580;
  --marca: #2F5FE8; --marca-texto: #FFFFFF; --marca-suave: rgba(47,95,232,.09); --marca-borde: rgba(47,95,232,.35);
  --ok: #188A5B; --alerta: #A15C00; --peligro: #D22F34; --revision: #6B4FD3;
  --sombra-capa: 0 0 0 1px rgba(17,19,23,.08), 0 18px 48px rgba(17,19,23,.16); --sombra-menu: 0 0 0 1px rgba(17,19,23,.08), 0 8px 24px rgba(17,19,23,.12);
  --velo: rgba(17,19,23,.28); --filtro-logo: none; --notif: #111317; --notif-texto: #FAFAFB; --notif-enlace: #9DB8FF;
}
.app[data-tema="oscuro"] {
  color-scheme: dark;
  --fondo: #0A0B0D; --sup: #111316; --sup2: #17191D; --sup3: #1E2126; --linea: #23262C; --linea-fuerte: #2E323A;
  --texto: #EDEEF0; --sec: #8B9099; --ter: #7C828C;
  --marca: #3B6FF5; --marca-texto: #FFFFFF; --marca-suave: rgba(59,111,245,.14); --marca-borde: rgba(110,150,255,.45);
  --ok: #3DBE8B; --alerta: #E8A33D; --peligro: #E5484D; --revision: #A38BFA;
  --sombra-capa: 0 0 0 1px rgba(255,255,255,.06), 0 16px 48px rgba(0,0,0,.55); --sombra-menu: 0 0 0 1px rgba(255,255,255,.06), 0 8px 24px rgba(0,0,0,.45);
  --velo: rgba(3,4,6,.62); --filtro-logo: brightness(0) invert(1); --notif: #EDEEF0; --notif-texto: #0A0B0D; --notif-enlace: #2F5FE8;
}
@media (prefers-color-scheme: dark) {
  .app[data-tema="sistema"] {
    color-scheme: dark;
    --fondo: #0A0B0D; --sup: #111316; --sup2: #17191D; --sup3: #1E2126; --linea: #23262C; --linea-fuerte: #2E323A;
    --texto: #EDEEF0; --sec: #8B9099; --ter: #7C828C;
    --marca: #3B6FF5; --marca-texto: #FFFFFF; --marca-suave: rgba(59,111,245,.14); --marca-borde: rgba(110,150,255,.45);
    --ok: #3DBE8B; --alerta: #E8A33D; --peligro: #E5484D; --revision: #A38BFA;
    --sombra-capa: 0 0 0 1px rgba(255,255,255,.06), 0 16px 48px rgba(0,0,0,.55); --sombra-menu: 0 0 0 1px rgba(255,255,255,.06), 0 8px 24px rgba(0,0,0,.45);
    --velo: rgba(3,4,6,.62); --filtro-logo: brightness(0) invert(1); --notif: #EDEEF0; --notif-texto: #0A0B0D; --notif-enlace: #2F5FE8;
  }
}
/* El croquis y la firma son islas claras dentro del tema oscuro (como en la app). */
.app .isla-clara {
  color-scheme: light;
  --fondo: #FAFAFB; --sup: #FFFFFF; --sup2: #F3F4F6; --sup3: #E9EBEF; --linea: #E5E7EB; --linea-fuerte: #D5D8DE;
  --texto: #111317; --sec: #5E646E; --ter: #6F7580; --marca: #2F5FE8; --marca-suave: rgba(47,95,232,.09);
  --ok: #188A5B; --peligro: #D22F34; --filtro-logo: none;
  color: var(--texto);
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--pagina); color: var(--pagina-texto); font-family: var(--fuente); padding: 28px 16px 56px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pagina-foco); outline-offset: 2px; }

/* ---------- La página del prototipo ---------- */
.envoltura { max-width: 1240px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.cabeza { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.cabeza h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.cabeza p { margin: 6px 0 0; color: var(--pagina-sec); max-width: 72ch; line-height: 1.5; font-size: 15px; }
.segmentos { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--pagina-panel); border: 1px solid var(--pagina-borde); flex-wrap: wrap; }
.segmentos button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; font-weight: 500; font-size: 14px; color: var(--pagina-sec); }
.segmentos button[aria-pressed="true"] { background: var(--pagina-texto); color: var(--pagina); }
.cuerpo { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .cuerpo { grid-template-columns: minmax(0, 1fr); } .guia { position: static !important; } }
.guia { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 16px; }
.casos { display: flex; flex-direction: column; gap: 2px; }
.casos .grupo { font-size: 12px; color: var(--pagina-sec); font-weight: 500; padding: 10px 10px 4px; }
.casos button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-size: 14px; color: var(--pagina-texto); display: flex; flex-direction: column; gap: 1px; }
.casos button small { color: var(--pagina-sec); font-size: 12.5px; }
.casos button:hover { background: var(--pagina-panel); }
.casos button[aria-pressed="true"] { background: var(--pagina-panel); box-shadow: inset 0 0 0 1px var(--pagina-borde); font-weight: 500; }
.nota { background: var(--pagina-panel); border: 1px solid var(--pagina-borde); border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.55; display: flex; flex-direction: column; gap: 10px; }
.nota h2 { margin: 0; font-size: 15px; font-weight: 600; }
.nota p { margin: 0; color: var(--pagina-sec); }
.nota p + p { margin-top: 8px; }
.nota b { color: var(--pagina-texto); font-weight: 500; }
.nota .probar { color: var(--pagina-texto); }
.nota a { color: var(--pagina-foco); text-decoration: none; }
.nota a:hover { text-decoration: underline; }
.nota code { font-size: 12.5px; }
.mandos-n { display: flex; flex-direction: column; gap: 8px; }
.mandos-n .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--pagina-sec); }
.antes-despues { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--pagina-panel); border: 1px solid var(--pagina-borde); }
.antes-despues button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; font-weight: 500; font-size: 13px; color: var(--pagina-sec); }
.antes-despues button[aria-pressed="true"] { background: var(--pagina-texto); color: var(--pagina); }
.boton-guia { border: 0; border-radius: 7px; padding: 6px 10px; font-size: 13px; font-weight: 500; background: var(--pagina-panel); color: var(--pagina-texto); box-shadow: inset 0 0 0 1px var(--pagina-borde); }
.refs { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }

/* La escena: uno o dos teléfonos */
.escena { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: flex-start; }
.escena > figure { margin: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.escena figcaption { font-size: 13px; color: var(--pagina-sec); }

/* ---------- Resumen ---------- */
.resumen { background: var(--pagina-panel); border: 1px solid var(--pagina-borde); border-radius: 14px; padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; line-height: 1.55; font-size: 14.5px; }
.resumen h2 { margin: 0; font-size: 17px; font-weight: 600; }
.resumen h3 { margin: 0 0 6px; font-size: 14.5px; font-weight: 600; }
.resumen p { margin: 0; color: var(--pagina-sec); }
.resumen b { color: var(--pagina-texto); font-weight: 500; }
.resumen ol, .resumen ul { margin: 6px 0 0; padding-left: 20px; color: var(--pagina-sec); display: flex; flex-direction: column; gap: 6px; }
.iteraciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.iteraciones > div { border: 1px solid var(--pagina-borde); border-radius: 12px; padding: 14px 16px; }
.iteraciones small { color: var(--pagina-sec); font-size: 12.5px; }

/* ---------- El teléfono ---------- */
.app { font-family: var(--fuente); color: var(--texto); font-size: 16px; line-height: 1.45; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.app svg { width: 20px; height: 20px; flex: none; stroke-width: 1.7; }
.telefono { width: 372px; max-width: 100%; height: 760px; border-radius: 46px; overflow: hidden; position: relative; isolation: isolate; background: var(--fondo); box-shadow: 0 0 0 9px #040507, 0 0 0 10px #22262d, 0 30px 70px rgba(0,0,0,.28); display: flex; flex-direction: column; }
.tel-estado { height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 4px 30px 0; font-size: 15px; font-weight: 600; flex: none; position: relative; z-index: 3; }
.tel-estado .isla { position: absolute; left: 50%; top: 11px; translate: -50% 0; width: 112px; height: 32px; border-radius: 99px; background: #000; }
.tel-estado .ind { display: flex; gap: 5px; align-items: center; }
.tel-estado .ind i { display: block; width: 24px; height: 11px; border-radius: 3px; border: 1.5px solid currentColor; opacity: .9; }
.pantalla { position: absolute; inset: 50px 0 0; display: flex; flex-direction: column; view-transition-name: pantalla; }
.cab-t { padding: 4px 18px 12px; display: flex; flex-direction: column; gap: 6px; flex: none; }
.cab-t .fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; }
.cab-t h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }
.cab-t .ctx { color: var(--sec); font-size: 13px; }
.volver { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--sec); font-size: 15px; padding: 0; min-height: 44px; }
.icono-b { width: 44px; height: 44px; border-radius: 99px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: var(--texto); flex: none; }
.icono-b.con-fondo { background: var(--sup2); }
.avatar { width: 40px; height: 40px; border-radius: 99px; background: var(--sup3); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--texto); border: 0; flex: none; }
.avatar.grande { width: 52px; height: 52px; font-size: 17px; }
.cuerpo-t { flex: 1; overflow: auto; padding: 0 16px 140px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
.cuerpo-t::-webkit-scrollbar { display: none; }
.sec-t { margin: 12px 2px 0; font-size: 13px; font-weight: 600; color: var(--sec); }
.barra { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 30px; background: linear-gradient(to top, var(--fondo) 74%, transparent); z-index: 5; display: flex; flex-direction: column; gap: 8px; }
.barra .progreso { height: 3px; border-radius: 99px; background: var(--sup3); overflow: hidden; margin-bottom: 4px; }
.barra .progreso i { display: block; height: 100%; background: var(--marca); border-radius: 99px; }
.barra .nota-b { text-align: center; color: var(--sec); font-size: 13px; }
.barra .dos { display: grid; grid-template-columns: auto 1fr; gap: 10px; }

.b { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 18px; border-radius: 12px; border: 0; font-size: 16px; font-weight: 500; background: var(--sup); color: var(--texto); box-shadow: inset 0 0 0 1px var(--linea-fuerte); white-space: nowrap; transition: transform .12s var(--curva), filter .12s; }
.b:active { transform: scale(.98); }
.b.p { background: var(--marca); color: var(--marca-texto); box-shadow: none; }
.b.ancho { width: 100%; }
.b.chico { min-height: 44px; padding: 0 14px; font-size: 15px; }
.b.t { background: transparent; box-shadow: none; color: var(--marca); padding: 0 8px; }
.b.t.sec { color: var(--sec); }
.b.peligro-t { background: transparent; box-shadow: none; color: var(--peligro); }
.b.punteado { background: transparent; box-shadow: none; border: 1.5px dashed var(--linea-fuerte); color: var(--sec); }
.b svg { width: 19px; height: 19px; }

.panel { background: var(--sup); border: 1px solid var(--linea); border-radius: 14px; }
.grupo-l { background: var(--sup); border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
.grupo-l > * + * { border-top: 1px solid var(--linea); }
.fila-l { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; width: 100%; background: none; border: 0; text-align: left; font-size: 16px; color: var(--texto); }
.fila-l > svg:first-child { color: var(--sec); }
.fila-l .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fila-l .txt small { color: var(--sec); font-size: 13px; }
.fila-l .der { color: var(--sec); font-size: 15px; display: inline-flex; align-items: center; gap: 4px; }
.fila-l .der svg { width: 18px; height: 18px; color: var(--ter); }
.fila-l[aria-disabled="true"] { color: var(--ter); }
.fila-l[aria-disabled="true"] > svg:first-child { color: var(--ter); }
.fila-l.centro { justify-content: center; color: var(--peligro); font-weight: 500; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; font-size: 13px; font-weight: 500; white-space: nowrap; background: var(--sup2); color: var(--sec); }
.pill.ok { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
.pill.alerta { background: color-mix(in srgb, var(--alerta) 12%, transparent); color: var(--alerta); }
.punto { width: 7px; height: 7px; border-radius: 99px; background: currentColor; flex: none; display: inline-block; }

.aviso { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; font-size: 15px; line-height: 1.45; background: color-mix(in srgb, var(--c, var(--marca)) 8%, var(--sup)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c, var(--marca)) 24%, transparent); }
.aviso svg { color: var(--c, var(--marca)); margin-top: 1px; }
.aviso.alerta { --c: var(--alerta); } .aviso.peligro { --c: var(--peligro); }

.campo-t { display: flex; flex-direction: column; gap: 6px; }
.campo-t label { font-size: 15px; font-weight: 500; }
.campo-t .control { height: 50px; border-radius: 12px; border: 0; box-shadow: inset 0 0 0 1px var(--linea-fuerte); background: var(--sup); padding: 0 14px; font-size: 16px; width: 100%; }
.campo-t .control:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--marca), 0 0 0 4px var(--marca-suave); }
.medida { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.unidades { display: inline-flex; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--linea-fuerte); overflow: hidden; }
.unidades span { padding: 0 14px; display: inline-flex; align-items: center; font-size: 15px; color: var(--sec); }
.unidades span.si { background: var(--marca-suave); color: var(--marca); font-weight: 500; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips span { height: 40px; padding: 0 14px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--linea-fuerte); display: inline-flex; align-items: center; font-size: 15px; }
.fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.foto { aspect-ratio: 3 / 4; border-radius: 10px; background: linear-gradient(140deg, #8C96A6, #3F4652); position: relative; overflow: hidden; }
.foto.b2 { background: linear-gradient(160deg, #A9B3A0, #4F5A47); }
.foto.b3 { background: linear-gradient(120deg, #B6A79A, #5A4C42); }
.foto.agregar { background: transparent; border: 1.5px dashed var(--linea-fuerte); display: flex; align-items: center; justify-content: center; color: var(--sec); }

/* Capas: velo, hoja inferior, notificación */
.velo { position: absolute; inset: 0; z-index: 20; background: var(--velo); }
.hoja { position: absolute; z-index: 21; left: 0; right: 0; bottom: 0; background: var(--sup); border-radius: 18px 18px 0 0; box-shadow: var(--sombra-capa); padding: 8px 16px 30px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100% - 40px); overflow: hidden; }
.hoja .asa { width: 40px; height: 5px; border-radius: 99px; background: var(--linea-fuerte); margin: 0 auto 2px; flex: none; }
.hoja .cab-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.hoja .cab-h h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.hoja .cab-h.centrada { display: grid; grid-template-columns: 64px 1fr 64px; }
.hoja .cab-h.centrada h2 { text-align: center; font-size: 17px; }
.hoja .dentro-h { overflow: auto; display: flex; flex-direction: column; gap: 12px; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; }

/* Hoy: la hoja sube 24 px y el velo aparece de golpe (Dialogo inferior con open:animate-subir). */
[data-vista="hoy"] .velo.entra { animation: none; }
[data-vista="hoy"] .hoja.entra { animation: hoy-subir calc(280ms * var(--lento)) var(--curva) both; }
[data-vista="hoy"] .velo.sale { animation: velo-sale calc(200ms * var(--lento)) var(--curva) both; }
[data-vista="hoy"] .hoja.sale { animation: hoja-baja calc(200ms * var(--lento)) var(--curva) both; }
@keyframes hoy-subir { from { transform: translateY(24px); opacity: 0; } }
/* Propuesta: la hoja entra desde el borde con una curva que frena al final, y el velo se funde a la vez. */
[data-vista="propuesta"] .velo.entra { animation: velo-entra calc(200ms * var(--lento)) ease-out both; }
[data-vista="propuesta"] .hoja.entra { animation: hoja-sube calc(260ms * var(--lento)) cubic-bezier(0.32, 0.72, 0, 1) both; }
[data-vista="propuesta"] .velo.sale { animation: velo-sale calc(180ms * var(--lento)) ease-in both; }
[data-vista="propuesta"] .hoja.sale { animation: hoja-baja calc(200ms * var(--lento)) cubic-bezier(0.32, 0.72, 0, 1) both; }
@keyframes velo-entra { from { opacity: 0; } }
@keyframes velo-sale { to { opacity: 0; } }
@keyframes hoja-sube { from { transform: translateY(100%); } }
@keyframes hoja-baja { to { transform: translateY(100%); } }
/* Propuesta: dentro de una hoja, la página siguiente se desliza y la hoja cambia de alto sin saltar. */
.pagina-h.adelante { animation: pag-adelante calc(220ms * var(--lento)) var(--curva) both; }
.pagina-h.atras { animation: pag-atras calc(220ms * var(--lento)) var(--curva) both; }
@keyframes pag-adelante { from { transform: translateX(28px); opacity: 0; } }
@keyframes pag-atras { from { transform: translateX(-28px); opacity: 0; } }

/* Cambio de paso: View Transition. Hoy, 24 % del ancho; propuesta, 24 px y fundido. */
::view-transition-group(pantalla) { animation-duration: calc(280ms * var(--lento)); }
::view-transition-old(pantalla), ::view-transition-new(pantalla) { animation-timing-function: var(--curva); animation-duration: calc(280ms * var(--lento)); }
html[data-dir="adelante"][data-vt="hoy"]::view-transition-old(pantalla) { animation-name: vt-sale-izq-24; }
html[data-dir="adelante"][data-vt="hoy"]::view-transition-new(pantalla) { animation-name: vt-entra-der-24; }
html[data-dir="atras"][data-vt="hoy"]::view-transition-old(pantalla) { animation-name: vt-sale-der-24; }
html[data-dir="atras"][data-vt="hoy"]::view-transition-new(pantalla) { animation-name: vt-entra-izq-24; }
@keyframes vt-sale-izq-24 { to { transform: translateX(-24%); opacity: 0; } }
@keyframes vt-entra-der-24 { from { transform: translateX(24%); opacity: 0; } }
@keyframes vt-sale-der-24 { to { transform: translateX(24%); opacity: 0; } }
@keyframes vt-entra-izq-24 { from { transform: translateX(-24%); opacity: 0; } }
html[data-vt="propuesta"]::view-transition-old(pantalla) { animation-duration: calc(120ms * var(--lento)); animation-timing-function: ease-in; }
html[data-vt="propuesta"]::view-transition-new(pantalla) { animation-duration: calc(220ms * var(--lento)); animation-delay: calc(20ms * var(--lento)); }
html[data-dir="adelante"][data-vt="propuesta"]::view-transition-old(pantalla) { animation-name: vt-sale-izq-p; }
html[data-dir="adelante"][data-vt="propuesta"]::view-transition-new(pantalla) { animation-name: vt-entra-der-p; }
html[data-dir="atras"][data-vt="propuesta"]::view-transition-old(pantalla) { animation-name: vt-sale-der-p; }
html[data-dir="atras"][data-vt="propuesta"]::view-transition-new(pantalla) { animation-name: vt-entra-izq-p; }
@keyframes vt-sale-izq-p { to { transform: translateX(-12px); opacity: 0; } }
@keyframes vt-entra-der-p { from { transform: translateX(24px); opacity: 0; } }
@keyframes vt-sale-der-p { to { transform: translateX(12px); opacity: 0; } }
@keyframes vt-entra-izq-p { from { transform: translateX(-24px); opacity: 0; } }

/* Capas a pantalla completa (croquis, firma): hoy aparecen después de un fondo vacío. */
.completa { position: absolute; inset: 0; z-index: 30; background: var(--fondo); display: flex; flex-direction: column; }
[data-vista="propuesta"] .completa.entra { animation: hoja-sube calc(300ms * var(--lento)) cubic-bezier(0.32, 0.72, 0, 1) both; }
[data-vista="propuesta"] .completa.sale { animation: hoja-baja calc(220ms * var(--lento)) cubic-bezier(0.32, 0.72, 0, 1) both; }
[data-vista="hoy"] .completa.entra { animation: hoja-sube calc(280ms * var(--lento)) var(--curva) both; }
[data-vista="hoy"] .completa.sale { animation: hoja-baja calc(200ms * var(--lento)) var(--curva) both; }
.completa.vacia { animation: none !important; }
.fundir { animation: fundir calc(200ms * var(--lento)) ease-out both; }
@keyframes fundir { from { opacity: 0; } }

.notif { position: absolute; left: 12px; right: 12px; bottom: 104px; z-index: 40; background: var(--notif); color: var(--notif-texto); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.28); display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 16px; min-height: 52px; font-size: 15px; animation: notif-entra calc(280ms * var(--lento)) var(--curva) both; }
.notif span { flex: 1; }
.notif button { border: 0; background: transparent; color: var(--notif-enlace); font-weight: 600; padding: 10px 12px; min-height: 44px; }
.notif.sale { animation: notif-sale calc(200ms * var(--lento)) var(--curva) both; }
@keyframes notif-entra { from { transform: translateY(16px); opacity: 0; } }
@keyframes notif-sale { to { transform: translateY(16px); opacity: 0; } }

.etiqueta-hoy { display: table; margin: 14px auto 0; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; padding: 3px 8px; border-radius: 99px; background: color-mix(in srgb, var(--peligro) 14%, var(--sup)); color: var(--peligro); pointer-events: none; }
.etiqueta-hoy.prop { background: color-mix(in srgb, var(--ok) 14%, var(--sup)); color: var(--ok); }

/* ---------- Tu cuenta ---------- */
.perfil-hoy { background: var(--sup2); border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
.perfil-hoy .avatar { background: var(--sup); width: 48px; height: 48px; }
.fila-hoy { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 0 16px; border-radius: 14px; background: var(--sup2); font-weight: 600; font-size: 16px; border: 0; width: 100%; text-align: left; }
.fila-hoy small { display: block; font-weight: 400; color: var(--sec); font-size: 13px; }
.radios-hoy { background: var(--sup2); border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.radios-hoy .op { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.radios-hoy label { display: inline-flex; gap: 6px; align-items: center; font-size: 16px; }
.radios-hoy input { width: 20px; height: 20px; accent-color: var(--marca); margin: 0; }
.perfil { display: flex; gap: 14px; align-items: center; padding: 4px 2px 6px; }
.perfil .nombre { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.perfil .estado-s { display: flex; gap: 7px; align-items: center; color: var(--sec); font-size: 14px; }
.perfil .estado-s .punto { color: var(--ok); }
.temas { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--sup2); gap: 2px; }
.temas button { border: 0; background: transparent; width: 40px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: var(--sec); }
.temas button svg { width: 18px; height: 18px; }
.temas button[aria-pressed="true"] { background: var(--sup); color: var(--texto); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 1px var(--linea); }
.cuenta-pie { text-align: center; color: var(--ter); font-size: 12.5px; }
.descartado { display: flex; gap: 12px; align-items: center; padding: 10px 14px; }
.descartado .txt { flex: 1; min-width: 0; }
.descartado .txt b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.descartado .txt small { color: var(--sec); font-size: 13px; }

/* ---------- Tableros ---------- */
.rep-hoy { background: var(--sup); border: 1px solid var(--linea); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; }
.rep-hoy .t { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 17px; }
.rep-hoy .datos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.rep-hoy .datos span { background: var(--sup2); border-radius: 8px; padding: 6px 8px; font-size: 13px; color: var(--sec); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rep-hoy .datos span b { display: block; color: var(--texto); font-weight: 500; font-size: 14px; }
.rep { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px 10px 10px; width: 100%; background: none; border: 0; text-align: left; }
.rep .mini { width: 52px; height: 52px; border-radius: 10px; }
.rep .mini.vacia { background: var(--sup2); display: flex; align-items: center; justify-content: center; color: var(--ter); }
.rep .mini.vacia svg { width: 20px; height: 20px; }
.rep b { font-weight: 600; font-size: 16px; display: block; }
.rep small { color: var(--sec); font-size: 13.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rep .barrita { height: 4px; border-radius: 99px; background: var(--sup3); margin-top: 7px; overflow: hidden; }
.rep .barrita i { display: block; height: 100%; background: var(--ok); }
.rep .barrita.falta i { background: var(--alerta); }
.rep .der { display: flex; align-items: center; gap: 2px; color: var(--sec); font-size: 14px; }
.rep .der svg { width: 18px; height: 18px; color: var(--ter); }
.titulo-ed { display: flex; align-items: center; gap: 6px; }
.titulo-ed input { font: inherit; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; border: 0; background: var(--sup2); border-radius: 10px; padding: 2px 8px; margin-left: -8px; width: 100%; color: var(--texto); }
.titulo-ed input:focus { outline: none; box-shadow: 0 0 0 1.5px var(--marca), 0 0 0 4px var(--marca-suave); }
.menu-p { position: absolute; z-index: 25; right: 14px; top: 98px; min-width: 220px; background: var(--sup); border-radius: 14px; box-shadow: var(--sombra-menu); overflow: hidden; transform-origin: top right; animation: menu-entra calc(200ms * var(--lento)) var(--curva) both; }
.menu-p button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 0 16px; border: 0; background: none; font-size: 16px; text-align: left; }
.menu-p button + button { border-top: 1px solid var(--linea); }
.menu-p button.peligro { color: var(--peligro); }
.menu-p button svg { width: 18px; height: 18px; }
@keyframes menu-entra { from { opacity: 0; transform: scale(.94); } }
.cuenta-rep { color: var(--sec); font-size: 13px; }

/* ---------- Catálogo ---------- */
.buscador { height: 50px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--linea-fuerte); background: var(--sup); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--sec); font-size: 16px; flex: none; }
.buscador.hoy { box-shadow: inset 0 0 0 2px var(--marca); height: 56px; }
.item-c { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px 10px 14px; }
.item-c.hoy { background: var(--sup2); border-radius: 12px; }
.item-c b { font-weight: 500; display: block; font-size: 15.5px; }
.item-c small { color: var(--sec); font-size: 13px; }
.paso-c { display: inline-flex; align-items: center; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--linea-fuerte); height: 44px; }
.paso-c button { width: 44px; height: 44px; border: 0; background: none; font-size: 20px; color: var(--marca); }
.paso-c span { min-width: 28px; text-align: center; font-weight: 600; }
.paso-c.elegido { box-shadow: inset 0 0 0 1.5px var(--marca); background: var(--marca-suave); }
.agregar-c { height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: var(--sup); box-shadow: inset 0 0 0 1px var(--linea-fuerte); font-size: 15px; font-weight: 500; }
.agregar-c.p { color: var(--marca); background: transparent; display: inline-flex; gap: 4px; align-items: center; }
.agregar-c.p svg { width: 18px; height: 18px; }
.pie-c { display: flex; align-items: center; gap: 12px; padding-top: 10px; border-top: 1px solid var(--linea); margin: 0 -16px; padding-inline: 16px; }
.pie-c .resumen-c { flex: 1; min-width: 0; font-size: 15px; }
.pie-c .resumen-c small { display: block; color: var(--sec); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pie-c .resumen-c b { font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.pie-c .resumen-c b svg { width: 17px; height: 17px; color: var(--ok); }
.pie-c.entra { animation: pie-entra calc(260ms * var(--lento)) var(--curva) both; }
@keyframes pie-entra { from { transform: translateY(12px); opacity: 0; } }

/* ---------- Croquis ---------- */
.croquis { background: #FAFAFB; }
.croquis .arriba { display: flex; justify-content: space-between; align-items: center; gap: 4px; padding: 6px 8px; }
.pastilla { display: inline-flex; align-items: center; background: #FFFFFF; border-radius: 14px; box-shadow: 0 0 0 1px rgba(17,19,23,.08), 0 4px 14px rgba(17,19,23,.08); padding: 0 2px; }
.pastilla button { width: 44px; height: 44px; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; color: #111317; }
.pastilla button.si { background: rgba(47,95,232,.12); color: #2F5FE8; }
.pastilla button[disabled] { color: #B8BDC6; }
.pastilla .sep { width: 1px; height: 24px; background: #E5E7EB; }
.lienzo { position: relative; flex: 1; margin: 0; background-image: radial-gradient(#D5D8DE 1px, transparent 1px); background-size: 20px 20px; }
.lienzo svg.dibujo { position: absolute; inset: 0; width: 100%; height: 100%; }
.flotante { position: absolute; bottom: 14px; display: inline-flex; align-items: center; gap: 6px; height: 44px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 0 0 1px rgba(17,19,23,.08), 0 8px 24px rgba(17,19,23,.12); border: 0; padding: 0 12px 0 14px; font-size: 13px; font-weight: 600; color: #111317; }
.flotante small { font-weight: 400; color: #5E646E; font-size: 13px; }
.flotante svg { width: 18px; height: 18px; color: #5E646E; }
.flotante.icono { width: 48px; height: 48px; padding: 0; justify-content: center; color: #2F5FE8; }
.flotante.icono svg { width: 24px; height: 24px; color: #2F5FE8; }
.listo-hoy { position: absolute; bottom: 12px; left: 50%; translate: -50% 0; height: 52px; padding: 0 22px; border-radius: 12px; border: 0; background: #2F5FE8; color: #FFF; font-weight: 800; font-size: 16px; display: inline-flex; gap: 8px; align-items: center; box-shadow: 0 8px 24px rgba(17,19,23,.12); }
.barra-croquis { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px 30px; border-top: 1px solid #E5E7EB; background: #FFFFFF; }
.barra-croquis .hojas { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: #F3F4F6; font-size: 15px; font-weight: 500; color: #111317; }
.barra-croquis .hojas small { color: #5E646E; font-size: 14px; font-weight: 400; }
.barra-croquis .hojas svg { width: 17px; height: 17px; color: #5E646E; }
.barra-croquis .simb { width: 44px; height: 44px; border-radius: 12px; border: 0; background: #F3F4F6; color: #2F5FE8; display: inline-flex; align-items: center; justify-content: center; }
.barra-croquis .listo { margin-left: auto; height: 44px; padding: 0 20px; border-radius: 12px; border: 0; background: #2F5FE8; color: #FFF; font-size: 16px; font-weight: 600; }
.barra-croquis .siguiente-c { font-size: 12px; color: #5E646E; text-align: right; margin-left: auto; line-height: 1.2; }

/* ---------- Firma ---------- */
.entrega-hoy { position: absolute; inset: 0; z-index: 2; background: var(--marca); color: #FFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 30px 28px; text-align: center; }
.entrega-hoy svg.grande { width: 72px; height: 72px; stroke-width: 1.4; animation: entregar 1.6s var(--curva) infinite alternate; }
@keyframes entregar { to { transform: rotate(-90deg); } }
.entrega-hoy h2 { margin: 0; font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; }
.entrega-hoy p { margin: 0; opacity: .8; font-size: 16px; }
.entrega-hoy .b { background: #FFF; color: var(--marca); width: 100%; margin-top: 18px; font-weight: 600; }
.entrega-hoy .t { color: #FFF; background: none; border: 0; min-height: 44px; font-size: 16px; opacity: .85; }
.bienvenida { position: absolute; inset: 0; z-index: 2; background: var(--fondo); display: flex; flex-direction: column; }
.bienvenida .cab-b { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px 0 18px; min-height: 52px; }
.bienvenida .cab-b img { height: 26px; filter: var(--filtro-logo); }
.bienvenida .cuerpo-b { flex: 1; padding: 22px 22px 0; display: flex; flex-direction: column; gap: 18px; }
.bienvenida .saludo { font-size: 15px; color: var(--sec); display: flex; gap: 8px; align-items: center; }
.bienvenida h2 { margin: 0; font-size: 30px; line-height: 1.12; font-weight: 600; letter-spacing: -0.025em; }
.bienvenida .lo-hecho { display: flex; flex-direction: column; border-top: 1px solid var(--linea); }
.bienvenida .lo-hecho div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--linea); font-size: 15.5px; }
.bienvenida .lo-hecho div span:first-child { color: var(--sec); }
.bienvenida .lo-hecho div span:last-child { text-align: right; font-weight: 500; }
.bienvenida .pie-b { padding: 14px 18px 30px; display: flex; flex-direction: column; gap: 10px; }
.bienvenida .pie-b small { text-align: center; color: var(--sec); font-size: 13px; }
.giro-tel { display: inline-flex; width: 32px; height: 32px; border-radius: 99px; background: var(--marca-suave); color: var(--marca); align-items: center; justify-content: center; }
.giro-tel svg { width: 18px; height: 18px; }
.firmar { position: absolute; inset: 0; z-index: 1; background: var(--fondo); display: flex; flex-direction: column; }
.firmar .cab-f { display: flex; align-items: center; gap: 6px; padding: 4px 10px; min-height: 52px; }
.firmar .cab-f b { font-weight: 600; font-size: 17px; }
.firmar .cuerpo-f { flex: 1; padding: 4px 18px 0; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
.firmar .decl { font-size: 15px; color: var(--sec); margin: 0; }
.almohadilla { position: relative; height: 200px; border-radius: 18px; background: var(--sup); box-shadow: inset 0 0 0 1px var(--linea-fuerte); flex: none; }
.almohadilla .linea { position: absolute; left: 22px; right: 22px; bottom: 50px; border-bottom: 1.5px solid var(--linea-fuerte); }
.almohadilla small { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; color: var(--ter); font-size: 13px; }
.almohadilla svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.firmar .pie-f { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 12px 18px 30px; }
.constancia { background: var(--sup); border: 1px solid var(--linea); border-radius: 16px; overflow: hidden; }
.constancia .cab-k { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px 0 16px; }
.constancia .cab-k .pill svg { width: 15px; height: 15px; }
.constancia .trazo { height: 190px; margin: 6px 16px 0; position: relative; border-bottom: 1.5px solid var(--linea-fuerte); }
.constancia .trazo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.constancia .quien { padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 2px; }
.constancia .quien b { font-weight: 600; font-size: 17px; }
.constancia .quien small { color: var(--sec); font-size: 14px; }
.constancia .decl-k { margin: 0; padding: 12px 16px 14px; border-top: 1px solid var(--linea); font-size: 13.5px; color: var(--sec); line-height: 1.5; }
.firma-hoy { border: 1px solid var(--linea); border-radius: 12px; height: 128px; position: relative; background: var(--sup); }
.firma-hoy svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- Antes de enviar ---------- */
.rep-hoy-l { border: 1px solid var(--linea); border-radius: 14px; background: var(--sup); }
.rep-hoy-l > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; }
.rep-hoy-l > div + div { border-top: 1px solid var(--linea); }
.rep-hoy-l b { font-weight: 600; display: block; }
.rep-hoy-l small { color: var(--sec); font-size: 14px; }
.rep-hoy-l .ed { height: 40px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--linea-fuerte); background: none; font-size: 15px; font-weight: 500; }
.para { display: flex; flex-direction: column; gap: 2px; padding: 2px 2px 4px; }
.para b { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.para small { color: var(--sec); font-size: 14px; }
.cifras { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--sup); border: 1px solid var(--linea); border-radius: 14px; }
.cifras div { padding: 12px 12px; display: flex; flex-direction: column; gap: 1px; }
.cifras div + div { border-left: 1px solid var(--linea); }
.cifras b { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.cifras small { color: var(--sec); font-size: 13px; }
.sec-r { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 12px 12px 14px; width: 100%; background: none; border: 0; text-align: left; align-items: start; }
.sec-r > svg:first-child { width: 22px; height: 22px; color: var(--ok); margin-top: 1px; }
.sec-r.falta > svg:first-child { color: var(--alerta); }
.sec-r b { font-weight: 600; font-size: 16px; display: block; }
.sec-r small { display: block; color: var(--sec); font-size: 14px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec-r small.falta { color: var(--alerta); font-weight: 500; }
.sec-r .fin { color: var(--ter); align-self: center; }
.sec-r .fin svg { width: 18px; height: 18px; }
.sec-r .miniaturas { display: flex; gap: 4px; margin-top: 7px; }
.sec-r .miniaturas .foto { width: 40px; aspect-ratio: 1; border-radius: 6px; }
.sec-r .miniaturas .mas { width: 40px; height: 40px; border-radius: 6px; background: var(--sup2); color: var(--sec); font-size: 13px; display: inline-flex; align-items: center; justify-content: center; font-weight: 500; }
.sec-r .firma-mini { margin-top: 6px; height: 38px; width: 120px; border-radius: 6px; background: var(--sup2); position: relative; }
.sec-r .firma-mini svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- Enviados ---------- */
.fila-hoy-e { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 14px; background: var(--sup); border: 1px solid var(--linea); text-align: left; width: 100%; }
.fila-hoy-e .fecha { width: 64px; flex: none; color: var(--sec); font-size: 15px; }
.fila-hoy-e .medio { min-width: 0; flex: 1; }
.fila-hoy-e .medio b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila-hoy-e .medio small { color: var(--sec); font-size: 14px; }
.fila-hoy-e .estado-hoy { flex: none; border-radius: 99px; background: var(--sup2); padding: 4px 12px; font-size: 14px; font-weight: 600; text-align: right; }
.fila-hoy-e .estado-hoy.error { color: var(--peligro); }
.fila-hoy-e .estado-hoy.ok { color: var(--ok); }
.env { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 14px; width: 100%; background: none; border: 0; text-align: left; align-items: center; }
.env b { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.env .cuando { color: var(--sec); font-size: 14px; text-align: right; }
.env .linea2 { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--sec); min-width: 0; }
.env .linea2 .est { display: inline-flex; align-items: center; gap: 6px; flex: none; font-weight: 500; }
.env .linea2 .est svg { width: 16px; height: 16px; }
.env .linea2 .resto { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.est.ok { color: var(--ok); } .est.revision { color: var(--revision); } .est.pend { color: var(--alerta); } .est.error { color: var(--peligro); }
.atencion { border-color: color-mix(in srgb, var(--peligro) 35%, var(--linea)); }
.atencion .env .accion { grid-column: 1 / -1; margin-top: 6px; display: flex; gap: 8px; }
.detalle-e { display: flex; flex-direction: column; gap: 12px; }
.pasos-e { display: flex; flex-direction: column; gap: 0; }
.pasos-e div { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 8px 0; font-size: 15px; }
.pasos-e svg { width: 20px; height: 20px; }

/* ---------- Datos al día ---------- */
.diagrama { background: var(--pagina-panel); border: 1px solid var(--pagina-borde); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 1.55; max-width: 520px; }
.diagrama h3 { margin: 0; font-size: 15px; font-weight: 600; }
.diagrama p { margin: 0; color: var(--pagina-sec); }
.diagrama table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.diagrama th, .diagrama td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--pagina-borde); vertical-align: top; }
.diagrama th { font-weight: 500; color: var(--pagina-sec); font-size: 12.5px; }
.diagrama td.si { color: #188A5B; font-weight: 500; }
.diagrama td.no { color: #D22F34; font-weight: 500; }
.linea-t { display: flex; flex-direction: column; gap: 8px; }
.linea-t div { display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
.linea-t span.n { width: 22px; height: 22px; border-radius: 99px; background: var(--pagina); border: 1px solid var(--pagina-borde); font-size: 12px; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; }
.visita-c { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.visita-c .hora { color: var(--sec); font-size: 14px; }
.visita-c b { font-size: 18px; font-weight: 600; }
.visita-c small { color: var(--sec); font-size: 14px; }
.visita-c.sale { animation: sale-fila calc(360ms * var(--lento)) var(--curva) both; }
@keyframes sale-fila { to { opacity: 0; transform: scale(.97); } }
.sin-mov *, .sin-mov *::before, .sin-mov *::after { animation: none !important; }
</style>
</head>
<body>
<div class="envoltura">
  <div class="cabeza">
    <div>
      <h1>Ajustes de campo · propuesta</h1>
      <p>Sus nueve puntos de la app del técnico y los datos viejos que quedan en el teléfono, en dos iteraciones. Cada caso compara lo de hoy con la propuesta (mando en la nota), se puede tocar como en el teléfono y cita las pantallas de Mobbin de donde sale.</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div class="segmentos" role="group" aria-label="Velocidad" id="velocidad"><button data-lento="no" aria-pressed="true">Velocidad real</button><button data-lento="si" aria-pressed="false">Cámara lenta</button></div>
      <div class="segmentos" role="group" aria-label="Tema" id="temas"><button data-tema="sistema" aria-pressed="true">Sistema</button><button data-tema="claro" aria-pressed="false">Claro</button><button data-tema="oscuro" aria-pressed="false">Oscuro</button></div>
    </div>
  </div>
  <div class="cuerpo">
    <div class="guia">
      <div class="casos" id="casos"></div>
      <div class="nota" id="nota"></div>
    </div>
    <div id="escena"></div>
  </div>
</div>

/* =====================================================================================================
   Estado y mecánica: capas que entran y salen, notificaciones, cambio de paso con View Transition.
   Datos inventados (regla 1): ningún cliente, persona ni cifra es real.
   ===================================================================================================== */
const e = { caso: "resumen", tema: "sistema", vista: "propuesta", lento: false, capa: null, notif: null };
const hoy = () => e.vista === "hoy";
const reducido = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const dur = (ms) => (reducido() ? 0 : ms * (e.lento ? 4 : 1));
const temporizadores = new Set();
const luego = (fn, ms) => { const t = setTimeout(() => { temporizadores.delete(t); fn(); }, ms); temporizadores.add(t); };
const fase = (f) => (f === "entra" ? "entra" : f === "sale" ? "sale" : "");

function abrirCapa(nombre, datos = {}) {
  e.menu = null;
  e.capa = { nombre, fase: "entra", ...datos };
  pintar();
  luego(() => { if (e.capa?.nombre === nombre && e.capa.fase === "entra") { e.capa.fase = "quieta"; pintar(); } }, dur(320));
}
function cerrarCapa(despues) {
  if (!e.capa) { despues ? despues() : pintar(); return; }
  e.capa.fase = "sale";
  pintar();
  luego(() => { e.capa = null; despues ? despues() : pintar(); }, dur(200));
}
let tNotif;
function notificar(texto, accion = null) {
  clearTimeout(tNotif);
  e.notif = { texto, accion, fase: "entra", n: (e.notif?.n ?? 0) + 1 };
  const n = e.notif.n;
  pintar();
  tNotif = setTimeout(() => { if (e.notif?.n !== n) return; e.notif.fase = "sale"; pintar(); luego(() => { if (e.notif?.n === n) { e.notif = null; pintar(); } }, dur(200)); }, accion ? 7000 : 4000);
}
const notificacion = () => (e.notif ? `<div class="notif ${fase(e.notif.fase)}" role="status"><span>${esc(e.notif.texto)}</span>${e.notif.accion ? `<button data-a="${e.notif.accion.a}">${e.notif.accion.texto}</button>` : ""}</div>` : "");

/** Cambio de pantalla dentro del teléfono: View Transition con la dirección; hoy, 24 % del ancho; propuesta, 24 px. */
function navegar(fn, dir = "adelante") {
  if (!document.startViewTransition || reducido()) { fn(); pintar(); return; }

      "Cada tablero es una tarjeta alta con tres datos cortados («Ubicación», «Tensión», «Circuitos») que casi no se leen. Dentro, el nombre se cambia en un campo al final del formulario y «Quitar tablero» es un enlace azul justo encima de «Listo»: lo más destructivo, en el color de la acción y donde el pulgar pasa más.",
      "La lista es una fila por tablero: la primera foto, el nombre, lo que lo identifica (ubicación, tensión, fotos) y una barra de avance, con «Faltan 2» en ámbar o un visto. Dentro, el nombre es el título y se cambia desde el menú <b>⋯</b> de arriba, junto a «Quitar tablero» en rojo (sigue con «Deshacer»). Abajo, «Siguiente: Tablero 2» para seguir sin volver a la lista; en el último, «Listo, ver los 3 tableros».",
      "abra un tablero, pruebe el menú ⋯ (cambiar nombre y quitar) y pase al siguiente.",
      `${M("Target", "5c2bd4eb-0deb-413f-976c-133844fe32e1")} ${M("Linktree", "ef2b7777-205e-4831-86bf-37ba007f2630")} ${M("Notion", "3829e8ca-ff60-43ab-9451-45320dd1810e")} ${M("Oura", "5f5f6e16-3ef8-4556-9f3e-4d4991dd9bc4")}`) },
  { id: "catalogo", titulo: "4 · Catálogo", sub: "El botón de abajo", nota: () => nota("4 · «Listo · 1 material ✓»",
      "Cada «Agregar» ya guarda la línea, pero el botón grande de abajo parece el que confirma: da a entender que si no se toca no se agrega nada, y que «1 material» es lo que va a pasar, no lo que ya pasó.",
      "Arriba, «Cerrar», como en cualquier hoja. Abajo no hay nada hasta que se agrega algo; entonces aparece una franja que dice lo que ya pasó, «2 agregados a Materiales» con los nombres, y un botón que dice a dónde lleva: «Ver Materiales». Lo agregado queda resaltado con su contador en la lista.",
      "abra el catálogo, agregue dos materiales y súbales la cantidad; luego «Ver Materiales».",
      `${M("Warby Parker", "679d260d-f135-4afb-a7ee-bfa052f65513")} ${M("Yami", "7f10da88-7a2e-4a20-8ad3-0e89df9ffcbd")} ${M("eBay", "17132375-00c0-4fa4-8c58-8bcd5d078772")}`) },
  { id: "croquis", titulo: "5 · Croquis", sub: "«Listo» y la barra de abajo", nota: () => nota("5 · El «Listo» del croquis",
      "«Listo» flota en el centro, encima del dibujo, entre «Hoja 1 1/1» a la izquierda y el botón de símbolos a la derecha: tres piezas sueltas de tamaños distintos, y el botón tapa justo donde suele estar el plano.",
      "Una barra fija abajo, del mismo blanco del croquis: hojas a la izquierda, símbolos al lado y «Listo» a la derecha, donde el pulgar termina. El lienzo ya no queda tapado y la barra es la misma con o sin «Listo» (fuera de la captura, sin el botón). Arriba no cabe: las herramientas ocupan el ancho.",
      "compare Hoy y Propuesta; fíjese en que el dibujo ya no queda debajo de los botones.",
      `${M("Pinterest", "e0a593e7-f1ac-4750-aa7b-66cde5001d46")} ${M("eBay", "f37601af-1b56-4fb8-9596-afa0d5868695")} ${M("X", "4c4591e1-661b-4384-8fb2-2a6947a1c0c8")}`) },
  { id: "entrega", titulo: "6 · Entregar el teléfono", sub: "La pantalla para el cliente", nota: () => nota("6 · «Entrega el teléfono a quien te recibió»",
      "Una pantalla azul entera, con un teléfono girando, que le habla al técnico («entrega el teléfono») cuando quien la va a ver es el cliente. «Ya lo tiene» y «Todavía no» obligan a contestar algo que no aporta, y el paso a la firma es un corte seco.",
      "La pantalla le habla a quien recibe el teléfono: «Hotel Plaza Real, confirma la visita de María Gómez», con el logo y lo que se va a firmar (sitio, fecha, hora y motivo) antes de pedir nada. Un solo botón, «Revisar y firmar», que funde a la firma; el técnico tiene «Cancelar» arriba. Así el teléfono se entrega ya mostrando lo correcto.",
      "toque «Entregar el teléfono», luego «Revisar y firmar», trace la firma y «Firmar».",
      `${M("DoorDash Dasher", "dc8269d4-fab1-46ea-8c0c-267b3b10ed93")} ${M("Jobber", "4fac8d97-26e3-4f2b-8ec6-53899af41b4d")} ${M("Freeform", "1a7db0ee-23a2-45a2-a618-3a6e41255316")}`) },
  { id: "firmada", titulo: "7 · Firma tomada", sub: "Usar el espacio", nota: () => nota("7 · Después de firmar",
      "La firma queda en una caja pequeña, «Volver a firmar» es un enlace gris suelto debajo y casi media pantalla queda vacía hasta «Revisar y enviar».",
      "Una constancia que ocupa el espacio: la firma grande sobre su línea, quién firmó con cargo y cliente, y la declaración exacta que sale en el informe. Arriba de la tarjeta, «Firmada 11:52 a. m.» y «Repetir» (con confirmación, como hoy). Abajo, «Revisar y enviar» con «Todos los pasos completos».",
      "toque «Repetir» y confirme, o «Revisar y enviar».",
      `${M("Liven", "d5a3c4d7-0ef2-4ed4-af1b-cbbe498628ea")} ${M("Docusign", "68249fb4-b773-44ce-bc33-9a2380e9103e")}`) },
  { id: "repaso", titulo: "8 · Antes de enviar", sub: "Un repaso con contenido", nota: () => nota("8 · Antes de enviar",
      "Un aviso ámbar arriba y una lista de pasos que solo dicen «Completo», cada uno con una pastilla «Editar». No se ve qué se va a enviar, solo que hay algo.",
      "Título «Revisa y envía» con cliente, sitio, formato y hora; tres cifras (fotos, tableros, materiales); y cada sección con lo que realmente lleva: los datos clave, miniaturas de las fotos, los nombres de los tableros, los materiales y la firma. Toda la fila se toca para editar, con un visto o el dato que falta en ámbar. La advertencia pasa debajo del botón, junto a la acción que la causa.",
      "toque la fila de Tableros (falta un dato) para completarlo.",
      `${M("Vestiaire Collective", "87e172a6-ea15-4dd8-80bd-cbcdaf551833")} ${M("Airbnb", "e9da847d-3b16-4b23-a21c-d750ea9dbf06")} ${M("eBay", "3d721318-f32c-4e6c-954e-23018fb3fd68")}`) },
  { id: "enviados", titulo: "9 · Enviados", sub: "Estados cortos, el error arriba", nota: () => nota("9 · Enviados en el inicio",
      "El estado es una pastilla con el mensaje completo: el error («No se pudo enviar: oficina no pudo acepta…») ocupa el ancho y aplasta el título a «Formato de pr…». Las pastillas no se cortan y cada una tiene un largo distinto.",
      "Dos líneas por envío: arriba cliente y sitio con la hora; abajo el estado en dos o tres palabras con su icono y color («No se pudo enviar», «Se envía al tener señal», «En revisión», «Revisado») y el formato. Lo que falló sale aparte, arriba, en «Necesita atención». La explicación larga y «Reintentar envío» están en el detalle.",
      "toque el envío que falló.",
      `${M("Quo", "28233f22-360a-456d-9973-ef2942fdf2fa")} ${M("OpenPhone", "fd44cd6d-3bf9-4be7-bae2-f6e4b25cb27d")} ${M("Revolut", "b7a4d4f5-b5a7-4f95-a39e-84e7a258996c")}`) },
  { id: "datos", grupo: "Iteración 33 · sincronización", titulo: "Datos viejos en el teléfono", sub: "ADR-0038 propuesto", nota: () => nota("Datos que el servidor ya borró",
      "La bajada solo trae cambios, y al limpiar el entorno se borraron también las marcas de esos cambios: el teléfono nunca se entera de que esas visitas y envíos ya no existen. Ni bajar todo desde cero lo arregla, porque solo agrega. Por eso había que desinstalar.",
      "Una <b>época</b> por organización. El script de limpieza la cambia; cada bajada la trae; si el teléfono ve una distinta, quita lo que vino del servidor y baja todo otra vez. Borradores, la cola de envío, formatos y visitas con trabajo sin enviar no se tocan. No hay aviso: el inicio queda como debe quedar. Va en un ADR nuevo (0038), sin cambiar los anteriores.",
      "con «Hoy / Propuesta», toque «Simular la limpieza» y luego «Abrir la app».",
      "",
      `<div class="fila"><button class="boton-guia" data-a="d-limpiar">Simular la limpieza</button><button class="boton-guia" data-a="d-abrir">Abrir la app</button></div>`) },
];

function resumen() {
  return `<div class="resumen">
    <div><h2>Dos iteraciones</h2></div>
    <div class="iteraciones">
      <div><h3>32 · Pantallas de campo</h3><p>Los nueve puntos. Solo <code>paquetes/campo</code>, <code>paquetes/ui</code> y <code>DESIGN.md</code>: nada cambia en lo que se guarda ni en lo que se envía. Se prueba en el iPhone antes de cerrar.</p><small>Presupuesto de JavaScript: hoy 125 de 135 KB; esto es CSS y marcado, sin librerías.</small></div>
      <div><h3>33 · Datos al día tras un reinicio</h3><p>La época en la bajada (ADR-0038): un campo opcional en <code>protocolo</code>, una tabla y una migración en el servidor, una línea en <code>dejar-limpio.sql</code> y el reinicio en la base del teléfono. Versión 13 de la app.</p><small>Pruebas: el reinicio conserva borradores, la cola y las terminaciones; la primera época no borra nada.</small></div>
    </div>
    <div><h3>Lo que necesito que apruebe</h3><ol>
      <li><b>Movimiento:</b> hojas desde el borde (260 ms) con el velo fundido, pasos con 24 px y fundido, y lo que se abre desde una hoja dentro de la misma hoja. Valores nuevos en <code>DESIGN.md</code>.</li>
      <li><b>Tu cuenta:</b> lista agrupada, tema en iconos y «Cerrar sesión» sola al final.</li>
      <li><b>Tableros:</b> filas con foto y avance; nombre y «Quitar tablero» en el menú ⋯; «Siguiente: Tablero 2».</li>
      <li><b>Catálogo:</b> «Cerrar» arriba y la franja «N agregados a Materiales · Ver Materiales» solo cuando hay algo.</li>
      <li><b>Croquis:</b> barra fija abajo con hojas, símbolos y «Listo» a la derecha.</li>
      <li><b>Entrega:</b> la pantalla le habla al cliente con lo que va a firmar; se quitan «Ya lo tiene» y «Todavía no».</li>
      <li><b>Firma tomada:</b> la constancia grande con «Repetir».</li>
      <li><b>Antes de enviar:</b> «Revisa y envía» con cifras y el contenido de cada sección.</li>
      <li><b>Enviados:</b> dos líneas, estados cortos y «Necesita atención» arriba.</li>
      <li><b>ADR-0038:</b> la época; al cambiar, el teléfono quita también los enviados que oficina ya recibió (con sus fotos), sin avisar al técnico.</li>
    </ol></div>
    <div><h3>Lo que no cambia</h3><ul><li>Lo capturado y no enviado nunca se borra (regla 5), tampoco con la época.</li><li>Quitar un tablero sigue sin confirmación, con «Deshacer».</li><li>Volver a firmar sigue pidiendo confirmación.</li></ul></div>
  </div>`;
}

function reiniciar() {
  temporizadores.forEach(clearTimeout); temporizadores.clear();
  e.capa = null; e.notif = null; e.sinSenal = false;
  e.m = { paso: 0 };
  e.k = { tema: "sistema", pagina: null, dir: "" };
  e.t = { abierto: null, menu: false, renombrando: false, quitado: null, lista: [
    { nombre: "TGD", ubic: "Sótano, junto al ascensor", tension: "208", circ: "24", fotos: 3, faltan: 0 },
    { nombre: "Tablero 2", ubic: "Piso 2, cuarto técnico", tension: "120", circ: "12", fotos: 2, faltan: 0 },
    { nombre: "Tablero piso 4", ubic: "Piso 4, pasillo", tension: "", circ: "", fotos: 0, faltan: 3 },
  ] };
  e.c = { cant: {}, pieNuevo: false };
  e.f = { paso: "entrega", trazo: false, firmada: e.caso === "firmada", recien: false };
  e.r = { completar: false };
  e.n = { detalle: null };
  e.d = { paso: "antes" };
}

let pintando = false;
function pintar() {
  if (pintando) return;
  pintando = true;
  try {
    document.getElementById("casos").innerHTML = CASOS.reduce((h, c, i) => h + (c.grupo && c.grupo !== CASOS[i - 1]?.grupo ? `<span class="grupo">${c.grupo}</span>` : "") + `<button data-caso="${c.id}" aria-pressed="${c.id === e.caso}">${c.titulo}<small>${c.sub}</small></button>`, "");
    document.getElementById("nota").innerHTML = CASOS.find((c) => c.id === e.caso).nota();
    document.querySelectorAll("#temas button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tema === e.tema)));
    document.querySelectorAll("#velocidad button").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.lento === "si") === e.lento)));
    document.documentElement.dataset.lento = e.lento ? "si" : "no";
    const act = document.activeElement, foco = act?.closest?.("#escena") ? act.id : null;
    let html;
    if (e.caso === "resumen") html = resumen();
    else if (e.caso === "datos") html = casoDatos();
    else html = `<div class="escena">${{ movimiento: casoMovimiento, cuenta: casoCuenta, tableros: casoTableros, catalogo: casoCatalogo, croquis: casoCroquis, entrega: casoEntrega, firmada: casoFirmada, repaso: casoRepaso, enviados: casoEnviados }[e.caso]()}</div>`;
    document.getElementById("escena").innerHTML = html;
    if (foco && document.getElementById(foco)) document.getElementById(foco).focus({ preventScroll: true });
    else document.querySelector("#escena [autofocus]")?.focus({ preventScroll: true });
  } finally { pintando = false; }
}

/* =====================================================================================================
   Acciones
   ===================================================================================================== */
document.getElementById("casos").addEventListener("click", (ev) => { const b = ev.target.closest("[data-caso]"); if (b) { e.caso = b.dataset.caso; reiniciar(); pintar(); } });
document.getElementById("temas").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) { e.tema = b.dataset.tema; pintar(); } });
document.getElementById("velocidad").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) { e.lento = b.dataset.lento === "si"; pintar(); } });
document.addEventListener("input", (ev) => {
  const c = ev.target.dataset?.c;
  if (c === "t-nombre") e.t.lista[e.t.abierto].nombre = ev.target.value;
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && e.capa) cerrarCapa();
  if (ev.key === "Enter" && ev.target.id === "t-nombre-p") document.querySelector('[data-a="t-nombre-listo"]')?.click();
});
/** Hoy, abrir algo desde Tu cuenta cierra la hoja, deja un momento vacío mientras carga y luego abre la otra. */
function abrirDesdeCuentaHoy(nombre) {
  cerrarCapa(() => { e.capa = { nombre: "hueco", fase: "quieta" }; pintar(); luego(() => abrirCapa(nombre), dur(350)); });
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-a]");
  if (!b || b.disabled || !b.closest("#escena, #nota")) return;
  const a = b.dataset.a, v = b.dataset.v;
  const acciones = {
    "g-vista": () => { e.vista = v; reiniciar(); pintar(); },
    "g-reiniciar": () => { reiniciar(); pintar(); },
    cerrar: () => cerrarCapa(),
    nada: () => {},
    // 1. Movimiento
    "m-siguiente": () => navegar(() => { e.m.paso++; }),
    "m-atras": () => navegar(() => { e.m.paso--; }, "atras"),
    "m-reiniciar-paso": () => navegar(() => { e.m.paso = 0; }, "atras"),
    "m-cuenta": () => abrirCapa("cuenta"),
    "m-catalogo": () => abrirCapa("catalogo"),
    // 2. Cuenta
    "k-abrir": () => { e.k.pagina = null; e.k.dir = ""; abrirCapa("cuenta"); },
    "k-tema": () => { e.k.tema = v; e.k.dir = ""; pintar(); },
    "k-ir": () => { e.k.pagina = v; e.k.dir = "adelante"; pintar(); },
    "k-volver": () => { e.k.pagina = null; e.k.dir = "atras"; pintar(); },
    "k-hueco": () => abrirDesdeCuentaHoy("descartados-hoy"),
    // 3. Tableros
    "t-abrir": () => navegar(() => { e.t.abierto = +v; e.t.menu = false; e.t.renombrando = false; }),
    "t-volver": () => navegar(() => { e.t.abierto = null; e.t.menu = false; e.t.renombrando = false; }, "atras"),
    "t-siguiente": () => navegar(() => { e.t.abierto++; }),
    "t-menu": () => { e.t.menu = !e.t.menu; pintar(); },
    "t-menu-cerrar": () => { e.t.menu = false; pintar(); },
    "t-renombrar": () => { e.t.nombreAntes = e.t.lista[e.t.abierto].nombre; e.t.menu = false; e.t.renombrando = true; pintar(); const i = document.getElementById("t-nombre-p"); i?.focus(); i?.select(); },
    "t-nombre-listo": () => { const x = e.t.lista[e.t.abierto]; if (!x.nombre.trim()) x.nombre = e.t.nombreAntes; e.t.renombrando = false; pintar(); },
    "t-quitar": () => {
      const i = e.t.abierto, x = e.t.lista[i];
      e.t.quitado = { i, x };
      navegar(() => { e.t.lista.splice(i, 1); e.t.abierto = null; e.t.menu = false; }, "atras");
      notificar(`Quitaste ${x.nombre}`, { texto: "Deshacer", a: "t-deshacer" });
    },
    "t-deshacer": () => { const q = e.t.quitado; if (q) { e.t.lista.splice(q.i, 0, q.x); e.t.quitado = null; } e.notif = null; pintar(); },
    "t-agregar": () => { const n = { nombre: `Tablero ${e.t.lista.length + 1}`, ubic: "", tension: "", circ: "", fotos: 0, faltan: 3 }; e.t.lista.push(n); navegar(() => { e.t.abierto = e.t.lista.length - 1; }); },
    // 4. Catálogo
    "c-abrir": () => { e.c.pieNuevo = false; abrirCapa("catalogo"); },
    "c-mas": () => { const antes = Object.values(e.c.cant).filter((n) => n > 0).length; e.c.cant[v] = (e.c.cant[v] ?? 0) + 1; e.c.pieNuevo = antes === 0; pintar(); e.c.pieNuevo = false; },
    "c-menos": () => { e.c.cant[v] = Math.max(0, (e.c.cant[v] ?? 0) - 1); pintar(); },
    // 5. Croquis
    "x-listo": () => notificar("En la app: guarda el croquis y pasa a «Firma del cliente»."),
    // 6 y 7. Firma
    "f-entregar": () => { e.f.paso = "entrega"; e.f.trazo = false; abrirCapa("firma"); },
    "f-ya": () => { e.f.paso = "firmar"; e.f.fundir = true; pintar(); e.f.fundir = false; },
    "f-trazar": () => { e.f.trazo = true; pintar(); },
    "f-borrar": () => { e.f.trazo = false; pintar(); },
    "f-firmar": () => cerrarCapa(() => { e.f.firmada = true; e.f.recien = true; pintar(); e.f.recien = false; }),
    "f-otra": () => abrirCapa("otra"),
    "f-otra-si": () => cerrarCapa(() => { e.f.paso = "firmar"; e.f.trazo = false; abrirCapa("firma"); }),
    "f-revisar": () => { e.caso = "repaso"; reiniciar(); pintar(); },
    // 8. Repaso
    "r-completar": () => { e.r.completar = true; notificar("Tensión de Tablero piso 4: 120 V"); },
    // 9. Enviados
    "n-abrir": () => navegar(() => { e.n.detalle = +v; }),
    "n-volver": () => navegar(() => { e.n.detalle = null; }, "atras"),
    // 10. Datos
    "d-limpiar": () => { e.d.paso = "antes"; e.d.limpio = true; pintar(); },
    "d-abrir": () => { e.d.limpio = true; if (hoy()) { e.d.paso = "despues"; pintar(); return; } e.d.paso = "saliendo"; pintar(); luego(() => { e.d.paso = "despues"; pintar(); }, dur(380)); },
  };
  if (acciones[a]) { ev.preventDefault(); acciones[a](); }
});
reiniciar();
pintar();
</script>
</body>
</html>
