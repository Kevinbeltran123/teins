<title>Base visual de TEINS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Base visual «Precisión» (elegida por Kevin el 2026-09-29): Geist, grises fríos casi neutros, el azul TEINS solo en
   la acción, pesos de 400 a 600, radios de 7 a 12 px, bordes de 1 px. Seis pantallas clave en claro, oscuro y sistema.
   La página alrededor sigue el tema del visor; la app, el que se elige arriba. */
:root {
  --pagina: #ECEEF2; --pagina-texto: #14161A; --pagina-sec: #50555F; --pagina-panel: #FFFFFF; --pagina-borde: #D6DAE1; --pagina-foco: #1F4FD1;
  --curva: cubic-bezier(0.2, 0, 0, 1);
  --fuente: "Geist", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --pagina: #050608; --pagina-texto: #ECEEF2; --pagina-sec: #9BA1AD; --pagina-panel: #0E1116; --pagina-borde: #20252E; --pagina-foco: #8FB0FF; }
}
:root[data-theme="dark"] { color-scheme: dark; --pagina: #050608; --pagina-texto: #ECEEF2; --pagina-sec: #9BA1AD; --pagina-panel: #0E1116; --pagina-borde: #20252E; --pagina-foco: #8FB0FF; }

/* ---- La app: tema claro ---- */
.app, .app[data-tema="claro"] {
  color-scheme: light;
  --fondo: #FAFAFB; --sup: #FFFFFF; --sup2: #F3F4F6; --sup3: #E9EBEF; --linea: #E5E7EB; --linea-fuerte: #D5D8DE;
  --texto: #111317; --sec: #5E646E; --ter: #6F7580;
  --marca: #2F5FE8; --marca-texto: #FFFFFF; --marca-suave: rgba(47,95,232,.09); --marca-borde: rgba(47,95,232,.35);
  --ok: #188A5B; --alerta: #A15C00; --peligro: #D22F34; --peligro-texto: #FFFFFF; --revision: #6B4FD3;
  --sombra-capa: 0 0 0 1px rgba(17,19,23,.08), 0 18px 48px rgba(17,19,23,.16);
  --sombra-boton: 0 1px 2px rgba(17,19,23,.06);
  --velo: rgba(17,19,23,.28); --vitrina: #EEF1F7; --vitrina-punto: rgba(47,95,232,.16);
}
/* ---- La app: tema oscuro ---- */
.app[data-tema="oscuro"] {
  color-scheme: dark;
  --fondo: #0A0B0D; --sup: #111316; --sup2: #17191D; --sup3: #1E2126; --linea: #23262C; --linea-fuerte: #2E323A;
  --texto: #EDEEF0; --sec: #8B9099; --ter: #7C828C;
  --marca: #3B6FF5; --marca-texto: #FFFFFF; --marca-suave: rgba(59,111,245,.14); --marca-borde: rgba(110,150,255,.45);
  --ok: #3DBE8B; --alerta: #E8A33D; --peligro: #E5484D; --peligro-texto: #FFFFFF; --revision: #A38BFA;
  --sombra-capa: 0 0 0 1px rgba(255,255,255,.06), 0 16px 48px rgba(0,0,0,.55);
  --sombra-boton: 0 1px 2px rgba(0,0,0,.4);
  --velo: rgba(3,4,6,.62); --vitrina: #0C1120; --vitrina-punto: rgba(110,150,255,.16);
}
/* ---- Del sistema: el claro de arriba, o el oscuro si el equipo lo pide ---- */
@media (prefers-color-scheme: dark) {
  .app[data-tema="sistema"] {
    color-scheme: dark;
    --fondo: #0A0B0D; --sup: #111316; --sup2: #17191D; --sup3: #1E2126; --linea: #23262C; --linea-fuerte: #2E323A;
    --texto: #EDEEF0; --sec: #8B9099; --ter: #7C828C;
    --marca: #3B6FF5; --marca-texto: #FFFFFF; --marca-suave: rgba(59,111,245,.14); --marca-borde: rgba(110,150,255,.45);
    --ok: #3DBE8B; --alerta: #E8A33D; --peligro: #E5484D; --peligro-texto: #FFFFFF; --revision: #A38BFA;
    --sombra-capa: 0 0 0 1px rgba(255,255,255,.06), 0 16px 48px rgba(0,0,0,.55);
    --sombra-boton: 0 1px 2px rgba(0,0,0,.4);
    --velo: rgba(3,4,6,.62); --vitrina: #0C1120; --vitrina-punto: rgba(110,150,255,.16);
  }
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--pagina); color: var(--pagina-texto); font-family: var(--fuente); padding-inline: 16px; padding-block: 28px 56px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pagina-foco); outline-offset: 2px; }

/* ---------- La página del prototipo ---------- */
.envoltura { max-width: 1400px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }
.cabeza { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.cabeza h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.cabeza p { margin: 6px 0 0; color: var(--pagina-sec); max-width: 62ch; line-height: 1.5; font-size: 15px; }
.mandos { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.segmentos { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--pagina-panel); border: 1px solid var(--pagina-borde); flex-wrap: wrap; }
.segmentos button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; font-weight: 500; font-size: 14px; color: var(--pagina-sec); }
.segmentos button[aria-pressed="true"] { background: var(--pagina-texto); color: var(--pagina); }
.porque { color: var(--pagina-sec); font-size: 14px; line-height: 1.5; max-width: 90ch; margin: 0; }
.porque b { color: var(--pagina-texto); font-weight: 600; }

/* ---------- La app ---------- */
.app { font-family: var(--fuente); color: var(--texto); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.app svg { width: 16px; height: 16px; flex: none; stroke-width: 1.6; }
.escena { display: flex; justify-content: center; }
.ventana { width: 100%; position: relative; overflow: hidden; isolation: isolate; border-radius: 12px; background: var(--fondo); box-shadow: 0 0 0 1px var(--linea-fuerte), 0 30px 80px rgba(0,0,0,.22); height: 680px; display: grid; grid-template-columns: 208px minmax(0, 1fr); }
.ventana.sola { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 760px) { .ventana { grid-template-columns: minmax(0, 1fr); height: 720px; } .menu { display: none; } }
.menu { border-right: 1px solid var(--linea); padding: 16px 10px; display: flex; flex-direction: column; gap: 18px; }
.marca-app { display: flex; align-items: center; gap: 9px; padding: 2px 8px; font-weight: 600; font-size: 14px; letter-spacing: .06em; }
.marca-app i { width: 20px; height: 20px; border-radius: 5px; background: var(--marca); display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.menu nav { display: flex; flex-direction: column; gap: 1px; }
.menu .grupo { font-size: 12px; color: var(--ter); padding: 10px 8px 4px; font-weight: 500; }
.menu a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: 7px; color: var(--sec); text-decoration: none; font-size: 13px; }
.menu a:hover { background: var(--sup2); color: var(--texto); }
.menu a[aria-current="page"] { background: var(--sup2); color: var(--texto); font-weight: 500; }
.menu a[aria-current="page"] svg { color: var(--marca); }
.menu a .cuenta-num { margin-left: auto; font-size: 12px; color: var(--sec); font-weight: 500; }
.menu .cuenta { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--linea); font-size: 13px; }
.avatar { width: 26px; height: 26px; border-radius: 99px; background: var(--sup3); display: grid; place-items: center; font-size: 11px; font-weight: 500; flex: none; }
.menu .cuenta small { display: block; color: var(--ter); font-size: 12px; }
.contenido { min-width: 0; overflow: auto; display: flex; flex-direction: column; }
.barra-sup { height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--linea); font-size: 13px; color: var(--sec); }
.barra-sup b { color: var(--texto); font-weight: 500; }
.pagina { padding: 22px 28px 60px; display: flex; flex-direction: column; gap: 18px; }
.cab { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; }
.cab h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.cab .datos { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--sec); font-size: 13px; }
.cab .datos span + span::before { content: "·"; margin-right: 14px; color: var(--ter); }
.acciones { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.estado { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 500; color: var(--revision); background: color-mix(in srgb, var(--revision) 12%, transparent); white-space: nowrap; }
.estado i { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
.estado.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.estado.enviado { color: var(--marca); background: var(--marca-suave); }
.estado.gris { color: var(--sec); background: var(--sup2); }
.guardado { display: inline-flex; align-items: center; gap: 7px; color: var(--sec); font-size: 13px; }
.guardado i { width: 6px; height: 6px; border-radius: 99px; background: var(--alerta); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 7px; border: 0; font-size: 13px; font-weight: 500; background: var(--sup); color: var(--texto); box-shadow: inset 0 0 0 1px var(--linea-fuerte), var(--sombra-boton); white-space: nowrap; transition: background .15s var(--curva), transform .12s var(--curva); }
.btn:hover { background: var(--sup2); }
.btn:active { transform: translateY(1px); }
.btn.principal { background: var(--marca); color: var(--marca-texto); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), var(--sombra-boton); }
.btn.principal:hover { filter: brightness(1.06); }
.btn.grande { height: 40px; padding: 0 16px; font-size: 14px; border-radius: 8px; }
.btn.ancho { width: 100%; }
.kbd { font-size: 11px; opacity: .6; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; line-height: 16px; }

/* Pestañas y búsqueda de la bandeja */
.barra-lista { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--linea); }
.pestanas { display: flex; gap: 18px; }
.pestanas button { border: 0; background: none; padding: 10px 0; margin-bottom: -1px; font-size: 13px; color: var(--sec); border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center; }
.pestanas button span { font-size: 12px; color: var(--ter); }
.pestanas button[aria-selected="true"] { color: var(--texto); font-weight: 500; border-bottom-color: var(--texto); }
.buscar { display: flex; align-items: center; gap: 8px; height: 32px; width: 260px; max-width: 100%; padding: 0 10px; border-radius: 7px; background: var(--sup); box-shadow: inset 0 0 0 1px var(--linea-fuerte); color: var(--ter); font-size: 13px; margin-bottom: 8px; }
.buscar kbd { margin-left: auto; font: inherit; font-size: 11px; border: 1px solid var(--linea-fuerte); border-radius: 4px; padding: 0 4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--sec); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
td { padding: 0 10px; height: 44px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: var(--sup2); }
td .principal-celda { font-weight: 500; }
td .sec { color: var(--sec); }
td.num, th.num { text-align: right; }
.espera { color: var(--sec); }
.espera.larga { color: var(--alerta); font-weight: 500; }
.persona { display: inline-flex; align-items: center; gap: 8px; }
.persona .avatar { width: 22px; height: 22px; font-size: 10px; }

/* Detalle */
.detalle { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 28px; }
@media (max-width: 980px) { .detalle { grid-template-columns: minmax(0, 1fr); } }
.seccion h2 { margin: 0 0 6px; font-size: 13px; font-weight: 500; color: var(--sec); }
.dato { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 16px; padding: 11px 0; border-top: 1px solid var(--linea); }
.dato:last-child { border-bottom: 1px solid var(--linea); }
.dato .n { color: var(--sec); }
.dato .v b { font-weight: 500; font-size: 15px; }
.dato .v small { color: var(--sec); margin-left: 3px; }
.fotos { display: flex; gap: 6px; }
.fotos i { width: 54px; height: 40px; border-radius: 5px; background: linear-gradient(135deg, var(--sup3), var(--sup2)); box-shadow: inset 0 0 0 1px var(--linea-fuerte); display: block; }
.carril { display: flex; flex-direction: column; gap: 14px; }
.panel { border: 1px solid var(--linea); border-radius: 10px; background: var(--sup); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.panel h3 { margin: 0; font-size: 13px; font-weight: 500; }
.panel p { margin: 0; color: var(--sec); font-size: 13px; line-height: 1.45; }
.comentario { display: flex; gap: 8px; font-size: 13px; }
.comentario .avatar { width: 22px; height: 22px; font-size: 10px; }
.comentario small { display: block; color: var(--ter); }

/* Cotización: el editor a la izquierda y el documento en vivo a la derecha (Mercury, Revolut Business, Acctual) */
.cot { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; flex: 1; }
@media (max-width: 1100px) { .cot { grid-template-columns: minmax(0, 1fr); } .lienzo { display: none; } }
.editor { min-width: 0; overflow: auto; padding: 22px 26px 60px; display: flex; flex-direction: column; gap: 22px; border-right: 1px solid var(--linea); }
.editor .cab h1 { font-size: 20px; }
.bloque { display: flex; flex-direction: column; gap: 8px; }
.bloque > h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--sec); }
.lineas { display: flex; flex-direction: column; border-top: 1px solid var(--linea); }
.linea { display: grid; grid-template-columns: minmax(0, 1fr) 64px 104px 92px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--linea); font-size: 13px; }
.linea.cab-l { color: var(--sec); font-size: 12px; padding: 6px 0; }
.linea .desc b { font-weight: 500; display: block; }
.linea .num { text-align: right; }
.celda-precio { width: 100%; height: 30px; border-radius: 6px; border: 0; background: var(--sup); box-shadow: inset 0 0 0 1px var(--linea-fuerte); text-align: right; padding: 0 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.celda-precio:focus { outline: none; box-shadow: inset 0 0 0 1px var(--marca), 0 0 0 3px var(--marca-suave); }
.origen { display: block; font-size: 12px; color: var(--ter); }
.agregar-linea { align-self: flex-start; border: 0; background: none; color: var(--marca); font-size: 13px; font-weight: 500; padding: 4px 0; display: inline-flex; gap: 6px; align-items: center; }
.opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opcion { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--linea); background: var(--sup); cursor: pointer; font-size: 13px; }
.opcion input { margin: 2px 0 0; accent-color: var(--marca); }
.opcion.elegida { box-shadow: inset 0 0 0 1px var(--marca-borde); background: var(--marca-suave); }
.opcion small { display: block; color: var(--sec); font-size: 12px; }
.fila-campos { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; }
.campo-c { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--sec); }
.campo-c input { height: 32px; border-radius: 7px; border: 0; background: var(--sup); box-shadow: inset 0 0 0 1px var(--linea-fuerte); padding: 0 10px; font-size: 13px; color: var(--texto); }
.resumen { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; border-top: 1px solid var(--linea); font-size: 13px; color: var(--sec); }
.resumen b { font-size: 18px; font-weight: 600; color: var(--texto); letter-spacing: -0.01em; }
.destinos { display: flex; flex-direction: column; border-top: 1px solid var(--linea); }
.destinos label { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--linea); font-size: 13px; cursor: pointer; }
.destinos input { accent-color: var(--marca); }
.destinos small { color: var(--sec); margin-left: auto; font-size: 12px; }
/* El lienzo: la hoja del PDF sobre el fondo, siempre en papel blanco */
.lienzo { min-width: 0; overflow: auto; background: var(--sup2); display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 24px 32px; }
.lienzo-cab { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; }
.lienzo-cab .nota-l { font-size: 12px; color: var(--ter); }
.segmento-app { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--sup3); gap: 2px; }
.segmento-app button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; font-size: 12.5px; color: var(--sec); }
.segmento-app button[aria-pressed="true"] { background: var(--sup); color: var(--texto); box-shadow: var(--sombra-boton); font-weight: 500; }
.hoja-pdf { width: 100%; max-width: 520px; background: #FFFFFF; color: #15171A; border-radius: 4px; box-shadow: 0 0 0 1px rgba(17,19,23,.08), 0 10px 30px rgba(17,19,23,.14); padding: 34px 34px 40px; font-size: 10.5px; line-height: 1.5; display: flex; flex-direction: column; gap: 18px; }
.hoja-pdf .enc { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1.5px solid #002B81; padding-bottom: 12px; }
.hoja-pdf .enc b { font-size: 15px; font-weight: 600; color: #002B81; letter-spacing: .02em; }
.hoja-pdf .enc span { display: block; color: #525152; }
.hoja-pdf .enc .der { text-align: right; }
.hoja-pdf .enc .der b { color: #15171A; font-size: 12px; }
.hoja-pdf .partes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hoja-pdf .etq { font-size: 9px; color: #525152; text-transform: uppercase; letter-spacing: .06em; }
.hoja-pdf table { width: 100%; border-collapse: collapse; font-size: 10px; }
.hoja-pdf th { text-align: left; font-weight: 600; color: #525152; font-size: 9px; padding: 5px 4px; border-bottom: 1px solid #E1E4EA; background: #F3F6FC; }
.hoja-pdf td { padding: 6px 4px; height: auto; border-bottom: 1px solid #E1E4EA; white-space: normal; }
.hoja-pdf .num { text-align: right; }
.hoja-pdf .tot { align-self: flex-end; width: 58%; display: flex; flex-direction: column; }
.hoja-pdf .tot div { display: flex; justify-content: space-between; padding: 3px 0; color: #525152; }
.hoja-pdf .tot div span:last-child { color: #15171A; }
.hoja-pdf .tot .gran { border-top: 1.5px solid #002B81; margin-top: 4px; padding-top: 7px; font-weight: 600; font-size: 12px; color: #15171A; }
.hoja-pdf .cambio { animation: resaltar 1.2s var(--curva); border-radius: 2px; }
@keyframes resaltar { from { background: rgba(47,95,232,.18); } }
.correo { width: 100%; max-width: 520px; background: var(--sup); border-radius: 10px; box-shadow: 0 0 0 1px var(--linea); padding: 18px 20px; font-size: 13px; line-height: 1.55; display: flex; flex-direction: column; gap: 10px; }
.correo .meta { color: var(--sec); font-size: 12px; display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 4px 10px; padding-bottom: 10px; border-bottom: 1px solid var(--linea); }
.correo .adjunto { display: inline-flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--linea-fuerte); font-size: 12px; align-self: flex-start; }

/* Inicio de sesión: el formulario a la izquierda y el producto en uso a la derecha (Laravel Cloud, folk, Pin) */
.ingreso { height: 100%; display: grid; grid-template-columns: minmax(360px, 0.9fr) minmax(0, 1.1fr); }
@media (max-width: 900px) { .ingreso { grid-template-columns: minmax(0, 1fr); } .vitrina { display: none; } }
.lado-form { display: flex; flex-direction: column; padding: 26px 32px; }
.lado-form .marca-app { padding: 0; }
.centro-form { flex: 1; display: flex; align-items: center; justify-content: center; }
.caja-ingreso { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 22px; }
.caja-ingreso .titulo { display: flex; flex-direction: column; gap: 4px; }
.caja-ingreso h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.caja-ingreso .titulo p { margin: 0; color: var(--sec); font-size: 13.5px; }
.caja-ingreso form { display: flex; flex-direction: column; gap: 14px; }
.caja-ingreso .campo { display: flex; flex-direction: column; gap: 6px; }
.caja-ingreso .fila-etq { display: flex; justify-content: space-between; align-items: baseline; }
.caja-ingreso label { font-size: 13px; font-weight: 500; }
.caja-ingreso .fila-etq a { font-size: 12px; color: var(--sec); text-decoration: none; }

const miles = (n) => Math.round(n).toLocaleString("es-CO");
const cot = {
  imp: "aiu", vista: "pdf",
  lineas: [
    { d: "Cable UTP categoría 6A", o: "UTP-6A · Del catálogo", c: 30, u: "m", p: 4800 },
    { d: "Canaleta metálica 40 × 25", o: "CAN-40 · Del catálogo", c: 12, u: "und", p: 18500 },
    { d: "Mano de obra de instalación", o: "Agregada en oficina", c: 1, u: "gl", p: 850000 },
  ],
};
function totales() {
  const subtotal = cot.lineas.reduce((s, l) => s + l.c * l.p, 0);
  if (cot.imp === "iva") return { subtotal, filas: [["IVA 19 %", subtotal * 0.19]], total: subtotal * 1.19 };
  const a = subtotal * 0.1, i = subtotal * 0.03, u = subtotal * 0.05, iu = u * 0.19;
  return { subtotal, filas: [["Administración 10 %", a], ["Imprevistos 3 %", i], ["Utilidad 5 %", u], ["IVA 19 % sobre la utilidad", iu]], total: subtotal + a + i + u + iu };
}
function hojaPdf() {
  const t = totales();
  return `<div class="hoja-pdf" aria-label="Vista previa del PDF">
    <div class="enc"><div><b>TEINS</b><span>[LOGO] · NIT [N] · [Dirección]</span></div><div class="der"><b>Cotización COT-2026-0045</b><span>Versión 1 · 29 de septiembre de 2026</span><span>Válida hasta el 29 de octubre de 2026</span></div></div>
    <div class="partes"><div><span class="etq">Cliente</span><div><b>Clínica Santa Fe</b></div><span>[NIT del cliente]</span></div><div><span class="etq">Sitio</span><div><b>Sede Norte</b></div><span>Calle [N] # [N]-[N] · visita del 28 sept 2026</span></div></div>
    <table><thead><tr><th>Descripción</th><th class="num">Cant.</th><th>Und</th><th class="num">Precio</th><th class="num">Total</th></tr></thead><tbody>
      ${cot.lineas.map((l, i) => `<tr><td>${l.d}</td><td class="num">${l.c}</td><td>${l.u}</td><td class="num" data-t="pdf-precio-${i}">$ ${miles(l.p)}</td><td class="num" data-t="pdf-linea-${i}">$ ${miles(l.c * l.p)}</td></tr>`).join("")}
    </tbody></table>
    <div class="tot" data-t="pdf-tot">${filasTotales(t)}</div>
    <div><span class="etq">Condiciones</span><div>Validez: 30 días. Forma de pago: 50 % al aprobar, 50 % al entregar.</div></div>
  </div>`;
}
const filasTotales = (t) => `<div><span>Subtotal</span><span>$ ${miles(t.subtotal)}</span></div>${t.filas.map(([n, v]) => `<div><span>${n}</span><span>$ ${miles(v)}</span></div>`).join("")}<div class="gran"><span>Total</span><span>$ ${miles(t.total)}</span></div>`;
function correo() {
  return `<div class="correo" aria-label="Vista previa del correo">
    <div class="meta"><span>Para</span><span>Marta Gil &lt;compras@cliente.example&gt;</span><span>Asunto</span><span>Cotización COT-2026-0045 · Sede Norte</span></div>
    <p style="margin:0">Hola, Marta:</p>
    <p style="margin:0">Adjuntamos la cotización COT-2026-0045 para la Sede Norte, de la visita del 28 de septiembre. El total es de <b data-t="correo-total">$ ${miles(totales().total)}</b> y la oferta es válida por 30 días.</p>
    <p style="margin:0;color:var(--sec)">TEINS</p>
    <span class="adjunto">${ic("doc")}Cotización COT-2026-0045 - Clínica Santa Fe - versión 1.pdf</span>
  </div>`;
}
/* Al escribir no se vuelve a pintar la pantalla (se perdería el foco): solo cambian las cifras, con un destello. */
function recalcular(cambio) {
  const t = totales();
  const poner = (k, v) => { const el = document.querySelector(`[data-t="${k}"]`); if (el) { el.textContent = v; el.classList.remove("cambio"); void el.offsetWidth; el.classList.add("cambio"); } };
  cot.lineas.forEach((l, i) => { if (cambio === undefined || cambio === i) { poner(`linea-${i}`, `$ ${miles(l.c * l.p)}`); poner(`pdf-precio-${i}`, `$ ${miles(l.p)}`); poner(`pdf-linea-${i}`, `$ ${miles(l.c * l.p)}`); } });
  poner("total", `$ ${miles(t.total)}`); poner("correo-total", `$ ${miles(t.total)}`);
  const tot = document.querySelector('[data-t="pdf-tot"]'); if (tot) tot.innerHTML = filasTotales(t);
}
document.addEventListener("input", (ev) => {
  const i = ev.target.dataset?.precio;
  if (i === undefined) return;
  const n = Number(ev.target.value.replace(/\D/g, ""));
  cot.lineas[+i].p = n;
  ev.target.value = n ? miles(n) : "";
  recalcular(+i);
});
document.addEventListener("change", (ev) => { if (ev.target.name === "imp") { cot.imp = ev.target.value; pintar(); } });
document.addEventListener("click", (ev) => { const b = ev.target.closest("[data-vista]"); if (b) { cot.vista = b.dataset.vista; pintar(); } });

const VITRINA = [{ d: "Cable UTP 6A", c: 30, p: 4800 }, { d: "Canaleta 40 × 25", c: 12, p: 18500 }, { d: "Mano de obra", c: 1, p: 850000 }];
const totalVitrina = () => VITRINA.reduce((s, l) => s + l.c * l.p, 0) * 1.19;
/* Cada pocos segundos alguien "escribe" un precio y la hoja del cliente cambia: la función que distingue a TEINS, en uso. */
let reloj;
function animarVitrina() {
  clearInterval(reloj);
  if (e.pantalla !== "ingreso" || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const precios = [[4800, 5200], [18500, 17900], [850000, 920000]];
  let paso = 0;
  reloj = setInterval(() => {
    const i = paso % 3, par = precios[i];
    VITRINA[i].p = VITRINA[i].p === par[0] ? par[1] : par[0];
    const poner = (k, v, clase) => { const el = document.querySelector(`[data-v="${k}"]`); if (!el) return; el.textContent = v; if (clase) { el.classList.remove(clase); void el.offsetWidth; el.classList.add(clase); } };
    const campo = document.querySelector(`[data-v="p-${i}"]`);
    campo?.classList.add("escribiendo");
    poner(`p-${i}`, miles(VITRINA[i].p));
    setTimeout(() => {
      campo?.classList.remove("escribiendo");
      poner(`t-${i}`, `$ ${miles(VITRINA[i].p * VITRINA[i].c)}`);
      poner(`h-${i}`, `$ ${miles(VITRINA[i].p * VITRINA[i].c)}`, "flash");
      poner("total", `$ ${miles(totalVitrina())}`, "flash");
    }, 450);
    paso++;
  }, 2800);
}

const e = { pantalla: "ingreso", tema: "sistema" };
function pintar() {
  document.getElementById("pantallas").innerHTML = Object.entries(PANTALLAS).map(([k, p]) => `<button data-p="${k}" aria-pressed="${k === e.pantalla}">${p.nombre}</button>`).join("");
  document.getElementById("porque").innerHTML = PANTALLAS[e.pantalla].porque;
  const app = document.getElementById("app");
  app.dataset.tema = e.tema;
  app.innerHTML = `<div class="escena">${PANTALLAS[e.pantalla].html()}</div>`;
  document.querySelectorAll("#temas button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tema === e.tema)));
  animarVitrina();
}
document.getElementById("pantallas").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) { e.pantalla = b.dataset.p; pintar(); } });
document.getElementById("temas").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) { e.tema = b.dataset.tema; pintar(); } });
pintar();
</script>
