<title>Oficina · Recorrido</title>
<meta name="description" content="Prototipo navegable de TEINS Oficina con la identidad visual Recorrido de campo. Datos inventados.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=swap">
<style>
/* Prototipo de oficina con la identidad Recorrido. El movimiento es CSS; el JavaScript cambia de pantalla y guarda estado. */
:root {
  --fuente: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --curva: cubic-bezier(0.2, 0, 0, 1);
  --resorte: linear(0, 0.35 12%, 0.75 25%, 1.02 40%, 1.06 50%, 1.02 62%, 1 78%, 1);
  /* Página del prototipo (fuera de la app) */
  --pagina: #E9ECF1; --pagina-texto: #15171A; --pagina-sec: #525152; --pagina-panel: #FFFFFF; --pagina-borde: #D5DAE3;
  /* App, tema oscuro (identidad Recorrido) */
  --fondo: #0B0F17; --sup: #151B26; --sup2: #1E2634; --sup3: #273042; --borde: #2C3647; --texto: #F3F5F9; --sec: #AEB6C6;
  --marca: #6E9BFF; --marca-texto: #0B0F17; --senal: #FFC21A; --senal-texto: #0B0F17;
  --exito: #3DD68C; --alerta: #FFB547; --peligro: #FF8A8A; --peligro-fondo: #FF6B6B; --peligro-texto: #0B0F17;
  --e-enviado: #7FA8FF; --e-revision: #C3A6FF; --e-revisado: #3DD68C; --e-borrador: #AEB6C6; --e-publicado: #6E9BFF; --e-anulado: #FF8A8A;
  --papel: #F7F4EC; --tinta: #1B2230;
  --sombra: 0 24px 60px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.3);
  --r-control: 12px; --r-panel: 20px; --r-capa: 26px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --pagina: #0A0D14; --pagina-texto: #EEF1F6; --pagina-sec: #A7ADB9; --pagina-panel: #141A25; --pagina-borde: #262E3D; }
}
:root[data-theme="dark"] { color-scheme: dark; --pagina: #0A0D14; --pagina-texto: #EEF1F6; --pagina-sec: #A7ADB9; --pagina-panel: #141A25; --pagina-borde: #262E3D; }

/* Oficina en claro: mismos papeles, el azul de TEINS como acción */
.app[data-tema="claro"] {
  color-scheme: light;
  --fondo: #F2F4F7; --sup: #FFFFFF; --sup2: #EEF1F5; --sup3: #E3E8EF; --borde: #DCE1E9; --texto: #0E1116; --sec: #4A4F59;
  --marca: #002B81; --marca-texto: #FFFFFF; --senal: #FFC21A; --senal-texto: #0E1116;
  --exito: #0B7A5C; --alerta: #9A5B00; --peligro: #B42318; --peligro-fondo: #B42318; --peligro-texto: #FFFFFF;
  --e-enviado: #1C4E9E; --e-revision: #5B2E91; --e-revisado: #0B5E50; --e-borrador: #4A4F59; --e-publicado: #002B81; --e-anulado: #8E1D33;
  --sombra: 0 24px 60px rgba(14,17,22,.16), 0 2px 8px rgba(14,17,22,.08);
}
.app { color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--pagina); color: var(--pagina-texto); font-family: var(--fuente); padding-inline: 16px; padding-block: 20px 40px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--senal); outline-offset: 2px; }

/* ---------- Guía del prototipo ---------- */
.guia { max-width: 1440px; margin: 0 auto 16px; display: grid; gap: 14px; }
.guia-cabeza { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.guia h1 { margin: 0; font-size: 28px; font-weight: 800; line-height: 1.1; text-wrap: balance; }
.guia p { margin: 4px 0 0; color: var(--pagina-sec); line-height: 1.5; max-width: 70ch; }
.ceja { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pagina-sec); }
.controles { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grupo { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--pagina-panel); border: 1px solid var(--pagina-borde); }
.grupo button { border: 0; background: none; border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 700; color: var(--pagina-sec); }
.grupo button[aria-pressed="true"] { background: var(--pagina-texto); color: var(--pagina); }
.grupo-titulo { font-size: 12px; font-weight: 800; color: var(--pagina-sec); margin-right: 2px; }
.mapa { display: flex; flex-wrap: wrap; gap: 6px; }
.mapa button { border: 1px solid var(--pagina-borde); background: var(--pagina-panel); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 700; color: var(--pagina-texto); }
.mapa button[aria-current="true"] { background: var(--pagina-texto); color: var(--pagina); border-color: var(--pagina-texto); }
.refs { background: var(--pagina-panel); border: 1px solid var(--pagina-borde); border-radius: 16px; padding: 12px 16px; font-size: 14px; line-height: 1.5; color: var(--pagina-sec); }
.refs strong { color: var(--pagina-texto); }
.refs a { color: inherit; font-weight: 700; }

/* ---------- La app ---------- */
.marco-app { max-width: 1440px; margin: 0 auto; border-radius: 22px; overflow: clip; border: 1px solid var(--pagina-borde); box-shadow: 0 30px 80px rgba(0,0,0,.18); }
.app { background: var(--fondo); color: var(--texto); font-size: 15px; line-height: 1.45; min-height: 860px; display: grid; grid-template-columns: 248px minmax(0, 1fr); position: relative; overflow: clip; font-variant-numeric: tabular-nums; }
.app.sin-marco { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 1100px) { .app { grid-template-columns: 76px minmax(0, 1fr); } .menu .txt, .menu .marca small, .menu .usuario .quien { display: none; } .menu a, .menu .usuario { justify-content: center; } .menu .cuenta-num { position: absolute; top: 4px; right: 8px; } }
@media (max-width: 640px) { .app { grid-template-columns: minmax(0, 1fr); } .menu { position: static; flex-direction: row; overflow-x: auto; padding: 8px; gap: 4px; } .menu .marca, .menu .pie, .menu hr { display: none; } .menu nav { flex-direction: row; } }

/* Menú lateral */
.menu { background: var(--fondo); border-right: 1px solid var(--borde); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; align-self: start; min-height: 860px; }
.marca { display: flex; align-items: baseline; gap: 8px; padding: 0 10px; }
.marca b { font-size: 20px; font-weight: 800; letter-spacing: .06em; }
.marca small { color: var(--sec); font-weight: 700; }
.menu nav { display: flex; flex-direction: column; gap: 2px; }
.menu a { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 14px; color: var(--sec); text-decoration: none; font-weight: 700; cursor: pointer; transition: background .2s var(--curva), color .2s var(--curva); }
.menu a:hover { background: var(--sup); color: var(--texto); }
.menu a[aria-current="page"] { background: var(--sup2); color: var(--texto); }
.menu a[aria-current="page"]::before { content: ""; position: absolute; left: -14px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--senal); }
.menu a svg { flex: none; }
.cuenta-num { margin-left: auto; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--senal); color: var(--senal-texto); font-size: 13px; font-weight: 800; display: inline-grid; place-items: center; animation: latido 2.4s var(--curva) infinite; }
.menu hr { border: 0; border-top: 1px solid var(--borde); margin: 6px 10px; }
.menu .pie { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.usuario { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; cursor: pointer; color: inherit; text-decoration: none; }
.usuario:hover { background: var(--sup); }
.avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--sup3); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.quien { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.quien small { color: var(--sec); font-size: 13px; }
.usuario .salir { margin-left: auto; }

/* Contenido */
.contenido { min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 60px; }
.contenido-interior { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; view-transition-name: contenido; }
.sin-conexion { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 14px; background: color-mix(in srgb, var(--alerta) 14%, var(--sup)); font-weight: 700; }
.sin-conexion svg { color: var(--alerta); flex: none; }

.cabeza { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.cabeza-txt { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.migas { display: inline-flex; align-items: center; gap: 6px; color: var(--sec); font-size: 13px; font-weight: 700; cursor: pointer; background: none; border: 0; padding: 0; width: fit-content; }
.migas:hover { color: var(--texto); }
.cabeza h1 { margin: 0; font-size: 28px; font-weight: 800; line-height: 1.15; letter-spacing: -.01em; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; text-wrap: balance; }
.cabeza .desc { color: var(--sec); margin: 0; }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: var(--r-control); border: 0; font-weight: 800; font-size: 15px; background: var(--sup2); color: var(--texto); transition: transform .15s var(--curva), background .2s var(--curva), opacity .2s; white-space: nowrap; }
.btn:hover { background: var(--sup3); }
.btn:active { transform: scale(.97); }
.btn.principal { background: var(--marca); color: var(--marca-texto); }
.btn.principal:hover { background: color-mix(in srgb, var(--marca) 88%, var(--texto)); }
.btn.peligro { background: var(--peligro-fondo); color: var(--peligro-texto); }
.btn.fantasma { background: transparent; color: var(--sec); }
.btn.fantasma:hover { background: var(--sup2); color: var(--texto); }
.btn.chico { min-height: 32px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.grande { min-height: 52px; padding: 0 22px; font-size: 16px; border-radius: 16px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn.ancho { width: 100%; }
.icono-btn { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--sup2); color: var(--texto); display: inline-grid; place-items: center; flex: none; transition: background .2s; }
.icono-btn:hover { background: var(--sup3); }
.icono-btn.chico { width: 32px; height: 32px; }
.icono-btn.limpio { background: transparent; color: var(--sec); }
.icono-btn.limpio:hover { background: var(--sup2); color: var(--texto); }
.icono-btn[disabled] { opacity: .3; cursor: not-allowed; }

/* Paneles */
.panel { background: var(--sup); border-radius: var(--r-panel); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.panel.sin-relleno { padding: 0; overflow: hidden; }
.panel h2, .h2 { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.25; }
.panel-cabeza { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ayuda { color: var(--sec); font-size: 13px; margin: 0; line-height: 1.45; }
.grupo-etq { font-size: 13px; font-weight: 800; color: var(--sec); letter-spacing: .02em; }

/* Insignias de estado */
.ins { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 800; white-space: nowrap; --c: var(--sec); color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }
.ins::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: currentColor; }
.ins.sin-punto::before { display: none; }
.ins.enviado { --c: var(--e-enviado); } .ins.revision { --c: var(--e-revision); } .ins.revisado { --c: var(--e-revisado); }
.ins.borrador { --c: var(--e-borrador); } .ins.publicado { --c: var(--e-publicado); } .ins.anulado { --c: var(--e-anulado); }
.ins.exito { --c: var(--exito); } .ins.alerta { --c: var(--alerta); } .ins.peligro { --c: var(--peligro); }
.ins.nuevo { --c: var(--senal); }
.ins.canal { --c: var(--sec); height: 22px; font-size: 12px; padding: 0 8px; }
.ins.canal::before { display: none; }

/* Pestañas */
.pestanas { display: flex; gap: 4px; padding: 4px; background: var(--sup); border-radius: 16px; width: fit-content; max-width: 100%; overflow-x: auto; }
.pestanas button { border: 0; background: none; min-height: 38px; padding: 0 14px; border-radius: 12px; font-weight: 800; color: var(--sec); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.pestanas button[aria-selected="true"] { background: var(--sup3); color: var(--texto); }
.pestanas .num { font-size: 13px; color: var(--sec); background: var(--sup2); border-radius: 999px; padding: 0 7px; min-width: 22px; height: 22px; display: inline-grid; place-items: center; }
.pestanas button[aria-selected="true"] .num { background: var(--fondo); color: var(--texto); }

/* Tablas */
.tabla-caja { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; color: inherit; font-size: inherit; line-height: inherit; }
th { text-align: left; font-size: 13px; font-weight: 800; color: var(--sec); padding: 12px 16px; white-space: nowrap; border-bottom: 1px solid var(--borde); }
td { padding: 14px 16px; border-bottom: 1px solid color-mix(in srgb, var(--borde) 60%, transparent); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .15s; animation: subir .45s var(--curva) both; animation-delay: calc(var(--i, 0) * 35ms); }
tbody tr.clic { cursor: pointer; }
tbody tr.clic:hover { background: var(--sup2); }
tr.resaltada td { background: color-mix(in srgb, var(--senal) 10%, transparent); }
tr.resaltada td:first-child { box-shadow: inset 4px 0 0 var(--senal); }
td .fuerte { font-weight: 800; }
td .sub { color: var(--sec); font-size: 13px; display: block; margin-top: 2px; }
td.num, th.num { text-align: right; }
.enlace { color: var(--texto); font-weight: 800; text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.enlace:hover { text-decoration: underline; text-underline-offset: 3px; }
.dia { font-size: 13px; font-weight: 800; color: var(--sec); padding: 18px 16px 8px; border-bottom: 1px solid var(--borde); background: var(--sup); }
.dia.hoy { color: var(--senal); }
.tabla-pie { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--borde); color: var(--sec); font-size: 13px; flex-wrap: wrap; }

/* Barra de herramientas de lista */
.barra { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.buscar { position: relative; flex: 1 1 280px; max-width: 420px; }
.buscar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--sec); pointer-events: none; }
.buscar input { padding-left: 42px; }

/* Campos rellenos (campo: sin borde, amarillo al enfocar) */
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo > label, .etq { font-weight: 700; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.etq small { font-weight: 700; font-size: 12px; color: var(--sec); }
.control { width: 100%; min-height: 44px; border-radius: var(--r-control); border: 2px solid transparent; background: var(--sup2); padding: 0 14px; color: var(--texto); transition: border-color .2s, box-shadow .2s; }
.control::placeholder { color: var(--sec); }
.control:focus { outline: none; border-color: var(--senal); box-shadow: 0 0 0 4px color-mix(in srgb, var(--senal) 22%, transparent); }
textarea.control { padding: 12px 14px; min-height: 96px; resize: vertical; line-height: 1.45; }
select.control { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--sec) 50%), linear-gradient(135deg, var(--sec) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
.control.error { border-color: var(--peligro); animation: sacudida .4s var(--curva); }
.msj-error { color: var(--peligro); font-size: 13px; font-weight: 700; display: flex; gap: 6px; align-items: center; }
.control.chico { min-height: 36px; border-radius: 10px; padding: 0 10px; }
.control.num { text-align: right; }

.opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.opcion { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--sup2); font-weight: 700; cursor: pointer; border: 2px solid transparent; }
.opcion input { position: absolute; opacity: 0; pointer-events: none; }
.opcion:has(input:checked) { background: var(--texto); color: var(--fondo); }
.opcion:has(input:focus-visible) { outline: 3px solid var(--senal); outline-offset: 2px; }
.casilla { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--sup2); cursor: pointer; }
.casilla input { width: 20px; height: 20px; accent-color: var(--marca); margin: 2px 0 0; flex: none; }
.casilla.apagada { opacity: .55; cursor: not-allowed; }
.lista-casillas { display: flex; flex-direction: column; gap: 6px; }

/* Avisos */
.aviso { display: flex; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--sup2); line-height: 1.45; align-items: flex-start; --c: var(--marca); box-shadow: inset 4px 0 0 var(--c); }
.aviso svg { color: var(--c); flex: none; margin-top: 1px; }
.aviso.alerta { --c: var(--alerta); } .aviso.peligro { --c: var(--peligro); } .aviso.exito { --c: var(--exito); }
.aviso .cuerpo { display: flex; flex-direction: column; gap: 8px; }

/* Punto focal de la bandeja (Jobber: barra amarilla al borde) */
.focal { position: relative; background: var(--sup); border-radius: var(--r-panel); padding: 24px 28px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 28px; align-items: center; overflow: hidden; animation: subir .5s var(--curva) both; }
.focal::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--senal); }
.focal .cifra { font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.focal .que { display: flex; flex-direction: column; gap: 6px; }
.focal .que b { font-size: 18px; }
.focal .que span { color: var(--sec); }
@media (max-width: 720px) { .focal { grid-template-columns: auto minmax(0, 1fr); } .focal .btn { grid-column: 1 / -1; } }

/* Detalle: tres zonas (índice de secciones, contenido, panel de revisión) */
.detalle { display: grid; grid-template-columns: 170px minmax(0, 1fr) 330px; gap: 24px; align-items: start; }
@media (max-width: 1280px) { .detalle { grid-template-columns: minmax(0, 1fr) 320px; } .indice { display: none; } }
@media (max-width: 900px) { .detalle { grid-template-columns: minmax(0, 1fr); } }
.indice { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 0; }
.indice button { position: relative; text-align: left; background: none; border: 0; padding: 8px 0 8px 26px; color: var(--sec); font-weight: 700; font-size: 14px; }
.indice button::before { content: ""; position: absolute; left: 6px; top: 13px; width: 10px; height: 10px; border-radius: 99px; background: var(--sup3); border: 2px solid var(--fondo); z-index: 1; }
.indice button::after { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: var(--sup3); }
.indice button:first-child::after { top: 18px; } .indice button:last-child::after { bottom: calc(100% - 18px); }
.indice button.con-cambios::before { background: var(--senal); }
.indice button.falta::before { background: var(--alerta); }
.indice button:hover { color: var(--texto); }
.indice small { display: block; font-size: 12px; color: var(--sec); font-weight: 700; }
.lateral { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 16px; }

.seccion { background: var(--sup); border-radius: var(--r-panel); overflow: hidden; animation: subir .45s var(--curva) both; animation-delay: calc(var(--i, 0) * 50ms); scroll-margin-top: 20px; }
.seccion > header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--borde); }
.seccion > header h2 { margin: 0; font-size: 18px; font-weight: 800; }
.seccion > header .paso { width: 28px; height: 28px; border-radius: 99px; background: var(--sup2); display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--sec); }
.seccion .rep { padding: 10px 20px; font-weight: 800; color: var(--sec); font-size: 13px; background: color-mix(in srgb, var(--sup2) 50%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--borde) 60%, transparent); }
.fila-dato { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 14px 20px; border-bottom: 1px solid color-mix(in srgb, var(--borde) 60%, transparent); align-items: start; position: relative; }
.fila-dato:last-child { border-bottom: 0; }
.fila-dato:hover .acc-fila { opacity: 1; }
.fila-dato .nombre { color: var(--sec); font-weight: 700; font-size: 13px; grid-column: 1; }
.fila-dato > div:not(.acc-fila) { grid-column: 1; }
.fila-dato .acc-fila { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.fila-dato .valor { font-weight: 700; min-width: 0; }
.fila-dato .valor.medida { font-size: 20px; font-weight: 800; }
.fila-dato .valor.medida small { font-size: 14px; color: var(--sec); margin-left: 4px; }
.acc-fila { display: flex; gap: 4px; opacity: .55; transition: opacity .2s; }
.fila-dato.editando { background: color-mix(in srgb, var(--senal) 7%, transparent); grid-template-columns: minmax(0, 1fr); }
.fila-dato.recien { animation: destello 1.6s var(--curva); }
.antes { text-decoration: line-through; color: var(--sec); font-weight: 400; margin-right: 8px; font-size: .9em; }
.corregido { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 800; color: var(--senal); margin-top: 4px; }
.no-obtenido { display: inline-flex; gap: 8px; align-items: center; color: var(--alerta); font-weight: 800; }
.no-obtenido span { color: var(--sec); font-weight: 400; }
.editor-inline { grid-column: 1; display: flex; flex-direction: column; gap: 12px; }
.editor-inline .fila-botones { display: flex; justify-content: flex-end; gap: 8px; }
@media (max-width: 700px) { .fila-dato { grid-template-columns: minmax(0, 1fr); } .editor-inline { grid-column: 1; } }

.fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.foto { border-radius: 14px; overflow: hidden; background: var(--sup2); aspect-ratio: 4/3; position: relative; border: 0; padding: 0; }
.foto svg.dibujo { width: 100%; height: 100%; display: block; }
.foto figcaption, .foto .pie-foto { position: absolute; left: 8px; bottom: 8px; background: rgba(11,15,23,.78); color: #F3F5F9; font-size: 12px; font-weight: 800; padding: 4px 8px; border-radius: 8px; }
.foto.falta { display: grid; place-items: center; background: repeating-linear-gradient(135deg, var(--sup2) 0 10px, color-mix(in srgb, var(--alerta) 8%, var(--sup2)) 10px 20px); color: var(--alerta); font-weight: 800; font-size: 13px; text-align: center; padding: 10px; }
.papel { background: var(--papel); color: var(--tinta); border-radius: 14px; padding: 10px; }
.papel svg { width: 100%; height: auto; display: block; }
.papel-pie { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: #525152; padding: 6px 4px 0; }
.hojas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

/* Revisión: pasos unidos por una línea (como el recorrido de campo) */
.ruta { display: flex; align-items: center; gap: 0; }
.ruta .p { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; position: relative; font-size: 12px; font-weight: 800; color: var(--sec); text-align: center; }
.ruta .p i { width: 26px; height: 26px; border-radius: 999px; background: var(--sup3); display: grid; place-items: center; font-style: normal; position: relative; z-index: 1; transition: background .4s var(--curva), transform .4s var(--resorte); }
.ruta .p::before { content: ""; position: absolute; top: 12px; right: 50%; width: 100%; height: 2px; background: var(--sup3); }
.ruta .p:first-child::before { display: none; }
.ruta .p.hecho i { background: var(--exito); color: #0B0F17; }
.ruta .p.hecho::before, .ruta .p.actual::before { background: var(--exito); }
.ruta .p.actual i { background: var(--senal); color: var(--senal-texto); transform: scale(1.12); box-shadow: 0 0 0 5px color-mix(in srgb, var(--senal) 22%, transparent); }
.ruta .p.actual { color: var(--texto); }
.datos-lista { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; margin: 0; }
.datos-lista dt { color: var(--sec); }
.datos-lista dd { margin: 0; font-weight: 700; text-align: right; }

.comentario { background: var(--sup2); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; animation: subir .35s var(--curva) both; }
.comentario small { color: var(--sec); font-size: 12px; font-weight: 700; }
.chip-destino { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 12px; border-radius: 999px; background: color-mix(in srgb, var(--senal) 16%, transparent); color: var(--texto); font-size: 13px; width: fit-content; }
.chip-destino button { border: 0; background: none; color: var(--sec); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 99px; padding: 0; }

/* Historial (Mixpanel: antes y después con autor) */
.historial { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.historial li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 10px 0; position: relative; }
.historial li::before { content: ""; position: absolute; left: 13px; top: 36px; bottom: -10px; width: 2px; background: var(--sup3); }
.historial li:last-child::before { display: none; }
.historial .ico { width: 28px; height: 28px; border-radius: 99px; background: var(--sup2); display: grid; place-items: center; color: var(--sec); }
.historial li.nuevo .ico { background: var(--senal); color: var(--senal-texto); }
.historial li.nuevo { animation: subir .4s var(--curva) both; }
.historial .que { line-height: 1.45; }
.historial .cuando { color: var(--sec); font-size: 13px; }
.cambio { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--sup2); border-radius: 10px; padding: 4px 10px; margin-top: 4px; font-size: 14px; }
.cambio del { color: var(--sec); }
.cambio ins { text-decoration: none; font-weight: 800; }

/* Informe, cotización */
.dos-col { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
@media (max-width: 1000px) { .dos-col { grid-template-columns: minmax(0, 1fr); } }
.orden-fila { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--sup2); animation: subir .35s var(--curva) both; }
.orden-fila .n { width: 28px; height: 28px; border-radius: 99px; background: var(--sup3); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.orden-fila.fuera { opacity: .6; }
.orden-fila .txt { flex: 1; min-width: 0; }
.orden-fila .txt small { display: block; color: var(--sec); font-size: 13px; }
.orden-fila input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--marca); flex: none; }
.plano { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--sup2); }
.plano .pdf { width: 40px; height: 48px; border-radius: 8px; background: var(--papel); color: #B42318; display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; }
.soltar { border: 2px dashed var(--borde); border-radius: 14px; padding: 16px; text-align: center; color: var(--sec); font-weight: 700; background: none; width: 100%; }
.soltar:hover { border-color: var(--sec); color: var(--texto); }

.publicacion { position: sticky; top: 20px; display: flex; flex-direction: column; gap: 16px; }
.estado-guardado { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 700; color: var(--sec); }
.estado-guardado i { width: 8px; height: 8px; border-radius: 99px; background: var(--exito); }
.estado-guardado.cambios i { background: var(--alerta); animation: latido 1.6s var(--curva) infinite; }
.estado-guardado.mal i { background: var(--peligro); }

.version { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid color-mix(in srgb, var(--borde) 60%, transparent); }
.version:last-child { border-bottom: 0; }
.version .v { width: 40px; height: 40px; border-radius: 12px; background: var(--sup2); display: grid; place-items: center; font-weight: 800; }
.version.vigente .v { background: var(--marca); color: var(--marca-texto); }
.version .meta { color: var(--sec); font-size: 13px; grid-column: 2; }
.envio { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid color-mix(in srgb, var(--borde) 60%, transparent); }
.envio:last-child { border-bottom: 0; }
.envio .sub { color: var(--sec); font-size: 13px; }
.envio .error { grid-column: 2 / -1; }

/* Tabla de líneas de la cotización (Xero, QuickBooks) */
.lineas td { padding: 8px 10px; }
.lineas th { padding: 10px; }
.lineas td:first-child, .lineas th:first-child { padding-left: 20px; }
.lineas .codigo { font-size: 13px; color: var(--sec); font-weight: 700; white-space: nowrap; }
.lineas .origen { font-size: 12px; color: var(--sec); font-weight: 700; display: block; margin-top: 2px; }
.lineas .origen.difiere { color: var(--alerta); }
.lineas .total-linea { font-weight: 800; text-align: right; white-space: nowrap; }
.lineas tr.sin-precio td { background: color-mix(in srgb, var(--peligro) 6%, transparent); }
.lineas tr.saliendo { animation: salir .3s var(--curva) forwards; }
.totales { display: flex; flex-direction: column; gap: 10px; }
.totales .f { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.totales .f span:first-child { color: var(--sec); }
.totales .f.nota { font-size: 13px; color: var(--alerta); }
.totales .gran { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 14px; border-top: 1px solid var(--borde); }
.totales .gran b { font-size: 34px; font-weight: 800; letter-spacing: -.01em; }
.aiu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.aiu .campo label { font-size: 13px; }
.cifra-cambia { display: inline-block; animation: cifra .4s var(--curva); }

/* Listas tipo ajustes (cuenta) */
.ajustes { display: flex; flex-direction: column; }
.ajuste { display: flex; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid color-mix(in srgb, var(--borde) 60%, transparent); }
.ajuste:last-child { border-bottom: 0; }
.ajuste .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--sup2); display: grid; place-items: center; flex: none; }
.ajuste .txt { flex: 1; min-width: 0; }
.ajuste .txt small { display: block; color: var(--sec); font-size: 13px; }

/* Cliente (Attio / Twenty: ficha a la izquierda) */
.ficha { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 1000px) { .ficha { grid-template-columns: minmax(0, 1fr); } }
.sitio { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid color-mix(in srgb, var(--borde) 60%, transparent); }
.sitio:last-child { border-bottom: 0; }
.sitio svg { color: var(--sec); flex: none; margin-top: 2px; }
.sitio small { display: block; color: var(--sec); font-size: 13px; }

/* Avance de una visita */
.avance { display: flex; gap: 3px; width: 120px; height: 6px; border-radius: 99px; overflow: hidden; background: var(--sup3); }
.avance i { display: block; height: 100%; }
.avance .a1 { background: var(--e-enviado); } .avance .a2 { background: var(--e-revision); } .avance .a3 { background: var(--e-revisado); }

/* Pasos del segundo factor */
.pasos-2fa { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pasos-2fa > li { display: grid; grid-template-columns: 36px 1fr; gap: 16px; padding-bottom: 22px; position: relative; }
.pasos-2fa > li::before { content: ""; position: absolute; left: 17px; top: 40px; bottom: 4px; width: 2px; background: var(--sup3); }
.pasos-2fa > li:last-child::before { display: none; }
.pasos-2fa .n { width: 36px; height: 36px; border-radius: 99px; background: var(--sup3); display: grid; place-items: center; font-weight: 800; color: var(--sec); }
.pasos-2fa li.hecho .n { background: var(--exito); color: #0B0F17; }
.pasos-2fa li.hecho::before { background: var(--exito); }
.pasos-2fa li.actual .n { background: var(--senal); color: var(--senal-texto); }
.pasos-2fa li.pendiente { opacity: .55; }
.pasos-2fa h3 { margin: 6px 0 10px; font-size: 16px; font-weight: 800; }
.qr { width: 150px; height: 150px; background: #fff; border-radius: 14px; padding: 10px; }
.clave { font-size: 22px; font-weight: 800; letter-spacing: .12em; word-spacing: .3em; background: var(--sup2); border-radius: 12px; padding: 10px 14px; display: inline-block; }
.codigos { display: grid; grid-template-columns: repeat(2, auto); gap: 6px 24px; font-weight: 800; letter-spacing: .08em; background: var(--sup2); border-radius: 14px; padding: 14px 18px; width: fit-content; }

/* Estados de lista */
.vacio { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 56px 24px; }
.vacio .ic { width: 56px; height: 56px; border-radius: 18px; background: var(--sup2); display: grid; place-items: center; color: var(--sec); }
.vacio b { font-size: 18px; }
.vacio p { margin: 0; color: var(--sec); max-width: 46ch; }
.esq { display: block; height: 14px; border-radius: 8px; background: linear-gradient(90deg, var(--sup2), var(--sup3), var(--sup2)); background-size: 200% 100%; animation: brillo 1.4s linear infinite; }
.esq-fila { display: grid; grid-template-columns: 1.2fr 2fr 1fr 1fr .6fr; gap: 24px; padding: 18px 16px; border-bottom: 1px solid color-mix(in srgb, var(--borde) 60%, transparent); }

/* Capas: hoja lateral y confirmación */
.velo { position: absolute; inset: 0; background: rgba(5,8,14,.55); z-index: 20; animation: aparecer .25s var(--curva) both; }
.app[data-tema="claro"] .velo { background: rgba(14,17,22,.32); }
.hoja { position: absolute; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--sup); z-index: 21; box-shadow: var(--sombra); display: flex; flex-direction: column; border-radius: var(--r-capa) 0 0 var(--r-capa); animation: entrar-lado .4s var(--curva) both; }
.hoja.cerrando { animation: salir-lado .25s var(--curva) forwards; }
.hoja > header { padding: 22px 24px 14px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.hoja > header h2 { margin: 0; font-size: 22px; font-weight: 800; }
.hoja > header p { margin: 4px 0 0; color: var(--sec); }
.hoja .cuerpo { padding: 4px 24px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; flex: 1; }
.hoja > footer { padding: 16px 24px 22px; border-top: 1px solid var(--borde); display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.confirmar { position: absolute; left: 50%; top: 50%; width: min(500px, calc(100% - 32px)); background: var(--sup); border-radius: var(--r-capa); z-index: 21; box-shadow: var(--sombra); padding: 26px; display: flex; flex-direction: column; gap: 16px; transform: translate(-50%, -50%); animation: entrar-centro .35s var(--resorte) both; max-height: calc(100% - 40px); overflow-y: auto; }
.confirmar.cerrando { animation: aparecer .2s reverse forwards; }
.confirmar h2 { margin: 0; font-size: 22px; font-weight: 800; line-height: 1.2; text-wrap: balance; }
.confirmar p { margin: 0; color: var(--sec); line-height: 1.5; }
.confirmar .ic-capa { width: 48px; height: 48px; border-radius: 16px; background: var(--sup2); display: grid; place-items: center; }
.confirmar .ic-capa.peligro { color: var(--peligro); background: color-mix(in srgb, var(--peligro) 15%, transparent); }
.confirmar .ic-capa.exito { color: var(--exito); background: color-mix(in srgb, var(--exito) 15%, transparent); }
.confirmar footer { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 4px; }
.confirmar footer.uno { grid-template-columns: 1fr; }

/* Menú de acciones */
.menu-acc { position: absolute; z-index: 30; background: var(--sup); border-radius: 16px; box-shadow: var(--sombra); padding: 6px; min-width: 220px; display: flex; flex-direction: column; animation: entrar-menu .2s var(--curva) both; border: 1px solid var(--borde); }
.menu-acc button { border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 10px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.menu-acc button:hover { background: var(--sup2); }
.menu-acc button.peligro { color: var(--peligro); }
.menu-acc hr { border: 0; border-top: 1px solid var(--borde); margin: 4px 6px; width: auto; }

/* Notificación */
.notif { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40; background: var(--texto); color: var(--fondo); border-radius: 16px; padding: 12px 12px 12px 16px; display: flex; gap: 14px; align-items: center; font-weight: 700; box-shadow: var(--sombra); animation: notif .45s var(--resorte) both; max-width: calc(100% - 32px); }
.notif svg { color: var(--exito); flex: none; }
.app[data-tema="claro"] .notif svg { color: #3DD68C; }
.notif button { border: 0; background: color-mix(in srgb, var(--fondo) 14%, transparent); color: inherit; font-weight: 800; border-radius: 10px; padding: 6px 12px; }

/* Inicio de sesión (Shopify: marca centrada, tarjeta) */
.entrada { min-height: 860px; display: grid; grid-template-rows: auto 1fr auto; padding: 28px 36px; background: var(--fondo); }
.entrada > .logo { text-align: left; font-size: 20px; }
.entrada > .centro { display: grid; place-items: center; }
.entrada > .pie-entrada { color: var(--sec); font-size: 13px; }
.entrada-caja { width: min(380px, 100%); display: flex; flex-direction: column; gap: 22px; animation: subir .5s var(--curva) both; }
.entrada .logo { text-align: center; font-size: 30px; font-weight: 800; letter-spacing: .12em; }
.entrada .tarjeta { display: flex; flex-direction: column; gap: 16px; }
.entrada h1 { margin: 0; font-size: 30px; font-weight: 800; }
.entrada .sub { margin: -8px 0 0; color: var(--sec); }
.flotante { position: relative; }
.flotante input { width: 100%; height: 58px; border-radius: 14px; border: 2px solid transparent; background: var(--sup2); padding: 22px 48px 6px 16px; color: var(--texto); transition: border-color .2s; }
.flotante input:focus { outline: none; border-color: var(--senal); }
.flotante label { position: absolute; left: 18px; top: 18px; color: var(--sec); font-weight: 700; pointer-events: none; transition: all .2s var(--curva); }
.flotante input:focus + label, .flotante input:not(:placeholder-shown) + label { top: 8px; font-size: 12px; }
.flotante .ojo { position: absolute; right: 8px; top: 9px; }
.separador { display: flex; align-items: center; gap: 12px; color: var(--sec); font-size: 13px; font-weight: 700; }
.separador::before, .separador::after { content: ""; flex: 1; height: 1px; background: var(--borde); }
.digitos { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.digitos input { height: 60px; text-align: center; font-size: 26px; font-weight: 800; border-radius: 14px; border: 2px solid transparent; background: var(--sup2); color: var(--texto); min-width: 0; }
.digitos input:focus { outline: none; border-color: var(--senal); }
.digitos.error input { border-color: var(--peligro); animation: sacudida .4s var(--curva); }

/* Movimiento (siempre CSS) */
@keyframes subir { from { opacity: 0; transform: translateY(10px); } }
@keyframes aparecer { from { opacity: 0; } }
@keyframes entrar-lado { from { transform: translateX(100%); } }
@keyframes salir-lado { to { transform: translateX(100%); } }
@keyframes entrar-centro { from { opacity: 0; transform: translate(-50%, -46%) scale(.96); } }
@keyframes entrar-menu { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
@keyframes notif { from { opacity: 0; transform: translate(-50%, 20px); } }
@keyframes sacudida { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes latido { 0%, 100% { transform: scale(1); } 12% { transform: scale(1.14); } 24% { transform: scale(1); } }
@keyframes destello { from { background: color-mix(in srgb, var(--senal) 26%, transparent); } }
@keyframes brillo { to { background-position: -200% 0; } }
@keyframes salir { to { opacity: 0; transform: translateX(20px); } }
@keyframes cifra { from { opacity: .3; transform: translateY(-6px); } }
@keyframes trazo { from { stroke-dashoffset: var(--largo, 60); } }
.chulo path { stroke-dasharray: var(--largo, 60); animation: trazo .6s var(--curva) .15s both; }
::view-transition-old(contenido) { animation: 180ms var(--curva) both desvanecer; }
::view-transition-new(contenido) { animation: 320ms var(--curva) both entrar-contenido; }
@keyframes desvanecer { to { opacity: 0; } }
@keyframes entrar-contenido { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after, ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; transition: none !important; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.fila-flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.entre { justify-content: space-between; }
.col { display: flex; flex-direction: column; gap: 12px; }
.sec { color: var(--sec); }
.fuerte { font-weight: 800; }

/* ---------- Reorganización: la página es la superficie; sin recuadros para agrupar ---------- */
/* Se agrupa con espacio, títulos y líneas finas. Solo flota lo que es capa (hojas, diálogos, menús) o un objeto (foto, croquis, firma). */
.contenido-interior { gap: 28px; }
.cabeza { padding-bottom: 20px; border-bottom: 1px solid var(--borde); align-items: flex-start; }
.cabeza h1 { font-size: 28px; }
.cabeza .meta { color: var(--sec); display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
.cabeza .meta b { color: var(--texto); }
.guardado { font-size: 13px; font-weight: 700; color: var(--sec); display: inline-flex; align-items: center; gap: 8px; }
.guardado i { width: 8px; height: 8px; border-radius: 99px; background: var(--exito); }
.guardado.cambios i { background: var(--alerta); animation: latido 1.6s var(--curva) infinite; }
.guardado.mal { color: var(--peligro); } .guardado.mal i { background: var(--peligro); }

/* ================= Marco ================= */
function marco(interior) {
  const secciones = [
    ["bandeja", "levantamientos", "Levantamientos", bandeja.espera.length], ["visitas", "visitas", "Visitas"], ["clientes", "clientes", "Clientes"],
    ["catalogo", "catalogo", "Catálogo"], ["informes", "informes", "Informes"], ["cotizaciones", "cotizaciones", "Cotizaciones"],
  ];
  const grupo = { detalle: "bandeja", cliente: "clientes", informe: "informes", cotizacion: "cotizaciones" };
  const activa = grupo[S.pantalla] || S.pantalla;
  const enlace = ([id, icono, txt, n]) => `<a data-ir="${id}" ${activa === id ? 'aria-current="page"' : ""}>${ic(icono)}<span class="txt">${txt}</span>${n && activa !== id ? `<span class="cuenta-num" aria-label="${n} esperan revisión">${n}</span>` : ""}</a>`;
  return `<aside class="menu">
    <div class="marca"><b>TEINS</b><small>Oficina</small></div>
    <nav aria-label="Secciones">${secciones.map(enlace).join("")}
      ${admin() ? `<hr>${enlace(["admin", "admin", "Administración"])}` : ""}</nav>
    <div class="pie">
      <div class="usuario"><a data-ir="cuenta" class="usuario" style="padding:0;flex:1;min-width:0" ${S.pantalla === "cuenta" ? 'aria-current="page"' : ""}><span class="avatar">LG</span><span class="quien"><b>Laura Gómez</b><small>${admin() ? "Administra" : "Oficina"}</small></span></a>
      <button class="icono-btn limpio chico salir" data-accion="salir" title="Cerrar sesión" aria-label="Cerrar sesión">${ic("salir", 18)}</button></div>
    </div>
  </aside>
  <main class="contenido"><div class="contenido-interior">
    ${S.estado === "offline" ? `<div class="sin-conexion" role="status">${ic("sin-red")}Sin conexión. Lo que ve puede no estar al día; se actualiza al recuperar la conexión.</div>` : ""}
    ${interior}
  </div></main>`;
}
function cabeza({ migas, titulo, insignia = "", meta = "", acciones = "" }) {
  return `<header class="cabeza"><div class="cabeza-txt">
    ${migas ? `<button class="migas" data-ir="${migas[0]}">${ic("atras", 16)}${migas[1]}</button>` : ""}
    <h1>${titulo}${insignia}</h1>${meta ? `<div class="meta">${meta}</div>` : ""}</div>
    ${acciones ? `<div class="acciones">${acciones}</div>` : ""}</header>`;
}
function lista(contenido, { vacio: [tv, pv, icono = "bandeja"], error = "No se pudo cargar esta lista." }) {
  if (S.estado === "cargando") return `<div aria-busy="true" aria-label="Cargando">${Array.from({ length: 6 }, (_, k) => `<div class="esq-fila" style="padding-inline:0">${[1, 2, 3, 4, 5].map(() => `<span class="esq" style="width:${50 + ((k * 17) % 45)}%"></span>`).join("")}</div>`).join("")}</div>`;
  if (S.estado === "error") return `<div class="aviso peligro">${ic("alerta")}<div class="cuerpo"><b>${error}</b><span class="sec">Puede ser la conexión o el servidor. Lo que ya estaba guardado no se perdió.</span><div><button class="btn chico" data-accion="reintentar">${ic("recargar", 16)}Reintentar</button></div></div></div>`;
  if (S.estado === "vacio") return `<div class="vacio"><div class="ic">${ic(icono, 26)}</div><b>${tv}</b><p>${pv}</p></div>`;
  return contenido;
}
/* Búsqueda: resalta lo que coincide y dice cuántos hay en las otras pestañas */
const norm = (t) => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const coincide = (q, ...campos) => !q || campos.some((c) => norm(c).includes(norm(q)));
function marcar(txt, q) { if (!q) return txt; const i = norm(txt).indexOf(norm(q)); return i < 0 ? txt : txt.slice(0, i) + "<mark>" + txt.slice(i, i + q.length) + "</mark>" + txt.slice(i + q.length); }
const buscador = (clave, ph) => `<div class="buscar">${ic("buscar", 18)}<label class="sr" for="bus-${clave}">${ph}</label><input class="control" id="bus-${clave}" data-buscar="${clave}" type="search" placeholder="${ph}" value="${esc(S.busca[clave] || "")}"></div>`;
const sinResultados = (q, clave) => `<div class="vacio"><div class="ic">${ic("buscar", 26)}</div><b>Nada coincide con "${esc(q)}"</b><p>Revise cómo lo escribió, o busque por cliente, sitio o técnico.</p><button class="btn chico" data-limpiar="${clave}">Quitar la búsqueda</button></div>`;

/* ================= Render ================= */
const RENDER = { bandeja: pBandeja, detalle: pDetalle, visitas: pVisitas, clientes: pClientes, cliente: pCliente, catalogo: pCatalogo, informes: pInformes, informe: pInforme, cotizaciones: pCotizaciones, cotizacion: pCotizacion, admin: pAdmin, cuenta: pCuenta };
const app = $("#app");
function pintar() {
  app.dataset.tema = S.tema;
  const sinMarco = S.pantalla === "entrada" || S.pantalla === "entrada2";
  app.classList.toggle("sin-marco", sinMarco);
  const scroll = window.scrollY;
  app.innerHTML = (sinMarco ? (S.pantalla === "entrada" ? entrada() : entrada2()) : marco(RENDER[S.pantalla]())) + (S.capa ? CAPAS[S.capa.tipo](S.capa.d || {}) : "") + (S.notif ? notifHTML() : "");
  window.scrollTo(0, scroll);
  $("#mapa").innerHTML = PANTALLAS.map(([id, t]) => `<button data-ir="${id}" aria-current="${S.pantalla === id}">${t}</button>`).join("");
  $("#refs").innerHTML = REFS[S.pantalla] || "";
  document.querySelectorAll("[data-tema]").forEach((b) => b.tagName === "BUTTON" && b.setAttribute("aria-pressed", b.dataset.tema === S.tema));
  document.querySelectorAll("[data-estado]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.estado === S.estado));
  document.querySelectorAll("[data-rol]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.rol === S.rol));
  const auto = app.querySelector(".capa-foco, .hoja input, .hoja select, .confirmar [autofocus], .confirmar input, [autofocus]");
  if (S.capa && auto) auto.focus({ preventScroll: true });
}
function ir(p) {
  if (!RENDER[p] && p !== "entrada" && p !== "entrada2") return;
  const pendiente = (S.pantalla === "cotizacion" && S.cot.cambios && p !== "cotizacion") || (S.pantalla === "informe" && S.inf.cambios && p !== "informe");
  if (pendiente) { abrir("salir-sin-guardar", { a: p }); return; }
  cambiar(() => { S.pantalla = p; S.capa = null; S.resaltar = null; }, true);
  document.querySelector(".marco-app").scrollIntoView({ block: "start" });
}
function cambiar(fn, transicion) {
  if (transicion && document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(() => { fn(); pintar(); });
  else { fn(); pintar(); }
}
function abrir(tipo, d) { S.capa = { tipo, d }; pintar(); }
function cerrar() {
  const c = app.querySelector(".hoja, .confirmar");
  if (c) { c.classList.add("cerrando"); app.querySelector(".velo")?.remove(); setTimeout(() => { S.capa = null; pintar(); }, 200); } else { S.capa = null; pintar(); }
}
let notifT;
function notificar(txt, deshacer) { S.notif = { txt, deshacer }; clearTimeout(notifT); notifT = setTimeout(() => { S.notif = null; app.querySelector(".notif")?.remove(); }, deshacer ? 10000 : 5000); }
function notifHTML() { return `<div class="notif" role="status">${ic("chulo", 18)}<span>${S.notif.txt}</span>${S.notif.deshacer ? `<button data-accion="deshacer">Deshacer</button>` : ""}</div>`; }
function errorEn(id, txt, campo) { const e = $("#" + id); if (e) e.innerHTML = `<p class="msj-error">${ic("alerta", 14)}${txt}</p>`; if (campo) { const c = $("#" + campo); c?.classList.remove("error"); void c?.offsetWidth; c?.classList.add("error"); c?.focus(); } }

/* ================= Eventos ================= */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a, tr, [data-cerrar], [data-menu]");
  if (!t) { cerrarMenu(); return; }
  const ds = t.dataset;
  if (!t.closest(".menu-acc") && !ds.menu) cerrarMenu();
  if (ds.tema && t.tagName === "BUTTON") { S.tema = ds.tema; recordar(); pintar(); return; }
  if (ds.estado) { S.estado = ds.estado; pintar(); return; }
  if (ds.rol) { S.rol = ds.rol; S.paso2fa = 1; if (!admin() && S.pantalla === "admin") S.pantalla = "bandeja"; pintar(); return; }
  if (ds.cerrar !== undefined) { e.preventDefault(); cerrar(); return; }
  if (ds.cerrarForzado !== undefined) { S.capa = null; pintar(); return; }
  if (ds.ir) { e.preventDefault(); ir(ds.ir); return; }
  if (ds.limpiar) { S.busca[ds.limpiar] = ""; pintar(); return; }
  if (ds.rail) { S.railTab = ds.rail; pintar(); return; }

  if (t.id === "p-cli") { const c = clientes.find((x) => x.nombre === t.value), s = $("#p-sitio"); s.disabled = !c; s.innerHTML = c ? (c.sitios.length > 1 ? `<option value="">Elija un sitio</option>` : "") + c.sitios.map(([n]) => `<option>${n}</option>`).join("") : `<option>Primero elija el cliente</option>`; }
  if (t.id === "c-wa") $("#c-autoriza").hidden = !t.checked;
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.capa && !["credencial", "acceso"].includes(S.capa.tipo)) cerrar(); if (e.key === "Escape") cerrarMenu(); });
pintar();
</script>
