<meta charset="utf-8">
<title>Revisión con el informe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Iteración 27 con la base Precisión: flujos que no saltan y siempre dicen qué sigue, en campo y oficina. Base de
   estilos de los prototipos de las iteraciones 24c y 25. Arriba los casos; abajo, la pantalla. La página sigue el tema
   del visor; la app, el que se elige arriba. */
:root {
  --pagina: #ECEEF2; --pagina-texto: #14161A; --pagina-sec: #50555F; --pagina-panel: #FFFFFF; --pagina-borde: #D6DAE1; --pagina-foco: #1F4FD1;
  --curva: cubic-bezier(0.2, 0, 0, 1);
  --fuente: "Geist", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --pagina: #050608; --pagina-texto: #ECEEF2; --pagina-sec: #9BA1AD; --pagina-panel: #0E1116; --pagina-borde: #20252E; --pagina-foco: #8FB0FF; }
}
:root[data-theme="dark"] { color-scheme: dark; --pagina: #050608; --pagina-texto: #ECEEF2; --pagina-sec: #9BA1AD; --pagina-panel: #0E1116; --pagina-borde: #20252E; --pagina-foco: #8FB0FF; }

.app, .app[data-tema="claro"] {
  color-scheme: light;
  --fondo: #FAFAFB; --sup: #FFFFFF; --sup2: #F3F4F6; --sup3: #E9EBEF; --linea: #E5E7EB; --linea-fuerte: #D5D8DE;
  --texto: #111317; --sec: #5E646E; --ter: #6F7580;
  --marca: #2F5FE8; --marca-texto: #FFFFFF; --marca-suave: rgba(47,95,232,.09); --marca-borde: rgba(47,95,232,.35);
  --ok: #188A5B; --alerta: #A15C00; --peligro: #D22F34; --revision: #6B4FD3;
  --sombra-capa: 0 0 0 1px rgba(17,19,23,.08), 0 18px 48px rgba(17,19,23,.16); --sombra-boton: 0 1px 2px rgba(17,19,23,.06);
  --velo: rgba(17,19,23,.28); --filtro-logo: none;
}
.app[data-tema="oscuro"] {
  color-scheme: dark;
  --fondo: #0A0B0D; --sup: #111316; --sup2: #17191D; --sup3: #1E2126; --linea: #23262C; --linea-fuerte: #2E323A;
  --texto: #EDEEF0; --sec: #8B9099; --ter: #7C828C;
  --marca: #3B6FF5; --marca-texto: #FFFFFF; --marca-suave: rgba(59,111,245,.14); --marca-borde: rgba(110,150,255,.45);
  --ok: #3DBE8B; --alerta: #E8A33D; --peligro: #E5484D; --revision: #A38BFA;
  --sombra-capa: 0 0 0 1px rgba(255,255,255,.06), 0 16px 48px rgba(0,0,0,.55); --sombra-boton: 0 1px 2px rgba(0,0,0,.4);
  --velo: rgba(3,4,6,.62); --filtro-logo: brightness(0) invert(1);
}
@media (prefers-color-scheme: dark) {
  .app[data-tema="sistema"] {
    color-scheme: dark;
    --fondo: #0A0B0D; --sup: #111316; --sup2: #17191D; --sup3: #1E2126; --linea: #23262C; --linea-fuerte: #2E323A;
    --texto: #EDEEF0; --sec: #8B9099; --ter: #7C828C;
    --marca: #3B6FF5; --marca-texto: #FFFFFF; --marca-suave: rgba(59,111,245,.14); --marca-borde: rgba(110,150,255,.45);
    --ok: #3DBE8B; --alerta: #E8A33D; --peligro: #E5484D; --revision: #A38BFA;
    --sombra-capa: 0 0 0 1px rgba(255,255,255,.06), 0 16px 48px rgba(0,0,0,.55); --sombra-boton: 0 1px 2px rgba(0,0,0,.4);
    --velo: rgba(3,4,6,.62); --filtro-logo: brightness(0) invert(1);
  }
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--pagina); color: var(--pagina-texto); font-family: var(--fuente); padding: 28px 16px 56px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pagina-foco); outline-offset: 2px; }

/* ---------- La página del prototipo ---------- */
.envoltura { max-width: 1400px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.cabeza { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.cabeza h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.cabeza p { margin: 6px 0 0; color: var(--pagina-sec); max-width: 70ch; line-height: 1.5; font-size: 15px; }
.segmentos { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--pagina-panel); border: 1px solid var(--pagina-borde); flex-wrap: wrap; }
.segmentos button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; font-weight: 500; font-size: 14px; color: var(--pagina-sec); }
.segmentos button[aria-pressed="true"] { background: var(--pagina-texto); color: var(--pagina); }
.cuerpo { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1000px) { .cuerpo { grid-template-columns: minmax(0, 1fr); } }
.guia { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 16px; }
.casos { display: flex; flex-direction: column; gap: 2px; }
.casos .grupo { font-size: 12px; color: var(--pagina-sec); font-weight: 500; padding: 10px 10px 4px; }
.casos button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-size: 14px; color: var(--pagina-texto); display: flex; flex-direction: column; gap: 1px; }
.casos button small { color: var(--pagina-sec); font-size: 12.5px; }
.casos button:hover { background: var(--pagina-panel); }
.casos button[aria-pressed="true"] { background: var(--pagina-panel); box-shadow: inset 0 0 0 1px var(--pagina-borde); font-weight: 500; }
.nota { background: var(--pagina-panel); border: 1px solid var(--pagina-borde); border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.55; display: flex; flex-direction: column; gap: 8px; }
.nota h2 { margin: 0; font-size: 15px; font-weight: 600; }
.nota p { margin: 0; color: var(--pagina-sec); }
.nota b { color: var(--pagina-texto); font-weight: 500; }
.nota .probar { color: var(--pagina-texto); }
.nota a { color: var(--pagina-foco); }

/* ---------- La app ---------- */
.app { font-family: var(--fuente); color: var(--texto); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.app svg { width: 16px; height: 16px; flex: none; stroke-width: 1.6; }
.ventana { position: relative; overflow: hidden; isolation: isolate; border-radius: 12px; background: var(--fondo); box-shadow: 0 0 0 1px var(--linea-fuerte), 0 30px 80px rgba(0,0,0,.22); height: 660px; display: grid; grid-template-columns: 208px minmax(0, 1fr); }
@media (max-width: 760px) { .ventana { grid-template-columns: minmax(0, 1fr); } .menu { display: none; } }
.menu { border-right: 1px solid var(--linea); padding: 16px 10px; display: flex; flex-direction: column; gap: 18px; }
.menu .logo img { height: 30px; display: block; filter: var(--filtro-logo); margin: 2px 8px; }
.menu nav { display: flex; flex-direction: column; gap: 1px; }
.menu .grupo { font-size: 12px; color: var(--ter); padding: 10px 8px 4px; font-weight: 500; }
.menu a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: 7px; color: var(--sec); text-decoration: none; font-size: 13px; }
.menu a:hover { background: var(--sup2); color: var(--texto); }
.menu a[aria-current="page"] { background: var(--sup2); color: var(--texto); font-weight: 500; }
.menu a[aria-current="page"] svg { color: var(--marca); }
.contenido { min-width: 0; overflow: auto; display: flex; flex-direction: column; }
.barra-sup { height: 48px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 20px; border-bottom: 1px solid var(--linea); font-size: 13px; color: var(--sec); }
.barra-sup b { color: var(--texto); font-weight: 500; }
.pagina { padding: 22px 28px 60px; display: flex; flex-direction: column; gap: 18px; }
.cab { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; }
.cab h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.cab .datos { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--sec); font-size: 13px; }
.cab .datos span + span::before { content: "·"; margin-right: 14px; color: var(--ter); }
.acciones { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 7px; border: 0; font-size: 13px; font-weight: 500; background: var(--sup); color: var(--texto); box-shadow: inset 0 0 0 1px var(--linea-fuerte), var(--sombra-boton); white-space: nowrap; transition: background .15s var(--curva), transform .12s var(--curva); }
.btn:hover { background: var(--sup2); }
.btn:active { transform: translateY(1px); }
.btn.principal { background: var(--marca); color: var(--marca-texto); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), var(--sombra-boton); }
.btn.principal:hover { filter: brightness(1.06); }
.btn.peligro { background: var(--peligro); color: #FFFFFF; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), var(--sombra-boton); }
.btn.fantasma { background: transparent; box-shadow: none; color: var(--sec); }
.btn.fantasma:hover { background: var(--sup2); color: var(--texto); }
.btn.texto-peligro { background: transparent; box-shadow: none; color: var(--peligro); padding-inline: 6px; }
.btn.chico { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 6px; }
.btn[aria-busy="true"] { opacity: .8; cursor: progress; }
.kbd { font-size: 11px; opacity: .6; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; line-height: 16px; }
.giro { width: 14px; height: 14px; border-radius: 99px; border: 2px solid currentColor; border-right-color: transparent; animation: girar .7s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.estado { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 500; color: var(--sec); background: var(--sup2); white-space: nowrap; }
.estado i { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
.estado.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.estado.peligro { color: var(--peligro); background: color-mix(in srgb, var(--peligro) 12%, transparent); }
.guardado { display: inline-flex; align-items: center; gap: 7px; color: var(--sec); font-size: 13px; }
.guardado i { width: 6px; height: 6px; border-radius: 99px; background: var(--ok); }
.guardado.cambios i { background: var(--alerta); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--sec); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
td { padding: 0 10px; height: 44px; border-bottom: 1px solid var(--linea); }
td.der { text-align: right; white-space: nowrap; }
tr.inactiva td { color: var(--ter); }
tr.recien td { animation: resaltar 1.6s var(--curva); }
@keyframes resaltar { from { background: var(--marca-suave); } }
.sec { color: var(--sec); }

/* Filas de datos (detalle) */
.dato { display: grid; grid-template-columns: 190px minmax(0, 1fr) auto; gap: 6px 16px; padding: 11px 0; border-top: 1px solid var(--linea); align-items: start; }
.dato:last-child { border-bottom: 1px solid var(--linea); }
.dato .n { color: var(--sec); }
.dato .v b { font-weight: 500; font-size: 15px; }
.dato .v small { color: var(--sec); margin-left: 3px; }
.dato.editando { grid-template-columns: 190px minmax(0, 1fr); background: var(--marca-suave); margin-inline: -12px; padding-inline: 12px; border-radius: 8px; }
.editor { display: flex; flex-direction: column; gap: 10px; }
.corregido { display: block; font-size: 12px; color: var(--sec); margin-top: 2px; }
.corregido s { color: var(--ter); }

/* Campos */
.campo { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.campo > label, .campo > .etq { font-weight: 500; display: flex; gap: 8px; align-items: baseline; }
.campo small.obl { font-weight: 400; color: var(--sec); font-size: 12px; }
.control { width: 100%; height: 32px; border-radius: 7px; border: 0; background: var(--sup); box-shadow: inset 0 0 0 1px var(--linea-fuerte); padding: 0 10px; color: var(--texto); font-size: 13px; }
textarea.control { height: auto; min-height: 72px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
.control:focus { outline: none; box-shadow: inset 0 0 0 1px var(--marca), 0 0 0 3px var(--marca-suave); }
.control.error { box-shadow: inset 0 0 0 1px var(--peligro); animation: sacudida .35s var(--curva); }
.control.error:focus { box-shadow: inset 0 0 0 1px var(--peligro), 0 0 0 3px color-mix(in srgb, var(--peligro) 14%, transparent); }
@keyframes sacudida { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.msj-error { color: var(--peligro); font-size: 12.5px; font-weight: 500; display: flex; gap: 6px; align-items: center; margin: 0; }
.ayuda { color: var(--sec); font-size: 12.5px; margin: 0; }
.casillas { border: 1px solid var(--linea); border-radius: 8px; overflow: hidden; }
.casillas label { display: flex; gap: 10px; align-items: center; padding: 8px 12px; font-size: 13px; background: var(--sup); cursor: pointer; }
.casillas label + label { border-top: 1px solid var(--linea); }
.casillas label:has(input:checked) { background: var(--marca-suave); }
.casillas input { accent-color: var(--marca); width: 16px; height: 16px; margin: 0; }
.aviso { display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; background: color-mix(in srgb, var(--c, var(--marca)) 7%, var(--sup)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c, var(--marca)) 22%, transparent); }
.aviso svg { color: var(--c, var(--marca)); margin-top: 2px; }
.aviso.alerta { --c: var(--alerta); } .aviso.peligro { --c: var(--peligro); }

/* Capas: velo, diálogo, hoja lateral */
.velo { position: absolute; inset: 0; z-index: 20; background: var(--velo); animation: aparecer .2s var(--curva) both; }
@keyframes aparecer { from { opacity: 0; } }
.dialogo { position: absolute; z-index: 21; left: 50%; top: 50%; translate: -50% -50%; width: min(460px, calc(100% - 32px)); background: var(--sup); border-radius: 12px; box-shadow: var(--sombra-capa); animation: entrar .28s var(--curva) both; overflow: hidden; }
@keyframes entrar { from { opacity: 0; scale: .97; } }
.dialogo .dentro { padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.dialogo h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
.consecuencias { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--linea); border-radius: 10px; }
.consecuencias li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.4; }
.consecuencias li + li { border-top: 1px solid var(--linea); }
.consecuencias li svg { margin-top: 2px; color: var(--sec); }
.consecuencias li.grave svg { color: var(--peligro); }
.consecuencias small { display: block; color: var(--sec); font-size: 12px; }
.pie { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 20px; background: var(--sup2); border-top: 1px solid var(--linea); }
.pie .izq { margin-right: auto; }
.lateral { position: absolute; z-index: 21; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--sup); box-shadow: var(--sombra-capa); display: flex; flex-direction: column; animation: deslizar .28s var(--curva) both; }
@keyframes deslizar { from { transform: translateX(32px); opacity: 0; } }
.lateral header { padding: 18px 20px 12px; }
.lateral header h2 { margin: 0; font-size: 16px; font-weight: 600; }
.lateral header p { margin: 2px 0 0; font-size: 13px; color: var(--sec); }
.lateral .dentro { flex: 1; overflow: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
.lateral .pie { padding: 12px 20px; }
.efecto { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 8px; background: var(--sup2); font-size: 13px; }
.efecto div { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; }
.efecto svg { margin-top: 2px; color: var(--sec); }

/* Notificación con "Deshacer" y la línea que se consume */
.notif { position: absolute; left: 50%; bottom: 20px; translate: -50% 0; z-index: 30; background: var(--texto); color: var(--fondo); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.28); display: flex; align-items: center; gap: 12px; padding: 4px 4px 4px 14px; min-height: 44px; font-size: 13px; font-weight: 500; overflow: hidden; width: max-content; max-width: calc(100% - 24px); animation: subir .28s var(--curva) both; }
@keyframes subir { from { transform: translateY(12px); opacity: 0; } }
.notif button { border: 0; background: transparent; color: inherit; font-weight: 600; padding: 7px 10px; border-radius: 6px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fondo) 25%, transparent); }
.notif::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--marca); transform-origin: left; animation: consumir var(--dur, 10s) linear both; }
@keyframes consumir { to { transform: scaleX(0); } }

/* Teléfono (campo) */
.telefono { width: 360px; max-width: 100%; height: 700px; margin-inline: auto; border-radius: 42px; overflow: hidden; position: relative; isolation: isolate; background: var(--fondo); box-shadow: 0 0 0 9px #040507, 0 0 0 10px #22262d, 0 30px 70px rgba(0,0,0,.28); display: flex; flex-direction: column; }
.tel-estado { height: 46px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 14px; font-weight: 600; flex: none; }
.tel-cab { padding: 6px 18px 14px; display: flex; flex-direction: column; gap: 10px; }
.tel-cab .fila { display: flex; justify-content: space-between; align-items: center; color: var(--sec); font-size: 13px; }
.progreso { height: 3px; border-radius: 99px; background: var(--sup3); overflow: hidden; }
.progreso i { display: block; height: 100%; width: 58%; background: var(--marca); border-radius: 99px; }
.tel-cab h1 { margin: 2px 0 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.tel-cuerpo { flex: 1; overflow: auto; padding: 0 16px 120px; display: flex; flex-direction: column; gap: 8px; }
.tarjeta { background: var(--sup); border: 1px solid var(--linea); border-radius: 14px; padding: 12px 8px 12px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 8px; align-items: center; animation: subir .28s var(--curva) both; }
.tarjeta strong { font-size: 16px; font-weight: 500; }
.tarjeta .s { color: var(--sec); font-size: 13px; grid-column: 1; }
.tarjeta .est { grid-row: 1 / span 2; grid-column: 2; font-size: 12px; font-weight: 500; }
.tarjeta .est.ok { color: var(--ok); } .tarjeta .est.falta { color: var(--alerta); }
.tarjeta .quitar { grid-row: 1 / span 2; grid-column: 3; width: 44px; height: 44px; border: 0; background: none; color: var(--sec); border-radius: 10px; display: grid; place-items: center; }
.tarjeta .quitar:hover { background: var(--sup2); }
.agregar { height: 52px; border-radius: 14px; border: 1px dashed var(--linea-fuerte); background: transparent; color: var(--sec); font-size: 14px; font-weight: 500; }
.tel-barra { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 30px; background: linear-gradient(to top, var(--fondo) 72%, transparent); z-index: 5; }
.tel-barra .btn { height: 50px; font-size: 16px; border-radius: 12px; width: 100%; }
.telefono .notif { bottom: 100px; left: 12px; right: 12px; translate: none; width: auto; font-size: 14px; }
.hoja { position: absolute; z-index: 21; left: 0; right: 0; bottom: 0; background: var(--sup); border-radius: 16px 16px 0 0; box-shadow: var(--sombra-capa); padding: 10px 18px 30px; display: flex; flex-direction: column; gap: 12px; animation: subir .28s var(--curva) both; }
.hoja .asa { width: 44px; height: 5px; border-radius: 99px; background: var(--linea-fuerte); margin: 0 auto 4px; }
.hoja h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
.hoja .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hoja .botones .btn { height: 50px; font-size: 15px; border-radius: 12px; }
.firma-lienzo { height: 220px; border-radius: 14px; background: #FFFFFF; border: 1px solid var(--linea); position: relative; }
.firma-lienzo svg { position: absolute; inset: 0; width: 100%; height: 100%; stroke: #15171A; stroke-width: 2.5; fill: none; }
.firma-lienzo span { position: absolute; left: 16px; right: 16px; bottom: 44px; border-top: 1px dashed #C9CED8; }
.contador { font-size: 13px; color: var(--sec); text-align: center; }

/* Resumen: la clasificación de todas las acciones */
.resumen { background: var(--pagina-panel); border: 1px solid var(--pagina-borde); border-radius: 12px; overflow: auto; }
.resumen table { font-size: 13.5px; color: var(--pagina-texto); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* ---------- Iteración 27: la página del prototipo, a todo el ancho y con la guía arriba ---------- */
.envoltura { max-width: 1680px; }

/* ---------- View Transitions: la página no se mueve; solo lo que tiene nombre ---------- */
:root { view-transition-name: none; }
::view-transition-group(*) { animation-duration: .28s; animation-timing-function: var(--curva); }
::view-transition-old(*), ::view-transition-new(*) { animation-duration: .2s; }
/* Lo que se desliza no se sale de su caja */
::view-transition-group(tel-cuerpo), ::view-transition-group(det-cuerpo) { overflow: clip; }
@keyframes vt-sale-izq { to { transform: translateX(-24%); opacity: 0; } }
@keyframes vt-entra-der { from { transform: translateX(24%); opacity: 0; } }
@keyframes vt-sale-der { to { transform: translateX(24%); opacity: 0; } }
@keyframes vt-entra-izq { from { transform: translateX(-24%); opacity: 0; } }
@keyframes vt-sube { from { transform: translateY(8px); opacity: 0; } }
@keyframes vt-desvanece { to { opacity: 0; } }
html[data-direccion="adelante"]::view-transition-old(tel-cuerpo), html[data-direccion="adelante"]::view-transition-old(det-cuerpo) { animation: vt-sale-izq .28s var(--curva) both; }
html[data-direccion="adelante"]::view-transition-new(tel-cuerpo), html[data-direccion="adelante"]::view-transition-new(det-cuerpo) { animation: vt-entra-der .28s var(--curva) both; }
html[data-direccion="atras"]::view-transition-old(tel-cuerpo), html[data-direccion="atras"]::view-transition-old(det-cuerpo) { animation: vt-sale-der .28s var(--curva) both; }
html[data-direccion="atras"]::view-transition-new(tel-cuerpo), html[data-direccion="atras"]::view-transition-new(det-cuerpo) { animation: vt-entra-izq .28s var(--curva) both; }
/* Cambiar de sección: el contenido aparece con un desvanecido corto; dentro de una pantalla, solo cambia lo que cambió */
html[data-direccion="seccion"]::view-transition-old(contenido) { animation: vt-desvanece .12s linear both; }
html[data-direccion="seccion"]::view-transition-new(contenido) { animation: vt-sube .24s var(--curva) both; }

/* Movimiento reducido (de verdad o simulado en la guía): nada se mueve */
.sin-mov *, .sin-mov *::before, .sin-mov *::after { animation: none !important; transition: none !important; }

/* ---------- Entradas y salidas: solo lo nuevo entra; lo que se va, sale ---------- */
@keyframes entra-abajo { from { opacity: 0; transform: translateY(10px); } }

@keyframes entra-lado { from { opacity: 0; transform: translateX(32px); } }

@keyframes entra-centro { from { opacity: 0; scale: .97; } }

@keyframes velo-entra { from { opacity: 0; } }
@keyframes velo-sale { to { opacity: 0; } }
@keyframes hoja-sube { from { transform: translateY(100%); } }
@keyframes hoja-baja { to { transform: translateY(100%); } }
@keyframes destello { from { background: var(--marca-suave); box-shadow: 0 0 0 2px var(--marca-borde); } }
@keyframes resalte-fila { from { background: color-mix(in srgb, var(--marca) 16%, transparent); } }

.envios-28 li.cancelado > span:nth-child(2) { color: var(--sec); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--sec) 60%, transparent); }
.enlace-acc { border: 0; background: none; padding: 2px 4px; font-size: 12.5px; font-weight: 500; color: var(--marca); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.enlace-acc.peligro { color: var(--peligro); }
.estado.cola { color: var(--alerta); background: color-mix(in srgb, var(--alerta) 12%, transparent); }
.estado.enviado { color: var(--marca); background: var(--marca-suave); }
.estado.neutro { color: var(--sec); background: var(--sup2); }
.estado.anulado { color: var(--sec); background: var(--sup2); }
.quedan-28 { font-size: 12.5px; color: var(--sec); }

/* Versiones con retiro */
.ver-28 { padding: 12px 0; border-top: 1px solid var(--linea); display: flex; flex-direction: column; gap: 4px; }
.ver-28:first-of-type { border-top: 0; }
.ver-28 .cab-v { display: flex; align-items: center; gap: 8px; }
.ver-28 .cab-v b { font-weight: 500; font-size: 14px; }
.ver-28 .cab-v .der { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.ver-28 .meta { color: var(--sec); font-size: 12.5px; }
.ver-28.retirada .cab-v b { color: var(--sec); }

/* Clientes, sitios y archivados */
.filas-28 { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.filas-28 li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--linea); font-size: 13.5px; }
.filas-28 li:first-child { border-top: 0; }
.filas-28 li svg { width: 17px; height: 17px; color: var(--sec); }
.filas-28 small { display: block; color: var(--sec); font-size: 12.5px; }
.filas-28 li.archivado b { color: var(--sec); font-weight: 500; }
.cab-sec-28 { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.cab-sec-28 h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--sec); }
.cambio-28 { font-size: 12.5px; color: var(--sec); }
.bloqueo-28 { border: 1px solid color-mix(in srgb, var(--alerta) 40%, transparent); background: color-mix(in srgb, var(--alerta) 8%, transparent); border-radius: 8px; padding: 10px 12px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.bloqueo-28 ul { margin: 2px 0 0; padding-left: 18px; color: var(--sec); }
.menu-28 { position: relative; display: inline-flex; }
.menu-28 .lista-acc { position: absolute; right: 0; top: 32px; z-index: 6; background: var(--sup); border-radius: 8px; box-shadow: var(--sombra-capa); padding: 4px; min-width: 190px; display: flex; flex-direction: column; animation: entra-centro .16s var(--curva) both; border: 1px solid var(--linea); }
.menu-28 .lista-acc button { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 6px; font-size: 13px; color: var(--texto); cursor: pointer; }
.menu-28 .lista-acc button:hover { background: var(--sup2); }
.menu-28 .lista-acc button.peligro { color: var(--peligro); }

/* Comentarios */
.coment-28 { display: flex; flex-direction: column; gap: 3px; padding: 10px 0; border-top: 1px solid var(--linea); font-size: 13.5px; }
.coment-28:first-child { border-top: 0; }
.coment-28 .cab-c { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sec); }
.coment-28 .cab-c b { color: var(--texto); font-weight: 500; }
.coment-28 .cab-c .menu-28 { margin-left: auto; }
.coment-28 .sobre { font-size: 12px; color: var(--sec); }
.coment-28.retirado { color: var(--sec); font-style: italic; font-size: 13px; }
.coment-28 .editado { font-size: 12px; color: var(--sec); }
.coment-28 textarea { min-height: 64px; resize: vertical; font: inherit; }
.coment-28 .botones-c { display: flex; gap: 6px; justify-content: flex-end; }
.btn-icono-28 { border: 0; background: none; color: var(--sec); width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; cursor: pointer; }
.btn-icono-28:hover { background: var(--sup2); color: var(--texto); }
.btn-icono-28 svg { width: 16px; height: 16px; }
.tel-mini { border: 1px solid var(--linea); border-radius: 18px; background: var(--fondo); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.tel-mini h3 { margin: 0; font-size: 13px; font-weight: 500; color: var(--sec); }
.tel-mini .c-tel { background: var(--sup); border: 1px solid var(--linea); border-radius: 12px; padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.tel-mini .c-tel small { color: var(--sec); font-size: 12px; }

/* Campo: descartar y la papelera */
.descartar-t { align-self: center; border: 0; background: none; color: var(--peligro); font-size: 14px; font-weight: 500; padding: 10px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.descartar-t svg { width: 16px; height: 16px; }
.paso-t { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; padding: 12px 14px; background: var(--sup); border: 1px solid var(--linea); border-radius: 14px; font-size: 15px; }
.paso-t small { display: block; color: var(--sec); font-size: 13px; }
.paso-t .n { width: 26px; height: 26px; border-radius: 99px; display: grid; place-items: center; font-size: 13px; font-weight: 600; box-shadow: inset 0 0 0 2px var(--linea-fuerte); }
.paso-t .n.hecho { background: var(--ok); color: #FFFFFF; box-shadow: none; }
.paso-t .n.hecho svg { width: 14px; height: 14px; stroke-width: 3; }
.cuenta-t { display: flex; flex-direction: column; border: 1px solid var(--linea); border-radius: 14px; background: var(--sup); }
.cuenta-t button { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 0; background: none; padding: 13px 14px; font-size: 15px; color: var(--texto); text-align: left; cursor: pointer; }
.cuenta-t button + button { border-top: 1px solid var(--linea); }
.cuenta-t button span { color: var(--sec); font-size: 13px; }
.explica-t { color: var(--sec); font-size: 13px; line-height: 1.45; margin: 0 2px; }
.descartado-t { background: var(--sup); border: 1px solid var(--linea); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.descartado-t strong { font-weight: 500; font-size: 15px; }
.descartado-t small { color: var(--sec); font-size: 13px; }
.descartado-t .fila-d { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.descartado-t .borra { color: var(--alerta); font-size: 12.5px; font-weight: 500; }
.hoja .consecuencias li { font-size: 14px; }
/* Un elemento con nombre de transición apila su contenido aparte: el que tiene el menú abierto va encima de los demás */
.coment-28:has(.lista-acc), .filas-28 li:has(.lista-acc), .cab:has(.lista-acc) { position: relative; z-index: 5; }
.coment-28.retirado { flex-direction: row; align-items: center; gap: 8px; flex-wrap: wrap; }


/* ---------- Iteración 29: ajustes de oficina ---------- */
.antes-despues { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--pagina-panel); border: 1px solid var(--pagina-borde); }
.antes-despues button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; font-weight: 500; font-size: 13px; color: var(--pagina-sec); }
.antes-despues button[aria-pressed="true"] { background: var(--pagina-texto); color: var(--pagina); }
.refs { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
.refs a { color: var(--pagina-foco); text-decoration: none; }
.refs a:hover { text-decoration: underline; }
.etiqueta-hoy { position: absolute; bottom: 12px; left: 12px; z-index: 40; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; padding: 3px 8px; border-radius: 99px; background: color-mix(in srgb, var(--peligro) 14%, var(--sup)); color: var(--peligro); }
.etiqueta-hoy.prop { background: color-mix(in srgb, var(--ok) 14%, var(--sup)); color: var(--ok); }

/* Diálogo centrado de formulario: el alto lo pone el contenido */
.dialogo.form { width: min(480px, calc(100% - 32px)); }
.dialogo.form.ancho { width: min(560px, calc(100% - 32px)); }
.dialogo .cab-d { display: flex; flex-direction: column; gap: 2px; }
.dialogo .cab-d p { margin: 0; color: var(--sec); font-size: 13px; }
.dialogo .cerrar-d { position: absolute; top: 14px; right: 14px; }
.fila-campos { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 12px; }
.fila-campos.c-d { grid-template-columns: 140px minmax(0, 1fr); }
.con-ojo { position: relative; }
.con-ojo .control { padding-right: 36px; }
.con-ojo button { position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border: 0; background: none; color: var(--sec); display: grid; place-items: center; border-radius: 5px; }
.reglas { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--sec); }
.reglas li { display: inline-flex; gap: 5px; align-items: center; }
.reglas li i { width: 12px; height: 12px; border-radius: 99px; box-shadow: inset 0 0 0 1.5px var(--linea-fuerte); display: inline-grid; place-items: center; }
.reglas li.ok { color: var(--ok); }
.reglas li.ok i { background: var(--ok); box-shadow: none; }
.reglas li.ok i::after { content: ""; width: 5px; height: 3px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg) translate(0, -1px); }
.nota-d { font-size: 12.5px; color: var(--sec); margin: 0; display: flex; gap: 8px; align-items: flex-start; }
.nota-d svg { width: 14px; height: 14px; margin-top: 2px; }
.pie.una-fila .btn { flex: none; }
.pie .kbd-solo { font-size: 11px; opacity: .7; }

/* Notificación con la acción como texto */
.notif.texto-acc { padding: 4px 6px 4px 14px; }
.notif.texto-acc .accion-n { box-shadow: none; padding: 7px 8px; color: var(--enlace-notif); }
.notif.texto-acc .accion-n:hover { text-decoration: underline; text-underline-offset: 3px; }
.notif.texto-acc .sep-n { width: 1px; align-self: stretch; margin: 8px 0; background: color-mix(in srgb, var(--fondo) 22%, transparent); }
.app { --enlace-notif: #9DB8FF; }
.app[data-tema="oscuro"] { --enlace-notif: var(--marca); }
@media (prefers-color-scheme: dark) { .app[data-tema="sistema"] { --enlace-notif: var(--marca); } }

/* Lo nuevo: hoy (barra y fondo 2,4 s) y propuesto (un tinte que se va en 1,2 s) */
@keyframes resalte-hoy { 0%, 70% { background: color-mix(in srgb, var(--marca) 14%, transparent); box-shadow: inset 3px 0 0 var(--marca); } }
@keyframes resalte-suave { from { background: color-mix(in srgb, var(--marca) 8%, transparent); } }
tr.res-hoy td { animation: resalte-hoy 2.4s var(--curva) both; }
tr.res-hoy td:first-child b { font-weight: 600; }
tr.res-suave td { animation: resalte-suave 1.2s var(--curva) both; }

/* Mi cuenta */
.cuenta { width: 100%; max-width: 680px; margin-inline: auto; display: flex; flex-direction: column; gap: 26px; padding: 26px 0 60px; }
.cuenta.hoy { max-width: 760px; margin: 0; }
.cuenta h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.cuenta .sub-c { margin: 2px 0 0; color: var(--sec); font-size: 13px; }
.bloque-c h2 { margin: 0 0 6px; font-size: 13px; font-weight: 500; color: var(--sec); }
.filas-c { border-top: 1px solid var(--linea); }
.fila-c { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linea); }
.fila-c > svg { color: var(--sec); }
.fila-c b { font-weight: 500; font-size: 14px; display: block; }
.fila-c small { color: var(--sec); font-size: 12.5px; display: block; }
.fila-c .ctrl { justify-self: end; }
.seg-c { display: inline-flex; padding: 2px; gap: 2px; border-radius: 8px; background: var(--sup2); box-shadow: inset 0 0 0 1px var(--linea); }
.seg-c button { border: 0; background: none; height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--sec); display: inline-flex; gap: 6px; align-items: center; }
.seg-c button[aria-pressed="true"] { background: var(--sup); color: var(--texto); box-shadow: 0 0 0 1px var(--linea-fuerte), var(--sombra-boton); }
.seg-c svg { width: 14px; height: 14px; }
.cuenta.hoy .fila-c .btn.principal { height: 32px; }
.medida { position: absolute; top: 48px; bottom: 0; width: 0; border-left: 1px dashed color-mix(in srgb, var(--peligro) 55%, transparent); z-index: 3; pointer-events: none; }
.medida span { position: absolute; top: 6px; left: 6px; font-size: 11px; color: var(--peligro); white-space: nowrap; }

/* Cotización: la página a todo el alto */
.vivo-29 { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.vivo-29 .editor-o { overflow: auto; padding: 22px 26px 60px; border-right: 1px solid var(--linea); display: flex; flex-direction: column; gap: 20px; }
.vivo-29 .lienzo-o { overflow: auto; }
.vivo-29.cortado { height: 62%; flex: none; }
.vacio-gris { flex: 1; background: var(--fondo); border-top: 1px dashed color-mix(in srgb, var(--peligro) 55%, transparent); position: relative; }
.vacio-gris span { position: absolute; top: 8px; left: 12px; font-size: 11.5px; color: var(--peligro); }
.hoja-cot { background: #FFFFFF; color: #15171A; width: 100%; max-width: 520px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(17,19,23,.08), 0 10px 30px rgba(17,19,23,.14); padding: 28px 30px; font-size: 11px; display: flex; flex-direction: column; gap: 10px; color-scheme: light; }
.hoja-cot h4 { margin: 0; font-size: 15px; color: #002B81; }
.hoja-cot table { font-size: 10.5px; }
.hoja-cot th { font-size: 10px; color: #15171A; background: #F1F3F7; padding: 5px 6px; border: 0; }
.hoja-cot td { height: 26px; padding: 0 6px; border-color: #E6E8EE; }
.hoja-cot .tot { align-self: flex-end; width: 60%; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; }
.hoja-cot .tot b { font-size: 13px; border-top: 2px solid #002B81; padding-top: 4px; }

/* Enviar a otro contacto y el mensaje editable */
.destinos { border: 1px solid var(--linea); border-radius: 10px; overflow: hidden; }
.destinos label { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 12px; font-size: 13px; background: var(--sup); cursor: pointer; }
.destinos label + label { border-top: 1px solid var(--linea); }
.destinos label:has(input:checked) { background: var(--marca-suave); }
.destinos input { accent-color: var(--marca); width: 16px; height: 16px; margin: 0; }
.destinos small { display: block; color: var(--sec); font-size: 12px; }
.canal { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: var(--sec); }
.canal svg { width: 14px; height: 14px; }
.ya-recibieron { font-size: 12.5px; color: var(--sec); display: flex; gap: 6px; align-items: center; }
.ya-recibieron svg { width: 14px; height: 14px; color: var(--ok); }
.mensaje-c { border: 1px solid var(--linea); border-radius: 10px; overflow: hidden; background: var(--sup); }
.mensaje-c .cab-m { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--linea); background: var(--sup2); font-size: 12.5px; color: var(--sec); }
.mensaje-c .cab-m .der { margin-left: auto; }
.mensaje-c .asunto { display: grid; grid-template-columns: 64px minmax(0, 1fr); align-items: center; border-bottom: 1px solid var(--linea); font-size: 13px; }
.mensaje-c .asunto span { color: var(--sec); padding-left: 12px; }
.mensaje-c .asunto input { border: 0; background: none; height: 36px; padding: 0 12px 0 0; font-size: 13px; outline: none; color: var(--texto); }
.mensaje-c textarea { display: block; width: 100%; border: 0; background: none; resize: vertical; min-height: 150px; padding: 10px 12px; font-size: 13px; line-height: 1.55; outline: none; color: var(--texto); }
.mensaje-c .fijo { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--linea); font-size: 12.5px; color: var(--sec); background: var(--sup2); }
.mensaje-c .fijo svg { width: 14px; height: 14px; }
.mensaje-c:focus-within { box-shadow: 0 0 0 3px var(--marca-suave); border-color: var(--marca); }
.pestanas-m { display: flex; gap: 2px; }
.pestanas-m button { border: 0; background: none; padding: 4px 8px; border-radius: 6px; font-size: 12.5px; color: var(--sec); display: inline-flex; gap: 5px; align-items: center; }
.pestanas-m button svg { width: 14px; height: 14px; }
.pestanas-m button[aria-pressed="true"] { background: var(--sup); color: var(--texto); box-shadow: inset 0 0 0 1px var(--linea-fuerte); }
.wa-fijo { padding: 12px; font-size: 13px; line-height: 1.55; color: var(--sec); }
.wa-fijo .burbuja { background: color-mix(in srgb, var(--ok) 10%, var(--sup)); color: var(--texto); border-radius: 10px; padding: 10px 12px; max-width: 92%; }
.cambiado { font-size: 11.5px; color: var(--marca); font-weight: 500; }

/* Visitas con horario */
.horario { display: flex; flex-direction: column; gap: 10px; }
.horas { display: grid; grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr); gap: 8px; align-items: center; }
.horas .a { text-align: center; color: var(--sec); }
.control[disabled] { color: var(--ter); background: var(--sup2); }
.sin-fin { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; cursor: pointer; }
.sin-fin input { accent-color: var(--marca); width: 16px; height: 16px; margin: 2px 0 0; }
.sin-fin small { display: block; color: var(--sec); font-size: 12px; }
.tecnicos-d { border: 1px solid var(--linea); border-radius: 10px; overflow: hidden; }
.tecnicos-d .buscar { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 36px; border-bottom: 1px solid var(--linea); background: var(--sup); color: var(--sec); font-size: 13px; }
.tecnicos-d .buscar input { border: 0; background: none; outline: none; flex: 1; font-size: 13px; color: var(--texto); }
.tecnicos-d label { display: grid; grid-template-columns: 16px 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 12px; font-size: 13px; background: var(--sup); cursor: pointer; }
.tecnicos-d label + label { border-top: 1px solid var(--linea); }
.tecnicos-d label:has(input:checked) { background: var(--marca-suave); }
.tecnicos-d input[type="checkbox"] { accent-color: var(--marca); width: 16px; height: 16px; margin: 0; }
.tecnicos-d .av { width: 26px; height: 26px; border-radius: 99px; background: var(--sup3); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--sec); }
.tecnicos-d .libre { font-size: 12px; color: var(--ok); }
.tecnicos-d small { display: block; font-size: 12px; color: var(--sec); }
.ocupados-d { border-top: 1px solid var(--linea); }
.ocupados-d > button { width: 100%; border: 0; background: var(--sup2); display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; font-size: 12.5px; color: var(--sec); }
.ocupados-d .fila-oc { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 12px 7px 38px; font-size: 13px; color: var(--sec); border-top: 1px solid var(--linea); background: var(--sup); }
.ocupados-d .fila-oc small { display: block; font-size: 12px; color: var(--alerta); }
.dia-v { display: flex; flex-direction: column; }
.dia-v h3 { margin: 10px 0 4px; font-size: 13px; font-weight: 500; color: var(--sec); }
.vis-fila { display: grid; grid-template-columns: 180px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--linea); font-size: 13.5px; }
.vis-fila .h { font-weight: 500; font-size: 13px; }
.vis-fila .h small { display: block; font-weight: 400; color: var(--sec); font-size: 12px; }
.vis-fila b { font-weight: 500; }
.vis-fila .sec { font-size: 12.5px; }
.en-curso { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 500; color: var(--marca); }
.en-curso i { width: 7px; height: 7px; border-radius: 99px; background: currentColor; animation: pulso 1.6s ease-in-out infinite; }
@keyframes pulso { 50% { opacity: .35; } }

/* Revisión: materiales como tabla y el estado revisado */
.mat-tabla { border: 1px solid var(--linea); border-radius: 10px; overflow: hidden; background: var(--sup); }
.mat-tabla .fila-m { display: grid; grid-template-columns: minmax(0, 1.5fr) 72px 84px minmax(0, 1fr) 28px; gap: 8px; align-items: center; padding: 6px 10px; }
.mat-tabla .fila-m + .fila-m { border-top: 1px solid var(--linea); }
.mat-tabla .fila-m.cab-m { background: var(--sup2); font-size: 12px; color: var(--sec); font-weight: 500; padding-block: 7px; }
.mat-tabla .control { height: 30px; }

/* =====================================================================================================
   Mecánica de la iteración 27: transiciones, lo nuevo, capas que entran y salen, notificaciones
   ===================================================================================================== */
const e = { caso: "resumen", tema: "sistema", reducido: false, nuevos: new Set(), capa: null, notif: null, menu: null };
const reducido = () => e.reducido || matchMedia("(prefers-reduced-motion: reduce)").matches;
const espera = (ms) => (reducido() ? 0 : ms);
const temporizadores = new Set();
const luego = (fn, ms) => { const t = setTimeout(() => { temporizadores.delete(t); fn(); }, ms); temporizadores.add(t); };
function transicion(fn, direccion = "") {
  if (!document.startViewTransition || reducido()) { fn(); pintar(); return; }
  if (direccion) document.documentElement.dataset.direccion = direccion;
  const t = document.startViewTransition(() => { fn(); pintar(); });
  t.finished.finally(() => delete document.documentElement.dataset.direccion);
}
function marcarNuevo(id, ms = 2600) { e.nuevos.add(id); luego(() => { e.nuevos.delete(id); pintar(); }, ms); }
const esNuevo = (id) => e.nuevos.has(id);
function abrirCapa(nombre, datos = {}) {
  e.menu = null;
  e.capa = { nombre, fase: "entra", ...datos };
  pintar();
  luego(() => { if (e.capa?.nombre === nombre && e.capa.fase === "entra") { e.capa.fase = "quieta"; pintar(); } }, 320);
}
function cerrarCapa(despues) {
  if (!e.capa) { despues ? despues() : pintar(); return; }
  e.capa.fase = "sale";
  pintar();
  luego(() => { e.capa = null; despues ? despues() : pintar(); }, espera(200));
}
let tNotif;
function notificar(texto, accion = null) {
  clearTimeout(tNotif);
  e.notif = { texto, accion, fase: "entra", n: (e.notif?.n ?? 0) + 1 };
  const n = e.notif.n;
  pintar();
  luego(() => { if (e.notif?.n === n) { e.notif.fase = "quieta"; pintar(); } }, 260);
  tNotif = setTimeout(() => cerrarNotif(n), accion ? 9000 : 4500);
}
function cerrarNotif(n) {
  if (!e.notif || (n !== undefined && e.notif.n !== n)) return;
  e.notif.fase = "sale";
  pintar();
  luego(() => { if (e.notif?.fase === "sale") { e.notif = null; pintar(); } }, espera(200));
}
const fase = (f) => (f === "entra" ? "entra" : f === "sale" ? "sale" : "");
const notificacion = () =>
  e.notif ? `<div class="notif ${e.notif.clase ?? ""} ${fase(e.notif.fase)}" role="status"><span>${esc(e.notif.texto)}</span>${e.notif.accion ? `<button class="accion-n" data-a="${e.notif.accion.a}">${e.notif.accion.texto}</button>` : ""}</div>` : "";
const menuMas = (id, opciones, etiqueta) =>

    e.menu === id ? `<span class="lista-acc">${opciones.map(([t, a, v, peligro]) => `<button data-a="${a}" data-v="${v ?? ""}" class="${peligro ? "peligro" : ""}">${t}</button>`).join("")}</span>` : ""

  try {
    document.getElementById("casos").innerHTML = CASOS.map((c) => `<button data-caso="${c.id}" aria-pressed="${c.id === e.caso}">${c.titulo}<small>${c.sub}</small></button>`).join("");
    document.getElementById("nota").innerHTML = CASOS.find((c) => c.id === e.caso).nota();
    document.querySelectorAll("#temas button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tema === e.tema)));
    const act = document.activeElement, foco = act?.closest?.("#escena") ? act.id : null, pos = act?.selectionStart;
    const scrolls = [...document.querySelectorAll("#escena .datos-r, #escena .scroll-p")].map((x) => x.scrollTop);
    document.getElementById("escena").innerHTML = e.caso === "resumen" ? resumen() : `<div class="app" data-tema="${e.tema}">${vistaHoy() ? escenaHoy() : escenaPropuesta()}</div>`;
    document.querySelectorAll("#escena .datos-r, #escena .scroll-p").forEach((x, i) => { if (scrolls[i]) x.scrollTop = scrolls[i]; });
    if (foco && document.getElementById(foco)) { const el = document.getElementById(foco); el.focus({ preventScroll: true }); try { if (pos != null) el.setSelectionRange(pos, pos); } catch {} }
    else document.querySelector("#escena [autofocus]")?.focus({ preventScroll: true });
  } finally { pintando = false; }
}

document.addEventListener("input", (ev) => { if (ev.target.dataset?.c === "r-pot") { e.r.potencia = ev.target.value; pintar(); } });
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && e.capa) cerrarCapa();
  if (ev.key === "Enter" && e.capa?.nombre === "revisar") { ev.preventDefault(); document.querySelector('[data-a="r-revisar-si"]')?.click(); }
  if (ev.key === "Enter" && ev.target.dataset?.c === "r-pot") { e.r.corrigiendo = false; pintar(); }
});
let arrastre = null;
document.addEventListener("pointerdown", (ev) => {
  const d = ev.target.closest("[data-divisor]");
  if (!d) return;
  ev.preventDefault();
  const cont = d.closest(".vivo-r");
  arrastre = { cont, r: cont.getBoundingClientRect(), d };
  d.classList.add("activo");
});
document.addEventListener("pointermove", (ev) => {
  if (!arrastre) return;
  const w = Math.round(Math.min(Math.max(arrastre.r.right - ev.clientX - 4, 360), arrastre.r.width - 520 - 9));
  arrastre.w = w; arrastre.cont.style.setProperty("--panel", `${w}px`);
});
document.addEventListener("pointerup", () => { if (!arrastre) return; if (arrastre.w) e.r.ancho = arrastre.w; arrastre = null; pintar(); });
document.addEventListener("dblclick", (ev) => { if (ev.target.closest("[data-divisor]")) { e.r.ancho = null; pintar(); } });
document.getElementById("casos").addEventListener("click", (ev) => { const b = ev.target.closest("[data-caso]"); if (b) { e.caso = b.dataset.caso; reiniciar(); pintar(); } });
document.getElementById("temas").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) { e.tema = b.dataset.tema; pintar(); } });
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-a]");
  if (!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  ev.preventDefault();
  switch (a) {
    case "nada": return;
    case "cerrar": return cerrarCapa();
    case "g-vista": e.vista = v; reiniciar(); return pintar();
    case "g-reiniciar": reiniciar(); return pintar();
    case "r-corregir": e.r.corrigiendo = true; e.r.pestana = vistaHoy() ? e.r.pestana : "informe"; return pintar();
    case "r-listo": e.r.corrigiendo = false; return pintar();
    case "r-pestana": e.r.pestana = v; return pintar();
    case "r-ampliar": return abrirCapa("ampliar");
    case "r-ocultar": e.r.visible = false; return transicion(() => {});
    case "r-mostrar": e.r.visible = true; return transicion(() => {});
    case "r-revisar": return abrirCapa("revisar");
    case "r-revisar-si": return cerrarCapa(() => { transicion(() => { e.r.estado = "revisado"; e.r.corrigiendo = false; }); avisar("Marcado revisado"); });
    case "r-siguiente": return avisar("Aquí se abre el siguiente levantamiento");
  }
});
e.caso = "revision";
reiniciar();
pintar();

</script>
