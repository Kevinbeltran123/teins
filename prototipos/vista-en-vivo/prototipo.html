<title>Vista en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Iteración 26 (ADR-0031) con la base Precisión: la vista en vivo de la cotización, el informe, la revisión y los
   envíos. Base de estilos del prototipo de la iteración 25. Arriba los casos; abajo, la pantalla de oficina. La
   página sigue el tema del visor; la app, el que se elige arriba. */
:root {
  --pagina: #ECEEF2; --pagina-texto: #14161A; --pagina-sec: #50555F; --pagina-panel: #FFFFFF; --pagina-borde: #D6DAE1; --pagina-foco: #1F4FD1;
  --curva: cubic-bezier(0.2, 0, 0, 1);
  --fuente: "Geist", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --pagina: #050608; --pagina-texto: #ECEEF2; --pagina-sec: #9BA1AD; --pagina-panel: #0E1116; --pagina-borde: #20252E; --pagina-foco: #8FB0FF; }
}
:root[data-theme="dark"] { color-scheme: dark; --pagina: #050608; --pagina-texto: #ECEEF2; --pagina-sec: #9BA1AD; --pagina-panel: #0E1116; --pagina-borde: #20252E; --pagina-foco: #8FB0FF; }

.app, .app[data-tema="claro"] {
  color-scheme: light;
  --fondo: #FAFAFB; --sup: #FFFFFF; --sup2: #F3F4F6; --sup3: #E9EBEF; --linea: #E5E7EB; --linea-fuerte: #D5D8DE;
  --texto: #111317; --sec: #5E646E; --ter: #6F7580;
  --marca: #2F5FE8; --marca-texto: #FFFFFF; --marca-suave: rgba(47,95,232,.09); --marca-borde: rgba(47,95,232,.35);
  --ok: #188A5B; --alerta: #A15C00; --peligro: #D22F34; --revision: #6B4FD3;
  --sombra-capa: 0 0 0 1px rgba(17,19,23,.08), 0 18px 48px rgba(17,19,23,.16); --sombra-boton: 0 1px 2px rgba(17,19,23,.06);
  --velo: rgba(17,19,23,.28); --filtro-logo: none;
}
.app[data-tema="oscuro"] {
  color-scheme: dark;
  --fondo: #0A0B0D; --sup: #111316; --sup2: #17191D; --sup3: #1E2126; --linea: #23262C; --linea-fuerte: #2E323A;
  --texto: #EDEEF0; --sec: #8B9099; --ter: #7C828C;
  --marca: #3B6FF5; --marca-texto: #FFFFFF; --marca-suave: rgba(59,111,245,.14); --marca-borde: rgba(110,150,255,.45);
  --ok: #3DBE8B; --alerta: #E8A33D; --peligro: #E5484D; --revision: #A38BFA;
  --sombra-capa: 0 0 0 1px rgba(255,255,255,.06), 0 16px 48px rgba(0,0,0,.55); --sombra-boton: 0 1px 2px rgba(0,0,0,.4);
  --velo: rgba(3,4,6,.62); --filtro-logo: brightness(0) invert(1);
}
@media (prefers-color-scheme: dark) {
  .app[data-tema="sistema"] {
    color-scheme: dark;
    --fondo: #0A0B0D; --sup: #111316; --sup2: #17191D; --sup3: #1E2126; --linea: #23262C; --linea-fuerte: #2E323A;
    --texto: #EDEEF0; --sec: #8B9099; --ter: #7C828C;
    --marca: #3B6FF5; --marca-texto: #FFFFFF; --marca-suave: rgba(59,111,245,.14); --marca-borde: rgba(110,150,255,.45);
    --ok: #3DBE8B; --alerta: #E8A33D; --peligro: #E5484D; --revision: #A38BFA;
    --sombra-capa: 0 0 0 1px rgba(255,255,255,.06), 0 16px 48px rgba(0,0,0,.55); --sombra-boton: 0 1px 2px rgba(0,0,0,.4);
    --velo: rgba(3,4,6,.62); --filtro-logo: brightness(0) invert(1);
  }
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--pagina); color: var(--pagina-texto); font-family: var(--fuente); padding: 28px 16px 56px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pagina-foco); outline-offset: 2px; }

/* ---------- La página del prototipo ---------- */
.envoltura { max-width: 1400px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
.cabeza { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.cabeza h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.cabeza p { margin: 6px 0 0; color: var(--pagina-sec); max-width: 70ch; line-height: 1.5; font-size: 15px; }
.segmentos { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--pagina-panel); border: 1px solid var(--pagina-borde); flex-wrap: wrap; }
.segmentos button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; font-weight: 500; font-size: 14px; color: var(--pagina-sec); }
.segmentos button[aria-pressed="true"] { background: var(--pagina-texto); color: var(--pagina); }
.cuerpo { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1000px) { .cuerpo { grid-template-columns: minmax(0, 1fr); } }
.guia { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 16px; }
.casos { display: flex; flex-direction: column; gap: 2px; }
.casos .grupo { font-size: 12px; color: var(--pagina-sec); font-weight: 500; padding: 10px 10px 4px; }
.casos button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-size: 14px; color: var(--pagina-texto); display: flex; flex-direction: column; gap: 1px; }
.casos button small { color: var(--pagina-sec); font-size: 12.5px; }
.casos button:hover { background: var(--pagina-panel); }
.casos button[aria-pressed="true"] { background: var(--pagina-panel); box-shadow: inset 0 0 0 1px var(--pagina-borde); font-weight: 500; }
.nota { background: var(--pagina-panel); border: 1px solid var(--pagina-borde); border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.55; display: flex; flex-direction: column; gap: 8px; }
.nota h2 { margin: 0; font-size: 15px; font-weight: 600; }
.nota p { margin: 0; color: var(--pagina-sec); }
.nota b { color: var(--pagina-texto); font-weight: 500; }
.nota .probar { color: var(--pagina-texto); }
.nota a { color: var(--pagina-foco); }

/* ---------- La app ---------- */
.app { font-family: var(--fuente); color: var(--texto); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.app svg { width: 16px; height: 16px; flex: none; stroke-width: 1.6; }
.ventana { position: relative; overflow: hidden; isolation: isolate; border-radius: 12px; background: var(--fondo); box-shadow: 0 0 0 1px var(--linea-fuerte), 0 30px 80px rgba(0,0,0,.22); height: 660px; display: grid; grid-template-columns: 208px minmax(0, 1fr); }
@media (max-width: 760px) { .ventana { grid-template-columns: minmax(0, 1fr); } .menu { display: none; } }
.menu { border-right: 1px solid var(--linea); padding: 16px 10px; display: flex; flex-direction: column; gap: 18px; }
.menu .logo img { height: 30px; display: block; filter: var(--filtro-logo); margin: 2px 8px; }
.menu nav { display: flex; flex-direction: column; gap: 1px; }
.menu .grupo { font-size: 12px; color: var(--ter); padding: 10px 8px 4px; font-weight: 500; }
.menu a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: 7px; color: var(--sec); text-decoration: none; font-size: 13px; }
.menu a:hover { background: var(--sup2); color: var(--texto); }
.menu a[aria-current="page"] { background: var(--sup2); color: var(--texto); font-weight: 500; }
.menu a[aria-current="page"] svg { color: var(--marca); }
.contenido { min-width: 0; overflow: auto; display: flex; flex-direction: column; }
.barra-sup { height: 48px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 20px; border-bottom: 1px solid var(--linea); font-size: 13px; color: var(--sec); }
.barra-sup b { color: var(--texto); font-weight: 500; }
.pagina { padding: 22px 28px 60px; display: flex; flex-direction: column; gap: 18px; }
.cab { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; }
.cab h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
.cab .datos { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--sec); font-size: 13px; }
.cab .datos span + span::before { content: "·"; margin-right: 14px; color: var(--ter); }
.acciones { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 7px; border: 0; font-size: 13px; font-weight: 500; background: var(--sup); color: var(--texto); box-shadow: inset 0 0 0 1px var(--linea-fuerte), var(--sombra-boton); white-space: nowrap; transition: background .15s var(--curva), transform .12s var(--curva); }
.btn:hover { background: var(--sup2); }
.btn:active { transform: translateY(1px); }
.btn.principal { background: var(--marca); color: var(--marca-texto); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), var(--sombra-boton); }
.btn.principal:hover { filter: brightness(1.06); }
.btn.peligro { background: var(--peligro); color: #FFFFFF; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), var(--sombra-boton); }
.btn.fantasma { background: transparent; box-shadow: none; color: var(--sec); }
.btn.fantasma:hover { background: var(--sup2); color: var(--texto); }
.btn.texto-peligro { background: transparent; box-shadow: none; color: var(--peligro); padding-inline: 6px; }
.btn.chico { height: 28px; padding: 0 10px; font-size: 12.5px; border-radius: 6px; }
.btn[aria-busy="true"] { opacity: .8; cursor: progress; }
.kbd { font-size: 11px; opacity: .6; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; line-height: 16px; }
.giro { width: 14px; height: 14px; border-radius: 99px; border: 2px solid currentColor; border-right-color: transparent; animation: girar .7s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
.estado { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 500; color: var(--sec); background: var(--sup2); white-space: nowrap; }
.estado i { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
.estado.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.estado.peligro { color: var(--peligro); background: color-mix(in srgb, var(--peligro) 12%, transparent); }
.guardado { display: inline-flex; align-items: center; gap: 7px; color: var(--sec); font-size: 13px; }
.guardado i { width: 6px; height: 6px; border-radius: 99px; background: var(--ok); }
.guardado.cambios i { background: var(--alerta); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--sec); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
td { padding: 0 10px; height: 44px; border-bottom: 1px solid var(--linea); }
td.der { text-align: right; white-space: nowrap; }
tr.inactiva td { color: var(--ter); }
tr.recien td { animation: resaltar 1.6s var(--curva); }
@keyframes resaltar { from { background: var(--marca-suave); } }
.sec { color: var(--sec); }

/* Filas de datos (detalle) */
.dato { display: grid; grid-template-columns: 190px minmax(0, 1fr) auto; gap: 6px 16px; padding: 11px 0; border-top: 1px solid var(--linea); align-items: start; }
.dato:last-child { border-bottom: 1px solid var(--linea); }
.dato .n { color: var(--sec); }
.dato .v b { font-weight: 500; font-size: 15px; }
.dato .v small { color: var(--sec); margin-left: 3px; }
.dato.editando { grid-template-columns: 190px minmax(0, 1fr); background: var(--marca-suave); margin-inline: -12px; padding-inline: 12px; border-radius: 8px; }
.editor { display: flex; flex-direction: column; gap: 10px; }
.corregido { display: block; font-size: 12px; color: var(--sec); margin-top: 2px; }
.corregido s { color: var(--ter); }

/* Campos */
.campo { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.campo > label, .campo > .etq { font-weight: 500; display: flex; gap: 8px; align-items: baseline; }
.campo small.obl { font-weight: 400; color: var(--sec); font-size: 12px; }
.control { width: 100%; height: 32px; border-radius: 7px; border: 0; background: var(--sup); box-shadow: inset 0 0 0 1px var(--linea-fuerte); padding: 0 10px; color: var(--texto); font-size: 13px; }
textarea.control { height: auto; min-height: 72px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
.control:focus { outline: none; box-shadow: inset 0 0 0 1px var(--marca), 0 0 0 3px var(--marca-suave); }
.control.error { box-shadow: inset 0 0 0 1px var(--peligro); animation: sacudida .35s var(--curva); }
.control.error:focus { box-shadow: inset 0 0 0 1px var(--peligro), 0 0 0 3px color-mix(in srgb, var(--peligro) 14%, transparent); }
@keyframes sacudida { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.msj-error { color: var(--peligro); font-size: 12.5px; font-weight: 500; display: flex; gap: 6px; align-items: center; margin: 0; }
.ayuda { color: var(--sec); font-size: 12.5px; margin: 0; }
.casillas { border: 1px solid var(--linea); border-radius: 8px; overflow: hidden; }
.casillas label { display: flex; gap: 10px; align-items: center; padding: 8px 12px; font-size: 13px; background: var(--sup); cursor: pointer; }
.casillas label + label { border-top: 1px solid var(--linea); }
.casillas label:has(input:checked) { background: var(--marca-suave); }
.casillas input { accent-color: var(--marca); width: 16px; height: 16px; margin: 0; }
.aviso { display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; background: color-mix(in srgb, var(--c, var(--marca)) 7%, var(--sup)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c, var(--marca)) 22%, transparent); }
.aviso svg { color: var(--c, var(--marca)); margin-top: 2px; }
.aviso.alerta { --c: var(--alerta); } .aviso.peligro { --c: var(--peligro); }

/* Capas: velo, diálogo, hoja lateral */
.velo { position: absolute; inset: 0; z-index: 20; background: var(--velo); animation: aparecer .2s var(--curva) both; }
@keyframes aparecer { from { opacity: 0; } }
.dialogo { position: absolute; z-index: 21; left: 50%; top: 50%; translate: -50% -50%; width: min(460px, calc(100% - 32px)); background: var(--sup); border-radius: 12px; box-shadow: var(--sombra-capa); animation: entrar .28s var(--curva) both; overflow: hidden; }
@keyframes entrar { from { opacity: 0; scale: .97; } }
.dialogo .dentro { padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.dialogo h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
.consecuencias { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--linea); border-radius: 10px; }
.consecuencias li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.4; }
.consecuencias li + li { border-top: 1px solid var(--linea); }
.consecuencias li svg { margin-top: 2px; color: var(--sec); }
.consecuencias li.grave svg { color: var(--peligro); }
.consecuencias small { display: block; color: var(--sec); font-size: 12px; }
.pie { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 20px; background: var(--sup2); border-top: 1px solid var(--linea); }
.pie .izq { margin-right: auto; }
.lateral { position: absolute; z-index: 21; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--sup); box-shadow: var(--sombra-capa); display: flex; flex-direction: column; animation: deslizar .28s var(--curva) both; }
@keyframes deslizar { from { transform: translateX(32px); opacity: 0; } }
.lateral header { padding: 18px 20px 12px; }
.lateral header h2 { margin: 0; font-size: 16px; font-weight: 600; }
.lateral header p { margin: 2px 0 0; font-size: 13px; color: var(--sec); }
.lateral .dentro { flex: 1; overflow: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
.lateral .pie { padding: 12px 20px; }
.efecto { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 8px; background: var(--sup2); font-size: 13px; }
.efecto div { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: start; }
.efecto svg { margin-top: 2px; color: var(--sec); }

/* Notificación con "Deshacer" y la línea que se consume */
.notif { position: absolute; left: 50%; bottom: 20px; translate: -50% 0; z-index: 30; background: var(--texto); color: var(--fondo); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.28); display: flex; align-items: center; gap: 12px; padding: 4px 4px 4px 14px; min-height: 44px; font-size: 13px; font-weight: 500; overflow: hidden; width: max-content; max-width: calc(100% - 24px); animation: subir .28s var(--curva) both; }
@keyframes subir { from { transform: translateY(12px); opacity: 0; } }
.notif button { border: 0; background: transparent; color: inherit; font-weight: 600; padding: 7px 10px; border-radius: 6px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fondo) 25%, transparent); }
.notif::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--marca); transform-origin: left; animation: consumir var(--dur, 10s) linear both; }
@keyframes consumir { to { transform: scaleX(0); } }


/* ---------- Iteración 26: la página del prototipo a todo el ancho ---------- */
.envoltura { max-width: 1680px; }
.cuerpo { grid-template-columns: minmax(0, 1fr); gap: 14px; }
.guia { position: static; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.casos { flex-direction: row; flex-wrap: wrap; gap: 4px; align-items: stretch; }
.casos .grupo { padding: 8px 6px 0 12px; align-self: center; }
.casos button { padding: 7px 12px; }
.nota { flex-direction: row; flex-wrap: wrap; align-items: flex-start; gap: 8px 28px; }
.nota > div { flex: 1 1 420px; display: flex; flex-direction: column; gap: 6px; }
.nota .mandos-n { flex: 0 1 auto; display: flex; flex-direction: column; gap: 8px; }
.nota .mandos-n .fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--pagina-sec); }
.nota .segmentos button { font-size: 13px; padding: 5px 10px; }
.ventana { height: 800px; }
.ventana.angosta { max-width: 1100px; margin-inline: auto; }
.contenidos { display: contents; }

/* ---------- Resumen ---------- */
.resumen-p { background: var(--pagina-panel); border: 1px solid var(--pagina-borde); border-radius: 12px; padding: 24px 26px; display: flex; flex-direction: column; gap: 22px; color: var(--pagina-texto); }
.resumen-p h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.resumen-p h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.resumen-p p, .resumen-p li { color: var(--pagina-sec); font-size: 14px; line-height: 1.55; margin: 0; }
.resumen-p li b, .resumen-p p b, .resumen-p td b { color: var(--pagina-texto); font-weight: 500; }
.resumen-p table th { color: var(--pagina-sec); border-color: var(--pagina-borde); }
.resumen-p table td { border-color: var(--pagina-borde); height: auto; padding: 10px; vertical-align: top; font-size: 13.5px; line-height: 1.5; color: var(--pagina-sec); }
.resumen-p ol, .resumen-p ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
@media (max-width: 900px) { .dos { grid-template-columns: 1fr; } }

/* ---------- Documento en vivo: el editor a la izquierda, la hoja a la derecha ---------- */
.contenido.doc { overflow: hidden; }
.barra-sup .der { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.vivo { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); }
.vivo.sin-lienzo { grid-template-columns: minmax(0, 1fr); }
.editor-d { min-width: 0; overflow: auto; padding: 22px 26px 64px; display: flex; flex-direction: column; gap: 26px; border-right: 1px solid var(--linea); }
.vivo.sin-lienzo .editor-d { border-right: 0; }
.editor-d .cab h1 { font-size: 20px; }
.titulo-estado { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.estado.revision { color: var(--revision); background: color-mix(in srgb, var(--revision) 12%, transparent); }
.estado.marca { color: var(--marca); background: var(--marca-suave); }
.bloque { display: flex; flex-direction: column; gap: 8px; }
.bloque > h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--sec); display: flex; gap: 8px; align-items: baseline; }
.bloque > h2 .n { color: var(--ter); }
.lineas-e { display: flex; flex-direction: column; border-top: 1px solid var(--linea); }
.linea-e { display: grid; grid-template-columns: minmax(0, 1fr) 64px 112px 100px 28px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--linea); font-size: 13px; }
.linea-e.cab-l { color: var(--sec); font-size: 12px; padding: 6px 0; }
.linea-e .num { text-align: right; }

/* =====================================================================================================
   paquetes/documentos (ADR-0031), en el prototipo. Son las plantillas del servidor casi al pie de la letra
   (cotización, informe y correo): la vista previa y el PDF salen de este mismo código. Lo único distinto es
   la salida: el PDF lleva los estilos en <style> y Geist incrustada; la vista enlaza documentos.css y la
   fuente por su archivo (aquí, en línea y desde Google Fonts, porque el prototipo es un solo archivo).
   ===================================================================================================== */
const ZONA = "America/Bogota";
const fechaLarga = new Intl.DateTimeFormat("es-CO", { dateStyle: "long", timeZone: ZONA });
const fechaHora = new Intl.DateTimeFormat("es-CO", { dateStyle: "long", timeStyle: "short", timeZone: ZONA });
const diaUTC = (s, op) => new Intl.DateTimeFormat("es-CO", { ...op, timeZone: "UTC" }).format(new Date(`${s}T00:00:00Z`));
const diaCorto = (s) => diaUTC(s, { day: "numeric", month: "short", year: "numeric" }).replace(/\./g, "").replace(/ de /g, " ");
const diaLargo = (s) => diaUTC(s, { day: "numeric", month: "long", year: "numeric" });
const pesos = (n) => `$ ${Math.round(n).toLocaleString("es-CO")}`;
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const primerNombre = (n) => n.trim().split(/\s+/)[0] ?? n;
const unaLinea = (t) => t.replace(/\s+/g, " ").trim();

/* La salida de la vista: la fuente por archivo y lo propio de la pantalla (hoja continua, franjas en los saltos
   forzados, el destello de lo que cambió y las marcas de la revisión). Nada de esto llega al PDF. */
const FUENTE_VISTA = `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">`;
const vista = (margenes) => `

/* ---------------- Informe (servidor: modulos/informes/pdf/plantilla.ts) ---------------- */
const MARCA_I = { superficie: "#002B81", acento: "#FFC21A", texto: "#15171A", secundario: "#525152", division: "#E1E4EA" };
const parrafos = (texto) => texto.split(/\n{2,}/).map((p) => p.trim()).filter(Boolean).map((p) => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");

function plantillaInforme(c, { fotos }) {
  const capitulos = c.levantamientos
    .map((l, i) => {
      const secciones = l.secciones
        .map((s) => {
          // data-dato: la revisión resalta el dato corregido sin tocar el resto (el PDF lo ignora).
          const datos = (s.datos ?? []).map(([clave, etq, valor, tenue]) => `<tr data-dato="${s.clave}/${clave}"><th>${esc(etq)}</th><td${tenue ? ' class="tenue"' : ""}>${esc(valor)}</td></tr>`).join("");
          const cantidades = s.cantidades
            ? `<h4>${esc(s.cantidades.etiqueta)}</h4><table class="cantidades"><thead><tr><th>Descripción</th><th class="numero">Cantidad</th><th>Unidad</th><th>Observación</th></tr></thead><tbody>${s.cantidades.filas.map(([d, q, u, o]) => `<tr><td>${esc(d)}</td><td class="numero">${esc(q)}</td><td>${esc(u)}</td><td>${esc(o)}</td></tr>`).join("")}</tbody></table>`
            : "";
          const galerias = s.fotos
            ? `<h4>${esc(s.fotos.etiqueta)}</h4><div class="fotos">${Array.from({ length: s.fotos.n }, (_, n) => {
                const pie = `Foto ${n + 1} de ${esc(s.fotos.etiqueta.toLowerCase())}`;
                const src = fotos?.[n];
                return src ? `<figure><img src="${src}" alt="${pie}"><figcaption>${pie}</figcaption></figure>` : `<figure class="falta"><div>[FOTO]</div><figcaption>${pie}</figcaption></figure>`;
              }).join("")}</div>`
            : "";
          const croquis = s.boceto ? `<h4>${esc(s.boceto)}</h4><div class="hojas"><figure class="boceto apaisada">${BOCETO_SVG}</figure></div>` : "";
          const k = s.constancia;
          const constancia = k
            ? `<section class="constancia"><h4>Constancia de visita</h4><p>${esc(k.declaracion)}</p><div class="firmado"><div class="trazo">${FIRMA_SVG}<p><strong>${esc(k.nombre)}</strong><br><span class="tenue">${esc(k.cargo)}</span></p></div><p class="tenue">Firmado en el sitio el ${fechaHora.format(new Date(k.firmadoEn))}, en el teléfono del técnico.</p></div></section>`
            : "";
          return `<section class="seccion"><h3>${esc(s.titulo)}</h3>${datos ? `<table class="datos">${datos}</table>` : ""}${cantidades}${galerias}${croquis}${constancia}</section>`;
        })

      return `<article class="capitulo salto" id="cap-${l.id}">

        ${secciones}
      </article>`;
    })
    .join("");
  const planos = c.planos.length
    ? `<section class="bloque" id="planos"><h2>Planos anexos</h2><p>Los planos se incluyen al final de este documento, en este orden:</p><ol>${c.planos.map((p) => `<li>${esc(p.nombre)}</li>`).join("")}</ol></section>`
    : "";
  return `<!doctype html>

/* ---------------- Correo (servidor: modulos/envios/mensajes.ts) ---------------- */
const versionDe = (m) => (m.numero > 1 ? ` (versión ${m.numero})` : "");
const asunto = (m) => unaLinea(m.documento === "cotizacion" ? `Cotización ${m.cotizacion} · ${m.sitio}${versionDe(m)}` : `Informe de la visita del ${diaCorto(m.programadaPara)} · ${m.sitio}${versionDe(m)}`);
function presentacion(m, sinAdjunto, fuerte, texto) {
  if (m.documento === "cotizacion") return `Le enviamos la cotización ${fuerte(texto(m.cotizacion))} para ${fuerte(texto(m.sitio))}. ${sinAdjunto ? "El PDF pesa demasiado para el correo: respóndanos y se lo hacemos llegar." : "Va adjunta en PDF."}`;
  return `Le enviamos el informe de la visita del ${fuerte(diaLargo(m.programadaPara))} a ${fuerte(texto(m.sitio))} (${texto(m.motivo)}). ${sinAdjunto ? "El PDF pesa demasiado para el correo: descárguelo del portal." : "Va adjunto en PDF."}`;
}
const tema = (m) => (m.documento === "cotizacion" ? "las cotizaciones" : "los informes técnicos");
function htmlDeCorreo(m, o) {
  const e = { organizacion: esc(m.organizacion), cliente: esc(m.cliente) };
  const parrafo = (html) => `<p style="margin:0 0 16px">${html}</p>`;
  return `<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${esc(asunto(m))}</title></head>
<body style="margin:0;padding:24px 12px;background:#E9ECF1;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#15171A">

const leerPesos = (s) => { const d = s.replace(/\D/g, ""); return d ? Number(d) : null; };

const pctValido = (p) => /^\d{1,3}([.,]\d{1,2})?$/.test(p) && Number(p.replace(",", ".")) <= 100;
function totales() {
  const c = e.cot;
  const lineas = c.lineas.map((l) => { const p = leerPesos(l.precio); const q = Number(l.cantidad.replace(",", ".")); return { ...l, p, q, total: p === null || !Number.isFinite(q) ? null : Math.round(p * q) }; });
  const subtotal = lineas.reduce((s, l) => s + (l.total ?? 0), 0);
  const sinPrecio = lineas.filter((l) => l.p === null).length;
  let filas, total;
  if (c.imp.tipo === "iva") { const iva = Math.round(subtotal * 0.19); filas = [["IVA 19 %", iva]]; total = subtotal + iva; }
  else {
    const v = (k) => (pctValido(c.imp[k]) ? Number(c.imp[k].replace(",", ".")) : 0);
    const a = Math.round((subtotal * v("a")) / 100), i = Math.round((subtotal * v("i")) / 100), u = Math.round((subtotal * v("u")) / 100), iu = Math.round(u * 0.19);
    filas = [[`Administración ${pct(c.imp.a)}`, a], [`Imprevistos ${pct(c.imp.i)}`, i], [`Utilidad ${pct(c.imp.u)}`, u], ["IVA 19 % sobre la utilidad", iu]];
    total = subtotal + a + i + u + iu;
  }
  return { lineas, subtotal, sinPrecio, filas, total };
}

/* =====================================================================================================
   La hoja en vivo. Se arma una vez (srcdoc); al escribir se reemplaza solo el cuerpo, en el siguiente cuadro,
   sin recargar el marco ni perder el desplazamiento. Lo que cambió se resalta y se desvanece.
   ===================================================================================================== */
function generar(doc) {
  if (doc === "cotizacion") return plantillaCotizacion(contenidoCotizacion());
  if (doc === "informe") return plantillaInforme(contenidoInforme(), { fotos: e.estadoVista === "sinred" ? null : FOTOS });
  if (doc === "capitulo") return plantillaInforme(contenidoInforme("ups"), { fotos: FOTOS });
  if (doc.startsWith("correo-")) {
    const [, documento, quien] = doc.split("-");
    return htmlDeCorreo(mensaje(documento), { nombre: CONTACTOS[quien].nombre, portal: documento === "informe" ? "https://[portal de TEINS]" : undefined, sinAdjunto: false });
  }
  return "";
}
const cuerpoDe = (html) => html.slice(html.indexOf(">", html.indexOf("<body")) + 1, html.lastIndexOf("</body>"));
const hojasDe = (raiz) => [...raiz.querySelectorAll("*")].filter((n) => n.children.length === 0 && n.textContent.trim());

function marcar(iframe) {
  const doc = iframe.contentDocument;
  if (!doc?.documentElement) return;
  const lienzo = iframe.closest(".lienzo");
  if (lienzo) doc.documentElement.style.setProperty("--vista-fondo", getComputedStyle(lienzo).backgroundColor);
  if (iframe.dataset.doc !== "capitulo") return;
  doc.documentElement.classList.add("vista-capitulo");
  const marcas = { ...e.rev.marcas };
  if (e.rev.corrigiendo) marcas["equipo/tension_entrada"] = `Antes: ${e.rev.tension} V · sin guardar`;
  for (const [clave, antes] of Object.entries(marcas)) {
    const tr = doc.querySelector(`tr[data-dato="${clave}"]`);
    if (!tr) continue;
    tr.querySelector("td").dataset.antes = antes;
    tr.classList.add(e.rev.corrigiendo && clave === "equipo/tension_entrada" ? "vista-editando" : "vista-corregido");
  }
}
function anexos(iframe) {
  if (iframe.dataset.doc !== "informe") return;
  const doc = iframe.contentDocument;
  // Los planos anexos no se dibujan: una ficha con su nombre y sus páginas (ADR-0031, punto 5).
  const fichas = e.inf.planos.map((p) => `<div class="vista-anexo"><i>PDF</i><span><b>${esc(p.nombre)}</b> · ${p.paginas === 1 ? "1 página" : `${p.paginas} páginas`}, se anexa al final del PDF</span></div>`).join("");
  doc.getElementById("planos")?.insertAdjacentHTML("beforeend", fichas);
}
function medir(iframe) {
  const doc = iframe.contentDocument;
  const lienzo = iframe.closest(".lienzo");
  if (!doc?.body || !lienzo) return;
  const ancho = Number(iframe.dataset.ancho);
  const estilo = getComputedStyle(lienzo);
  const disponible = lienzo.clientWidth - parseFloat(estilo.paddingLeft) - parseFloat(estilo.paddingRight);
  const s = Math.min(1, disponible / ancho);
  const alto = doc.documentElement.scrollHeight;
  Object.assign(iframe.style, { width: `${ancho}px`, height: `${alto}px`, transform: `scale(${s})` });
  Object.assign(iframe.parentElement.style, { width: `${ancho * s}px`, height: `${alto * s}px` });
  iframe.dataset.escala = s;
}
function remedir(iframe) { medir(iframe); setTimeout(() => medir(iframe), 120); setTimeout(() => medir(iframe), 700); }

function reemplazar(iframe) {
  const doc = iframe.contentDocument;
  if (!doc?.body) return;
  const html = generar(iframe.dataset.doc);
  const antes = hojasDe(doc.body).map((n) => n.textContent);
  doc.body.innerHTML = cuerpoDe(html);
  const despues = hojasDe(doc.body);
  if (despues.length === antes.length) despues.forEach((n, i) => { if (n.textContent !== antes[i]) n.classList.add("vista-cambio"); });
  marcar(iframe);
  anexos(iframe);
  remedir(iframe);
}
let cuadro = 0;
function programarVista() {
  if (cuadro) return;
  cuadro = requestAnimationFrame(() => { cuadro = 0; document.querySelectorAll("#escena iframe[data-doc][data-cargado]").forEach(reemplazar); });
}
function prepararHojas() {
  document.querySelectorAll("#escena iframe[data-doc]:not([data-armado])").forEach((f) => { f.dataset.armado = "1"; f.srcdoc = generar(f.dataset.doc); });

document.addEventListener("load", (ev) => {
  const f = ev.target;
  if (f.tagName !== "IFRAME" || !f.dataset.doc) return;
  f.dataset.cargado = "1";
  marcar(f);
  anexos(f);
  remedir(f);
  f.contentDocument?.fonts?.ready.then(() => medir(f));
  if (f.dataset.doc === "capitulo" && e.rev.corrigiendo) setTimeout(() => irA(f, 'tr[data-dato="equipo/tension_entrada"]'), 150);
}, true);
addEventListener("resize", () => document.querySelectorAll("#escena iframe[data-cargado]").forEach(medir));

/* Lleva el lienzo hasta una parte del documento (al enfocar su sección en el editor). */
function irA(iframe, selector) {
  const el = iframe?.contentDocument?.querySelector(selector);
  const lienzo = iframe?.closest(".lienzo");
  if (!el || !lienzo) return;
  const s = Number(iframe.dataset.escala || 1);
  const cab = lienzo.querySelector(".lienzo-cab")?.offsetHeight ?? 0;
  lienzo.scrollTo({ top: iframe.parentElement.offsetTop + el.getBoundingClientRect().top * s - cab - 16, behavior: "smooth" });
}

/* =====================================================================================================
   Montaje por regiones: solo se reemplaza la región que cambió. El marco del documento vive en su propia
   región, así que escribir nunca lo recarga.
   ===================================================================================================== */
const regiones = new Map();
let marcoPrevio = "";
function montar(html) {
  const esc = document.getElementById("escena");
  const t = document.createElement("template");
  t.innerHTML = html;
  const nuevas = [];
  t.content.querySelectorAll("[data-r]").forEach((r) => { nuevas.push([r.dataset.r, r.innerHTML]); r.innerHTML = ""; });
  const marco = t.innerHTML;
  if (marco !== marcoPrevio) { esc.replaceChildren(t.content); marcoPrevio = marco; regiones.clear(); }
  for (const [k, h] of nuevas) {
    if (regiones.get(k) === h) continue;
    const el = esc.querySelector(`[data-r="${k}"]`);
    if (el) el.innerHTML = h;
    regiones.set(k, h);
  }
}

    const quien = doc === "cotizacion" ? "marta" : "andres";

    return `${sinRed}<div class="correo-meta"><span>Para</span><b>${c.nombre} &lt;${c.correo}&gt;</b><span>Asunto</span><b>${esc(asunto(mensaje(doc)))}</b><span>Adjunto</span><span class="adjunto">${ic("clip")}${esc(adjuntoDe(doc))}</span></div>
      <div class="hoja-marco correo-m"><iframe data-doc="correo-${doc}-${quien}" data-ancho="640" sandbox="allow-same-origin" title="Vista previa del correo a ${c.nombre}"></iframe></div>`;
  }
  return `${sinRed}<div class="hoja-marco"><iframe data-doc="${doc}" data-ancho="816" sandbox="allow-same-origin" title="Vista previa de ${doc === "cotizacion" ? "la cotización" : "el informe"}"></iframe></div>`;
}

/* =====================================================================================================
   Cotización
   ===================================================================================================== */
function editorCotizacion() {
  const c = e.cot, t = totales();
  const vigente = c.versiones[0];
  const filas = t.lineas.map((l) => {
    const nombre = esc(l.descripcion.trim() || "la línea nueva");
    const difiere = l.catalogo !== null && l.p !== null && l.p !== l.catalogo;
    const desc = l.origen === "oficina"
      ? `<input class="control chico" id="d-${l.id}" data-c="desc" data-id="${l.id}" value="${esc(l.descripcion)}" placeholder="Qué se cobra" aria-label="Descripción de ${nombre}"><span class="origen">Agregada en oficina</span>`
      : `<b>${esc(l.descripcion)}</b><span class="origen ${difiere ? "difiere" : ""}">${l.codigo} · ${difiere ? `Catálogo: ${pesos(l.catalogo)}` : "Del catálogo"}</span>`;
    return `<div class="linea-e ${l.p === null ? "sin-precio" : ""}"><span>${desc}</span>
      <input class="control chico num" id="q-${l.id}" data-c="cantidad" data-id="${l.id}" value="${esc(l.cantidad)}" inputmode="decimal" aria-label="Cantidad de ${nombre}">
      <input class="control chico num" id="p-${l.id}" data-c="precio" data-id="${l.id}" value="${esc(l.precio)}" placeholder="Falta" inputmode="numeric" aria-label="Precio de ${nombre}">
      <span class="num total-l">${l.p === null ? "Sin precio" : pesos(l.total)}</span>
      <button class="btn-i" data-a="quitar-linea" data-v="${l.id}" aria-label="Quitar ${nombre}" title="Quitar">${ic("basura")}</button></div>`;
  }).join("");
  const aiu = c.imp.tipo === "aiu"
    ? `<div class="aiu">${[["a", "Administración"], ["i", "Imprevistos"], ["u", "Utilidad"]].map(([k, n]) => `<div class="campo"><label for="aiu-${k}">${n} %</label><input class="control chico num ${pctValido(c.imp[k]) ? "" : "error"}" id="aiu-${k}" data-c="aiu" data-v="${k}" value="${esc(c.imp[k])}" inputmode="decimal">${pctValido(c.imp[k]) ? "" : '<span class="msj-error">De 0 a 100</span>'}</div>`).join("")}</div>`
    : "";
  const versiones = c.versiones.map((v, i) => `<div class="ver"><div class="ver-cab"><b>Versión ${v.n}</b>${i === 0 ? '<span class="estado ok"><i></i>Vigente</span>' : ""}${v.pdf === "listo" ? `<button class="btn fantasma chico" data-a="nada">${ic("descargar")}PDF</button>` : '<span class="sec" style="font-size:12.5px">Generando el PDF…</span>'}</div>
      <span class="meta">Publicada ${v.fecha} por ${v.por} · ${pesos(v.total)}${v.envios.length ? ` · ${v.envios.length === 1 ? "1 envío" : `${v.envios.length} envíos`}` : ""}</span>
      ${i === 0 && v.envios.length ? `<ul class="envios-v">${v.envios.map(([n, canal, est]) => `<li>${n}<span class="det ${est === "Entregado" ? "ok" : ""}">${canal} · ${est}</span></li>`).join("")}</ul><button class="ir" data-a="nada">${ic("enviar")}Enviar a otro contacto</button>` : ""}</div>`).join("");
  return `<div class="cab"><div><div class="titulo-estado"><h1>Cotización COT-2026-0045</h1><span class="estado ok"><i></i>Versión ${vigente.n} vigente</span></div>
      <div class="datos"><span>${VISITA.cliente} · ${VISITA.sitio}</span><span>Visita del ${diaCorto(VISITA.programadaPara)}</span><span>Recibe el PDF: <b style="color:var(--texto);font-weight:500">Marta Gil</b></span></div></div></div>
    <section class="bloque" data-ancla="table.lineas"><h2>Líneas</h2>
      <div class="lineas-e"><div class="linea-e cab-l"><span>Descripción</span><span class="num">Cantidad</span><span class="num">Precio unitario</span><span class="num">Total</span><span></span></div>${filas}</div>
      <button class="agregar" data-a="agregar-linea">${ic("mas")}Agregar línea</button></section>
    <section class="bloque" data-ancla=".totales"><h2>Impuestos</h2>
      <div class="opciones">
        <label class="opcion"><input type="radio" id="imp-iva" name="imp" value="iva" ${c.imp.tipo === "iva" ? "checked" : ""}><span><b style="font-weight:500">IVA 19 %</b> sobre el subtotal</span></label>
        <label class="opcion"><input type="radio" id="imp-aiu" name="imp" value="aiu" ${c.imp.tipo === "aiu" ? "checked" : ""}><span><b style="font-weight:500">AIU</b>, con IVA sobre la utilidad</span></label>${aiu}
      </div>
      <div class="suma" aria-label="Totales"><div class="f"><span>Subtotal</span><span>${pesos(t.subtotal)}</span></div>
        ${t.sinPrecio ? `<div class="f nota-s"><span>Sin contar ${t.sinPrecio === 1 ? "la línea" : `las ${t.sinPrecio} líneas`} sin precio</span></div>` : ""}
        ${t.filas.map(([n, v]) => `<div class="f"><span>${n}</span><span>${pesos(v)}</span></div>`).join("")}
        <div class="gran"><span>Total de la versión ${siguienteCot()}</span><b>${pesos(t.total)}</b></div></div></section>
    <section class="bloque" data-ancla=".condiciones"><h2>Condiciones</h2>
      <div class="fila-2"><div class="campo"><label for="validez">Validez (días)</label><input class="control" id="validez" data-c="validez" value="${esc(c.validez)}" inputmode="numeric"></div>
        <div class="campo"><label for="pago">Forma de pago</label><input class="control" id="pago" data-c="pago" value="${esc(c.pago)}"></div></div>
      <div class="campo"><label for="notas">Notas para el cliente</label><textarea class="control" id="notas" data-c="notas">${esc(c.notas)}</textarea></div></section>
    <section class="bloque"><h2>Versiones publicadas</h2><div class="versiones">${versiones}</div>
      <p class="ayuda">Una versión publicada queda congelada. Para corregir algo se publica otra y la anterior se conserva.</p></section>`;
}
function barraDocumento(doc) {
  const d = doc === "cotizacion" ? e.cot : e.inf;
  const sinPrecio = doc === "cotizacion" ? totales().sinPrecio : 0;
  const siguiente = doc === "cotizacion" ? siguienteCot() : e.inf.publicada ? 2 : 1;
  const estado = sinPrecio ? `<span class="guardado cambios"><i></i>${sinPrecio === 1 ? "1 línea sin precio" : `${sinPrecio} líneas sin precio`}</span>` : `<span class="guardado ${d.cambiado ? "cambios" : ""}"><i></i>${d.cambiado ? "Cambios sin guardar" : "Todo guardado"}</span>`;
  return `${estado}${d.cambiado ? `<button class="btn" data-a="guardar" ${e.ocupado ? 'aria-busy="true"' : ""}>${cargando("Guardar borrador")}</button>` : ""}
    ${e.angosta ? `<button class="btn" data-a="abrir" data-v="vista-lateral">${ic("ojo")}Vista previa</button>` : ""}
    <button class="btn principal" data-a="abrir" data-v="publicar" ${sinPrecio ? 'disabled style="opacity:.5;cursor:not-allowed" title="Ponga precio a todas las líneas para publicar"' : ""}>${ic("enviar")}Publicar versión ${siguiente}</button>`;
}
function pantallaDocumento(doc) {
  const ruta = doc === "cotizacion" ? `<span>Cotizaciones / <b>COT-2026-0045</b></span>` : `<span>Informes / <b>${VISITA.cliente}</b></span>`;
  const conLienzo = !e.angosta;
  return `<div class="ventana ${e.angosta ? "angosta" : ""}">${menu(doc === "cotizacion" ? "Cotizaciones" : "Informes")}
    <div class="contenido doc"><div class="barra-sup">${ruta}<div class="der" data-r="barra">${barraDocumento(doc)}</div></div>
      <div class="vivo ${conLienzo ? "" : "sin-lienzo"}">
        <div class="editor-d" data-r="editor">${doc === "cotizacion" ? editorCotizacion() : editorInforme()}</div>
        ${conLienzo ? `<div class="lienzo" aria-label="Vista previa"><div class="lienzo-cab" data-r="lienzo-cab">${cabLienzo(doc)}</div><div class="contenidos" data-r="lienzo">${cuerpoLienzo(doc)}</div></div>` : ""}
      </div></div>
    <div class="contenidos" data-r="capa">${capaDocumento(doc)}</div><div class="contenidos" data-r="notif">${notificacion()}</div></div>`;
}
function capaDocumento(doc) {
  if (e.capa === "enviar") return capaEnviar();
  if (e.capa === "vista-lateral")
    return `<div class="velo" data-a="cerrar"></div><aside class="lateral ancha" role="dialog" aria-modal="true" aria-labelledby="t-vl"><header><h2 id="t-vl">Vista previa</h2><p>${doc === "cotizacion" ? "Cotización COT-2026-0045" : `Informe de ${VISITA.cliente}`}, versión ${doc === "cotizacion" ? siguienteCot() : 1}</p><button class="btn-i cerrar-l" data-a="cerrar" aria-label="Cerrar">${ic("x")}</button></header>
      <div class="lienzo"><div class="lienzo-cab">${cabLienzo(doc)}</div>${cuerpoLienzo(doc)}</div></aside>`;
  if (e.capa !== "publicar") return "";
  const esCot = doc === "cotizacion";
  const d = esCot ? e.cot : e.inf;
  const siguiente = esCot ? siguienteCot() : e.inf.publicada ? 2 : 1;
  const quien = esCot ? ["marta"] : ["andres"];
  const n = d.elegidos.length;
  return `<div class="velo"></div><div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="t-pub"><div class="dentro">
      <h2 id="t-pub">${esCot ? `¿Publicar la versión ${siguiente} de COT-2026-0045?` : `¿Publicar la versión ${siguiente}?`}</h2>
      <ul class="consecuencias">
        <li class="grave">${ic("candado")}<span>${esCot ? `Queda congelada con sus precios e impuestos, por <span style="white-space:nowrap">${pesos(totales().total)}</span>` : "Queda congelada tal como está"}<small>${esCot ? "Cambiar la lista de precios después no la afecta" : "Los datos corregidos después no la cambian"}</small></span></li>
        <li>${ic("doc")}<span>Es el documento de la vista previa<small>El PDF puede partir las páginas distinto</small></span></li>
        <li>${ic("historial")}<span>Para corregir algo se publica la versión ${siguiente + 1}<small>${siguiente > 1 ? `La versión ${siguiente - 1} se conserva` : "Esta se conserva"}</small></span></li>
      </ul>
      <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px"><legend class="campo" style="font-size:13px;font-weight:500;margin-bottom:8px">Enviar el PDF cuando esté listo</legend>
        <div class="casillas">${quien.map((k) => `<label><input type="checkbox" id="el-${k}" data-c="elegido" data-doc="${doc}" value="${k}" ${d.elegidos.includes(k) ? "checked" : ""}>${CONTACTOS[k].nombre}<small>${CONTACTOS[k].cargo} · correo</small></label>`).join("")}</div></fieldset>
      ${n ? '<p class="ayuda">Lo enviado no se puede recuperar.</p>' : ""}</div>
    <div class="pie"><button class="btn" data-a="cerrar" autofocus>Cancelar <span class="kbd">Esc</span></button><button class="btn peligro" data-a="publicar" data-v="${doc}" ${e.ocupado ? 'aria-busy="true"' : ""}>${cargando(n ? `Publicar y enviar a ${n}` : `Publicar versión ${siguiente}`)}</button></div></div>`;
}

/* =====================================================================================================
   Informe
   ===================================================================================================== */
function editorInforme() {
  const f = e.inf;
  const incluidos = f.capitulos.map((id) => LEVANTAMIENTOS[id]);
  const fuera = Object.values(LEVANTAMIENTOS).filter((l) => !f.capitulos.includes(l.id));
  const capitulo = (l, pos) => {
    const dentro = pos >= 0, revisado = l.estado === "revisado";
    return `<label class="capitulo-e ${dentro ? "" : "fuera"}"><input type="checkbox" id="cap-${l.id}" data-c="capitulo" value="${l.id}" ${dentro ? "checked" : ""} ${!revisado && !dentro ? "disabled" : ""}>
      <span class="n">${dentro ? `2.${pos + 1}` : ""}</span><span><b>${l.formato}</b> de ${l.tecnico}<small>recibido ${diaCorto(l.recibidoEn.slice(0, 10))} · ${revisado ? "Revisado" : "En revisión"}</small></span>
      ${dentro ? (f.capitulos.length > 1 ? `<span class="mover"><button class="btn-i" data-a="subir-cap" data-v="${pos}" ${pos === 0 ? "disabled" : ""} aria-label="Subir">${ic("arriba")}</button><button class="btn-i" data-a="bajar-cap" data-v="${pos}" ${pos === f.capitulos.length - 1 ? "disabled" : ""} aria-label="Bajar">${ic("abajo")}</button></span>` : "<span></span>") : revisado ? "<span></span>" : '<span class="estado revision"><i></i>En revisión</span>'}</label>`;
  };
  const planos = f.planos.map((p, i) => `<div class="plano"><span class="chip-pdf">PDF</span><input class="control chico" id="plano-${i}" data-c="plano" data-v="${i}" value="${esc(p.nombre)}" aria-label="Nombre del plano ${i + 1}">
    <span class="mover"><button class="btn-i" data-a="subir-plano" data-v="${i}" ${i === 0 ? "disabled" : ""} aria-label="Subir">${ic("arriba")}</button><button class="btn-i" data-a="bajar-plano" data-v="${i}" ${i === f.planos.length - 1 ? "disabled" : ""} aria-label="Bajar">${ic("abajo")}</button><button class="btn-i" data-a="quitar-plano" data-v="${i}" aria-label="Quitar">${ic("basura")}</button></span></div>`).join("");
  return `<div class="cab"><div><div class="titulo-estado"><h1>Informe de ${VISITA.cliente}</h1>${f.publicada ? '<span class="estado ok"><i></i>Versión 1 vigente</span>' : '<span class="estado"><i></i>Sin publicar</span>'}</div>
      <div class="datos"><span>${VISITA.sitio}</span><span>Visita del ${diaCorto(VISITA.programadaPara)}</span><span>${VISITA.motivo}</span><span>Recibe el PDF: <b style="color:var(--texto);font-weight:500">Andrés Ruiz</b></span></div></div></div>
    <section class="bloque" data-ancla="#introduccion"><h2><span class="n">1</span>Introducción</h2><textarea class="control texto-doc" id="intro" data-c="intro" placeholder="Qué se visitó y para qué">${esc(f.intro)}</textarea></section>
    <section class="bloque" data-ancla=".capitulo"><h2><span class="n">2</span>Levantamientos</h2><p class="ayuda">Cada uno es un capítulo del PDF, en este orden. Solo entran los revisados.</p>
      <div>${incluidos.map(capitulo).join("")}</div>${fuera.length ? `<p class="subtitulo">No entran</p><div>${fuera.map((l) => capitulo(l, -1)).join("")}</div>` : ""}</section>
    <section class="bloque" data-ancla="#cierre"><h2><span class="n">3</span>Conclusiones</h2><textarea class="control texto-doc" id="concl" data-c="concl" placeholder="Qué se recomienda">${esc(f.concl)}</textarea></section>
    <section class="bloque" data-ancla="#planos"><h2><span class="n">4</span>Planos anexos</h2><p class="ayuda">Los planos que elabora oficina, en PDF. Van al final del informe, en este orden.</p><div>${planos}</div>
      <button class="agregar" data-a="agregar-plano">${ic("mas")}Agregar planos en PDF</button></section>
    <section class="bloque"><h2>Versiones publicadas</h2>${f.publicada
      ? `<div class="versiones"><div class="ver"><div class="ver-cab"><b>Versión 1</b><span class="estado ok"><i></i>Vigente</span><button class="btn fantasma chico" data-a="nada">${ic("descargar")}PDF</button></div><span class="meta">Publicada 30 sept 2026 por Laura Méndez · en el portal · 1 envío</span>
          <ul class="envios-v"><li>Andrés Ruiz<span class="det ok">Correo · Entregado</span></li></ul><button class="ir" data-a="abrir" data-v="enviar">${ic("enviar")}Enviar a otro contacto</button></div></div>`
      : '<p class="ayuda">Todavía no se ha publicado ninguna versión. Una versión publicada queda congelada: para corregir algo se publica otra y la anterior se conserva.</p>'}</section>`;
}

/* =====================================================================================================
   Envíos: lo que recibe cada contacto, antes de enviar
   ===================================================================================================== */
function capaEnviar() {
  const env = e.env;
  const elegidos = env.elegidos;
  if (!elegidos.includes(env.ver)) env.ver = elegidos[0] ?? null;
  const pestanas = elegidos.map((k) => `<button data-a="ver-destino" data-v="${k}" aria-pressed="${env.ver === k}">${ic(CONTACTOS[k].canales[0] === "Correo" ? "correo" : "chat")}${CONTACTOS[k].nombre}</button>`).join("");
  let vista;
  if (!env.ver) vista = `<div class="lienzo-vacio">${ic("usuario")}<b>Elija a quién enviar</b><p>Aquí aparece lo que recibe cada uno, con el adjunto.</p></div>`;
  else if (CONTACTOS[env.ver].canales[0] === "Correo") {
    const c = CONTACTOS[env.ver];
    vista = `<div class="correo-meta"><span>Para</span><b>${c.nombre} &lt;${c.correo}&gt;</b><span>Asunto</span><b>${esc(asunto(mensaje("informe")))}</b><span>Adjunto</span><span class="adjunto">${ic("clip")}${esc(adjuntoDe("informe"))}</span></div>
      <div class="hoja-marco correo-m"><iframe data-doc="correo-informe-${env.ver}" data-ancho="640" sandbox="allow-same-origin" title="Vista previa del correo a ${c.nombre}"></iframe></div>`;
  } else {
    const c = CONTACTOS[env.ver];
    vista = `<div class="correo-meta"><span>Para</span><b>${c.nombre} · ${c.celular}</b><span>Plantilla</span><span>informe_publicado</span></div>
      <div class="chat"><div class="burbuja"><div class="adj"><span class="chip-pdf">PDF</span><span>${esc(adjuntoDe("informe"))}</span></div>
        <p>Hola, <b>${primerNombre(c.nombre)}</b>. TEINS le envía el informe de la visita del <b>${diaCorto(VISITA.programadaPara)}</b> a <b>${VISITA.sitio}</b>, versión <b>${1}</b>.</p><small>9:41</small>
        <span class="boton-w">Ver en el portal</span></div>
        <p class="ayuda">Lo resaltado son las variables. El resto es el texto que se propone registrar en Meta: hoy WhatsApp sigue simulado.</p></div>`;
  }
  const n = elegidos.length;
  return `<div class="velo" data-a="cerrar"></div><aside class="lateral ancha" role="dialog" aria-modal="true" aria-labelledby="t-env">
    <header><h2 id="t-env">Enviar la versión 1 a otro contacto</h2><p>Informe de ${VISITA.cliente} · ${VISITA.sitio}</p><button class="btn-i cerrar-l" data-a="cerrar" aria-label="Cerrar">${ic("x")}</button></header>
    <div class="destinos"><span class="etq">A quién</span><div class="casillas">${["marta", "carlos"].map((k) => `<label><input type="checkbox" id="de-${k}" data-c="destino" value="${k}" ${elegidos.includes(k) ? "checked" : ""}>${CONTACTOS[k].nombre}<small>${CONTACTOS[k].cargo} · ${CONTACTOS[k].canales.map((c) => (c === "Correo" ? "correo" : c)).join(" y ")}</small></label>`).join("")}</div>
      <p class="ayuda">Andrés Ruiz ya la recibió por correo el 30 sept.</p></div>
    <div class="lienzo"><div class="lienzo-cab"><div class="segmento-app" role="group" aria-label="Qué recibe">${pestanas || '<button aria-pressed="true" disabled>Nadie elegido</button>'}</div><span class="nota-l">Lo que recibe, tal como sale</span></div>${vista}</div>
    <div class="pie"><div class="efecto"><div>${ic("alerta")}<span>Lo enviado no se puede recuperar: retirar la versión del portal no borra el correo ni el WhatsApp.</span></div></div>
      <div class="botones"><button class="btn" data-a="cerrar">Cancelar</button><button class="btn principal" data-a="enviar" ${n ? "" : "disabled"} ${e.ocupado ? 'aria-busy="true"' : ""}>${cargando(n ? `Enviar a ${n === 1 ? CONTACTOS[elegidos[0]].nombre : `${n} contactos`}` : "Enviar")}</button></div></div></aside>`;
}

/* =====================================================================================================
   Revisión: corregir un dato y ver su capítulo
   ===================================================================================================== */
function pantallaRevision() {
  const r = e.rev;
  const ancho = r.tab === "informe";
  const fila = (clave, n, v, extra = "") => `<div class="dato"><span class="n">${n}</span><span class="v"><b>${v}</b>${extra}</span><button class="btn fantasma chico" data-a="nada">${ic("lapiz")}Corregir</button></div>`;
  const tension = r.corrigiendo
    ? `<div class="dato editando"><span class="n">Tensión de entrada</span><div class="editor" style="display:flex;flex-direction:column;gap:10px">
        <div class="con-unidad"><input class="control" id="nuevo" data-c="nuevo" value="${esc(r.nuevo)}" inputmode="decimal" aria-label="Tensión de entrada corregida" autofocus><span>V</span></div>
        <div class="campo"><label for="motivo">Motivo de la corrección <small class="obl">obligatorio · queda en el historial</small></label><input class="control ${r.faltaMotivo && !r.motivo.trim() ? "error" : ""}" id="motivo" data-c="motivo" value="${esc(r.motivo)}" aria-invalid="${r.faltaMotivo && !r.motivo.trim()}">
          ${r.faltaMotivo && !r.motivo.trim() ? `<p class="msj-error">${ic("alerta")}Escriba el motivo: queda en el historial junto al valor anterior.</p>` : ""}</div>
        ${ancho ? '<p class="ayuda">El capítulo de la derecha ya muestra el valor nuevo, resaltado.</p>' : `<button class="ir" data-a="tab" data-v="informe">${ic("doc")}Ver cómo queda en el informe</button>`}
        <div class="botones"><button class="btn" data-a="cancelar-correccion">Cancelar</button><button class="btn principal" data-a="guardar-correccion" ${e.ocupado ? 'aria-busy="true"' : ""}>${cargando("Guardar corrección")}</button></div></div></div>`
    : `<div class="dato"><span class="n">Tensión de entrada</span><span class="v"><b>${r.tension} V</b>${r.marcas["equipo/tension_entrada"] ? `<span class="corregido">Corregido por usted · antes 208 V</span>` : ""}</span><button class="btn fantasma chico" data-a="corregir">${ic("lapiz")}Corregir</button></div>`;
  const principal = `<div class="principal-r">
      <section class="seccion-d"><h2>Equipo</h2>
        ${fila("capacidad", "Capacidad nominal", "10 kVA")}${tension}${fila("salida", "Tensión de salida", "120 V")}
        ${fila("autonomia", "Autonomía medida", "18 min", '<span class="corregido">Corregido por Laura Méndez · antes <s>15 min</s> · El técnico anotó la del fabricante</span>')}
        ${fila("baterias", "Estado de las baterías", "Regular")}
        <div class="dato"><span class="n">Placa del banco de baterías</span><span class="v" style="color:var(--sec)">No obtenido · sin acceso al gabinete</span><button class="btn fantasma chico" data-a="nada">${ic("lapiz")}Corregir</button></div>
        <div class="dato"><span class="n">Fotos del equipo</span><span class="v"><span class="fotos-m"><i></i><i></i></span></span><span></span></div></section>
      <section class="seccion-d"><h2>Materiales</h2><table class="tabla-m"><thead><tr><th>Descripción</th><th style="text-align:right">Cantidad</th><th>Unidad</th></tr></thead><tbody><tr><td>Batería 12 V 9 Ah</td><td class="der">16</td><td>und</td></tr><tr><td>Cable encauchetado 3 × 12 AWG</td><td class="der">25</td><td>m</td></tr></tbody></table></section>
      <section class="seccion-d"><h2>Cierre de la visita</h2><div class="dato"><span class="n">Constancia de visita</span><span class="v"><b>Firmada por Carlos Rojas</b> <small>(Jefe de mantenimiento)</small></span><span></span></div></section></div>`;
  const tab = (v, t, n = "") => `<button role="tab" data-a="tab" data-v="${v}" aria-selected="${r.tab === v}">${t}${n ? `<span>${n}</span>` : ""}</button>`;
  const historial = [...r.historial, ["Laura Méndez corrigió Autonomía medida: 15 min → 18 min", "29 sept, 10:12 a. m. · El técnico anotó la del fabricante"], ["Laura Méndez tomó la revisión", "29 sept, 9:58 a. m."], ["Juan Pérez envió el levantamiento", "28 sept, 4:40 p. m."]];
  const cuerpoTab = r.tab === "comentarios"
    ? `<div class="comentario"><span class="avatar">LM</span><span>Falta la placa del segundo banco de baterías.<small>Sobre Placa del banco de baterías · 9:30 a. m.</small></span></div><div class="comentario"><span class="avatar">JP</span><span>El gabinete estaba con llave; la pido en la próxima visita.<small>9:41 a. m.</small></span></div>`
    : r.tab === "historial"
      ? historial.map(([t, s]) => `<div class="evento">${t}<small>${s}</small></div>`).join("")
      : "";
  return `<div class="ventana">${menu("Levantamientos")}<div class="contenido"><div class="barra-sup"><span>Levantamientos / <b>Mantenimiento de UPS</b></span></div>
    <div class="pagina rev"><div class="cab"><div><div class="titulo-estado"><h1>Mantenimiento de UPS</h1><span class="estado revision"><i></i>En revisión</span></div>
      <div class="datos"><span>${VISITA.cliente} · ${VISITA.sitio}</span><span>Juan Pérez</span><span>Recibido el 28 sept, 4:40 p. m.</span></div></div></div>
      <div class="con-carril ${ancho ? "ancho" : ""}"><div data-r="principal" style="min-width:0">${principal}</div>
        <aside class="carril" aria-label="Revisión"><div class="grupo-c"><h2>Revisión</h2><p>Tomada por usted. Al marcarlo revisado, queda listo para el informe.</p><button class="btn principal" data-a="nada">Marcar revisado</button></div>
          <div class="grupo-c"><div class="mini-tabs" role="tablist">${tab("comentarios", "Comentarios", "2")}${tab("historial", "Historial")}${tab("informe", "En el informe")}</div>
            ${r.tab === "informe"
              ? `<div class="lienzo en-carril"><div class="lienzo-cab"><span class="nota-l" style="text-align:left">El capítulo, como saldrá en el informe</span><span class="nota-l">Lo azul no sale en el PDF</span></div><div class="hoja-marco"><iframe data-doc="capitulo" data-ancho="740" sandbox="allow-same-origin" title="Capítulo del informe"></iframe></div></div>`
              : `<div data-r="tab">${cuerpoTab}</div>`}</div></aside></div></div></div>
    <div class="contenidos" data-r="notif">${notificacion()}</div></div>`;
}

/* =====================================================================================================
   Resumen
   ===================================================================================================== */
function resumen() {
  return `<div class="resumen-p">
    <div><h2>El documento al lado, mientras se escribe</h2><p style="margin-top:6px;max-width:80ch">Hoy oficina ve el informe y la cotización solo después de publicar, cuando ya no se pueden cambiar. Con la iteración 26, cada pantalla que arma un documento lo muestra al lado, tal como lo recibe el cliente, y se actualiza al escribir.</p></div>
    <table><thead><tr><th>Dónde</th><th>Qué se ve en vivo</th><th>Cuándo cambia</th></tr></thead><tbody>
      <tr><td><b>Cotización</b></td><td>La hoja de la cotización y, en «Correo», el mensaje que recibe el contacto con su asunto y su adjunto</td><td>Con cada precio, cantidad, línea, impuesto o condición</td></tr>
      <tr><td><b>Informe</b></td><td>El informe completo en el orden del PDF: portada, introducción, un capítulo por levantamiento, conclusiones y los planos como fichas</td><td>Al escribir, al incluir u ordenar levantamientos y al nombrar planos. Al enfocar una sección, la hoja va hasta ella</td></tr>
      <tr><td><b>Revisión</b></td><td>El capítulo del levantamiento, con lo corregido resaltado y el valor anterior al lado</td><td>Al escribir la corrección, antes de guardarla</td></tr>
      <tr><td><b>Envíos</b></td><td>El correo y el WhatsApp de cada contacto elegido, con el adjunto</td><td>Al elegir a quién se envía</td></tr>
    </tbody></table>
    <div class="dos">
      <div><h3>Lo que no cambia</h3><ul>
        <li><b>Una sola plantilla.</b> La vista y el PDF salen del mismo código (<code>paquetes/documentos</code>): no pueden mostrar cosas distintas.</li>
        <li><b>El PDF publicado sigue mandando.</b> La vista es una hoja continua y lo dice arriba; el PDF pagina y pone el pie.</li>
        <li><b>No va al servidor al escribir.</b> Se dibuja en el equipo: funciona sin guardar y con la conexión cortada.</li>
        <li><b>Sin abrir la seguridad.</b> La hoja va en un marco sin scripts y la política de contenido de oficina no cambia.</li>
      </ul></div>
      <div><h3>Lo que propongo y le pido aprobar</h3><ol>
        <li>Las <b>versiones publicadas y sus envíos</b> bajan al final del editor: el costado ahora es la hoja.</li>
        <li>En pantallas de <b>menos de 1280 px</b> la hoja no cabe al lado: «Vista previa» la abre en una hoja lateral.</li>
        <li>En la revisión, una pestaña <b>«En el informe»</b> en el carril, que se ensancha al elegirla.</li>
        <li><b>Enviar a otro contacto</b> pasa de diálogo a hoja lateral, para que quepa lo que recibe cada uno.</li>
        <li>Los <b>saltos de página forzados</b> (después de la portada, antes de cada capítulo y del cierre) se ven como una franja.</li>
        <li>La confirmación de publicar <b>ya no carga el PDF del servidor</b>: dice que es el documento de la vista previa.</li>
        <li>Una línea <b>sin precio</b> se ve como <code>[Precio]</code> en la hoja, y no se puede publicar.</li>
      </ol></div>
    </div></div>`;
}

/* =====================================================================================================
   Guía de casos y pintado
   ===================================================================================================== */
const mandosVista = () => `<div class="mandos-n">
  <div class="fila">Estado de la vista <div class="segmentos" role="group" aria-label="Estado de la vista">${[["lista", "Lista"], ["cargando", "Cargando"], ["error", "Error"], ["sinred", "Sin conexión"]].map(([v, t]) => `<button data-a="estado-vista" data-v="${v}" aria-pressed="${e.estadoVista === v}">${t}</button>`).join("")}</div></div>
  <div class="fila">Ventana <div class="segmentos" role="group" aria-label="Ventana">${[[false, "1440 px"], [true, "1100 px"]].map(([v, t]) => `<button data-a="angosta" data-v="${v}" aria-pressed="${e.angosta === v}">${t}</button>`).join("")}</div></div></div>`;
const CASOS = [
  { id: "resumen", grupo: "", titulo: "Resumen", sub: "Dónde se ve y qué no cambia", nota: () => `<div><h2>Iteración 26 · ADR-0031</h2><p>Empiece por aquí: dónde aparece la vista en vivo, lo que se garantiza y las siete decisiones que le pido aprobar. Después recorra los casos de arriba.</p></div>` },
  { id: "cotizacion", grupo: "Documentos", titulo: "Cotización", sub: "Precios, impuestos y su correo",
    nota: () => `<div><h2>La hoja al lado, mientras escribe</h2><p class="probar"><b>Pruebe:</b> escriba el precio de la mano de obra (falta, y por eso no se puede publicar), cambie las 16 baterías o pase a AIU. La hoja cambia en el mismo cuadro y destella lo que cambió. «Correo» muestra lo que recibe Marta Gil. Luego «Publicar versión 2».</p><p>Las versiones y sus envíos bajan al final del editor. Con la ventana de 1100 px la hoja se abre con «Vista previa».</p></div>${mandosVista()}` },
  { id: "informe", grupo: "Documentos", titulo: "Informe", sub: "Capítulos, textos y planos",
    nota: () => `<div><h2>El informe completo, en el orden del PDF</h2><p class="probar"><b>Pruebe:</b> haga clic en «Conclusiones» o en «Planos anexos»: la hoja va hasta esa parte. Escriba en la introducción, quite el cuarto técnico o cambie el orden de los capítulos. Los planos no se dibujan: una ficha dice cuántas páginas anexan.</p><p>Con «Sin conexión», las fotos que no alcanzaron a cargar salen como [FOTO], igual que en el PDF cuando falta una.</p></div>${mandosVista()}` },
  { id: "revision", grupo: "Revisión", titulo: "Corregir un dato", sub: "El capítulo, con lo corregido",
    nota: () => `<div><h2>Cómo queda en el informe, antes de guardar</h2><p class="probar"><b>Pruebe:</b> «Corregir» en «Tensión de entrada», escriba 220 y luego «Ver cómo queda en el informe». El carril se ensancha y muestra el capítulo con el valor nuevo enmarcado en azul y el anterior debajo; «Autonomía medida», que ya se corrigió, va resaltada.</p><p>Lo azul es solo de la pantalla: el PDF muestra el valor y nada más, como hoy. El historial sigue guardando el valor anterior y el motivo.</p></div>` },
  { id: "envios", grupo: "Envíos", titulo: "Enviar a otro contacto", sub: "Lo que recibe cada uno",
    nota: () => `<div><h2>Antes de enviar, lo que le llega a cada uno</h2><p class="probar"><b>Pruebe:</b> cambie entre Marta Gil (correo) y Carlos Rojas (WhatsApp), o quite uno. El correo es el mismo HTML que sale por Resend; el WhatsApp, la plantilla con sus variables.</p><p>Pasa de diálogo a hoja lateral porque el mensaje no cabe en un diálogo de 460 px. La hoja ya es el paso deliberado: dice antes del botón que lo enviado no se recupera.</p></div>` },
];

let pintando = false;
function pintar() {
  // Reemplazar una región con el foco dentro dispara blur y change: sin esta guarda, se pintaría a mitad de pintar.
  if (pintando) return;
  pintando = true;
  try { pintarYa(); } finally { pintando = false; }
}
function pintarYa() {
  document.getElementById("casos").innerHTML = CASOS.reduce((h, c, i) => h + (c.grupo && c.grupo !== CASOS[i - 1]?.grupo ? `<span class="grupo">${c.grupo}</span>` : "") + `<button data-caso="${c.id}" aria-pressed="${c.id === e.caso}">${c.titulo}<small>${c.sub}</small></button>`, "");
  document.getElementById("nota").innerHTML = CASOS.find((c) => c.id === e.caso).nota();
  document.querySelectorAll("#temas button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tema === e.tema)));
  const act = document.activeElement;
  const foco = act?.closest?.("#escena") ? act.id : null;
  const pos = act?.selectionStart;
  let html;
  if (e.caso === "resumen") html = resumen();
  else {
    const p = e.caso === "cotizacion" ? pantallaDocumento("cotizacion") : e.caso === "informe" || e.caso === "envios" ? pantallaDocumento("informe") : pantallaRevision();
    html = `<div class="app" data-tema="${e.tema}">${p}</div>`;
  }
  montar(html);
  prepararHojas();
  programarVista();
  if (foco && document.getElementById(foco) && document.activeElement !== document.getElementById(foco)) {
    const el = document.getElementById(foco);
    el.focus({ preventScroll: true });
    try { if (pos !== undefined && pos !== null) el.setSelectionRange(pos, pos); } catch {}
  } else {
    const auto = document.querySelector("#escena [autofocus]");
    if (auto && !auto.dataset.enfocado) { auto.dataset.enfocado = "1"; auto.focus({ preventScroll: true }); }
  }
}

/* =====================================================================================================
   Eventos
   ===================================================================================================== */
const linea = (id) => e.cot.lineas.find((l) => String(l.id) === String(id));
document.addEventListener("input", (ev) => {
  const t = ev.target, c = t.dataset?.c;
  if (!c || !t.closest("#escena")) return;
  if (c === "precio") { const n = leerPesos(t.value); linea(t.dataset.id).precio = n === null ? "" : miles(n); t.value = linea(t.dataset.id).precio; }
  if (c === "cantidad") linea(t.dataset.id).cantidad = t.value;
  if (c === "desc") linea(t.dataset.id).descripcion = t.value;
  if (c === "aiu") e.cot.imp[t.dataset.v] = t.value.trim();
  if (["validez", "pago", "notas"].includes(c)) e.cot[c] = t.value;
  if (["precio", "cantidad", "desc", "aiu", "validez", "pago", "notas"].includes(c)) e.cot.cambiado = true;
  if (c === "intro" || c === "concl") { e.inf[c] = t.value; e.inf.cambiado = true; }
  if (c === "plano") { e.inf.planos[+t.dataset.v].nombre = t.value; e.inf.cambiado = true; }
  if (c === "nuevo") e.rev.nuevo = t.value.replace(/[^\d,]/g, "");
  if (c === "motivo") e.rev.motivo = t.value;
  pintar();
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (!t.closest("#escena") || !(t.name === "imp" || ["capitulo", "elegido", "destino"].includes(t.dataset.c))) return;
  if (t.name === "imp") { e.cot.imp.tipo = t.value; e.cot.cambiado = true; }
  if (t.dataset.c === "capitulo") { e.inf.capitulos = t.checked ? [...e.inf.capitulos, t.value] : e.inf.capitulos.filter((x) => x !== t.value); e.inf.cambiado = true; }
  if (t.dataset.c === "elegido") { const d = t.dataset.doc === "cotizacion" ? e.cot : e.inf; d.elegidos = t.checked ? [...d.elegidos, t.value] : d.elegidos.filter((x) => x !== t.value); }
  if (t.dataset.c === "destino") { e.env.elegidos = ["marta", "carlos"].filter((k) => (k === t.value ? t.checked : e.env.elegidos.includes(k))); if (t.checked) e.env.ver = t.value; }
  pintar();
});
/* Al enfocar una sección del editor, la hoja va hasta esa parte del documento. */
document.addEventListener("focusin", (ev) => {
  const sec = ev.target.closest?.("[data-ancla]");
  if (!sec || !ev.target.closest("#escena")) return;
  irA(document.querySelector("#escena .lienzo iframe[data-cargado]"), sec.dataset.ancla);
});
document.addEventListener("click", (ev) => {
  const sec = ev.target.closest?.("#escena [data-ancla]");
  if (sec && !ev.target.closest("[data-a], input, textarea, label")) irA(document.querySelector("#escena .lienzo iframe[data-cargado]"), sec.dataset.ancla);
});
const mover = (lista, i, d) => { const c = [...lista]; [c[i], c[i + d]] = [c[i + d], c[i]]; return c; };
document.getElementById("casos").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-caso]");
  if (!b) return;
  e.caso = b.dataset.caso;
  reiniciar();
  if (e.caso === "envios") { e.inf.publicada = true; e.capa = "enviar"; }
  pintar();
});
document.getElementById("temas").addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  e.tema = b.dataset.tema;
  marcoPrevio = "";
  pintar();
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && e.capa && !e.ocupado) { e.capa = null; pintar(); } });
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-a]");
  if (!b || b.disabled) return;
  const a = b.dataset.a, v = b.dataset.v;
  ev.preventDefault();
  if (a === "nada") return;
  if (a === "estado-vista") { e.estadoVista = v; if (v === "cargando") setTimeout(() => { if (e.estadoVista === "cargando") { e.estadoVista = "lista"; pintar(); } }, 1600); }
  if (a === "reintentar") { e.estadoVista = "cargando"; setTimeout(() => { e.estadoVista = "lista"; pintar(); }, 900); }
  if (a === "angosta") { e.angosta = v === "true"; e.capa = null; }
  if (a === "vista") e.vista = v;
  if (a === "abrir") e.capa = v;
  if (a === "cerrar" && !e.ocupado) e.capa = null;
  if (a === "agregar-linea") { e.cot.lineas.push({ id: Date.now(), codigo: null, descripcion: "", cantidad: "1", unidad: "gl", precio: "", catalogo: null, origen: "oficina" }); e.cot.cambiado = true; }
  if (a === "quitar-linea") {
    const i = e.cot.lineas.findIndex((l) => String(l.id) === v);
    const [quitada] = e.cot.lineas.splice(i, 1);
    e.cot.cambiado = true;
    notificar(`${quitada.descripcion || "Línea nueva"} quitada`, () => e.cot.lineas.splice(i, 0, quitada));
  }
  if (a === "deshacer" && e.deshacer) { e.deshacer(); e.deshacer = null; e.notif = null; clearTimeout(temporizador); }
  if (a === "guardar") return trabajar(() => { (e.caso === "cotizacion" ? e.cot : e.inf).cambiado = false; notificar("Borrador guardado"); });
  if (a === "publicar")
    return trabajar(() => {
      e.capa = null;
      if (v === "cotizacion") {
        const n = siguienteCot(), envios = e.cot.elegidos.map((k) => [CONTACTOS[k].nombre, "Correo", "En cola"]);
        e.cot.versiones.unshift({ n, fecha: "1 oct 2026", por: "Laura Méndez", total: totales().total, pdf: "generando", envios });
        e.cot.cambiado = false;
        notificar(envios.length ? `Versión ${n} publicada. Se envía cuando el PDF esté listo.` : `Versión ${n} publicada. El PDF se está generando.`);
        setTimeout(() => { const ver = e.cot.versiones.find((x) => x.n === n); if (!ver) return; ver.pdf = "listo"; ver.envios = ver.envios.map(([a2, b2]) => [a2, b2, "Enviado"]); pintar(); }, 2600);
      } else { e.inf.publicada = true; e.inf.cambiado = false; notificar("Versión 1 publicada. Se envía cuando el PDF esté listo."); }
    }, 900);
  if (a === "subir-cap" || a === "bajar-cap") { e.inf.capitulos = mover(e.inf.capitulos, +v, a === "subir-cap" ? -1 : 1); e.inf.cambiado = true; }
  if (a === "subir-plano" || a === "bajar-plano") { e.inf.planos = mover(e.inf.planos, +v, a === "subir-plano" ? -1 : 1); e.inf.cambiado = true; }
  if (a === "quitar-plano") { const [p] = e.inf.planos.splice(+v, 1); e.inf.cambiado = true; notificar(`Plano «${p.nombre}» quitado`, () => e.inf.planos.splice(+v, 0, p)); }
  if (a === "agregar-plano") { e.inf.planos.push({ nombre: "Ruta de la acometida", paginas: 2 }); e.inf.cambiado = true; notificar("Plano agregado"); }
  if (a === "tab") e.rev.tab = v;
  if (a === "corregir") Object.assign(e.rev, { corrigiendo: true, nuevo: e.rev.tension, motivo: "", faltaMotivo: false });
  if (a === "cancelar-correccion") e.rev.corrigiendo = false;
  if (a === "guardar-correccion") {
    if (!e.rev.motivo.trim()) { e.rev.faltaMotivo = true; pintar(); return requestAnimationFrame(() => document.getElementById("motivo")?.focus()); }
    return trabajar(() => {
      const r = e.rev;
      if (r.nuevo !== r.tension) {
        r.historial.unshift([`Usted corrigió Tensión de entrada: ${r.tension} V → ${r.nuevo} V`, `Ahora · ${r.motivo.trim()}`]);
        r.marcas["equipo/tension_entrada"] = `Antes: ${r.tension} V`;
        r.tension = r.nuevo;
      }
      r.corrigiendo = false;
      notificar("Dato corregido");
    });
  }
  if (a === "ver-destino") e.env.ver = v;
  if (a === "enviar") return trabajar(() => { const n = e.env.elegidos.length; e.capa = null; notificar(n === 1 ? `Enviado a ${CONTACTOS[e.env.elegidos[0]].nombre}` : `Enviado a ${n} contactos`); });
  pintar();
});

reiniciar();
pintar();
</script>
