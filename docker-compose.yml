# Entorno local (ADR-0016): PostgreSQL y un almacenamiento compatible con S3 de licencia Apache-2.0.
# Solo para desarrollo; las contraseñas son locales y no protegen nada fuera de esta máquina.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: teins
      POSTGRES_USER: teins_propietario
      POSTGRES_PASSWORD: propietario-local
    ports: ["5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql
      - ./paquetes/servidor/infra/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./paquetes/servidor/infra/roles-local.sql:/docker-entrypoint-initdb.d/02-roles-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teins_propietario -d teins"]
      interval: 2s
      retries: 30

  s3:
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: teins-archivos
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports: ["9090:9090"]
    volumes:
      - s3:/s3mockroot

volumes:
  postgres:
  s3:
