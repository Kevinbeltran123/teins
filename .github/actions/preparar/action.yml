# pnpm, Node de .nvmrc y las dependencias del lockfile: lo mismo en cada trabajo de la integración.
# Cada trabajo hace su propio actions/checkout antes, porque esta acción vive en el repositorio.
name: Preparar
description: pnpm, Node (.nvmrc, con caché de pnpm) y pnpm install --frozen-lockfile
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
