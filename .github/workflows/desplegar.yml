# Despliegue manual por lotes (ADR-0049, ADR-0056): se lanza a mano desde la pestaña Actions, eligiendo en
# «Use workflow from» la rama o la etiqueta, y el entorno. Pruebas (la preproducción) acepta cualquier rama;
# producción, solo una versión publicada (etiqueta vX.Y.Z). Despliega ese commit, y solo si pasó la
# integración continua. El orden es el de infra/railway/montar.sh: campo primero (migra la base en su
# pre-deploy), después oficina, portal, worker y respaldos.
name: Desplegar

on:
  workflow_dispatch:
    inputs:
      entorno:
        description: Entorno de Railway
        type: choice
        options: [pruebas, produccion]
        default: pruebas
      confirmar:
        description: Solo para producción, escribe «produccion»
        type: string
        default: ''

permissions:
  contents: read
  actions: read

# Nunca dos despliegues del mismo entorno a la vez, y uno empezado no se cancela a medias.
concurrency:
  group: desplegar-${{ inputs.entorno }}
  cancel-in-progress: false

jobs:
  desplegar:
    name: Desplegar en ${{ inputs.entorno }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # El token del proyecto de Railway (RAILWAY_TOKEN) es un secreto de cada entorno de GitHub.
    environment: ${{ inputs.entorno }}
    steps:
      # En un repositorio privado con GitHub Pro no hay revisores obligatorios: la aprobación es esta.
      - name: Producción solo desde una versión y confirmada
        if: inputs.entorno == 'produccion' && (!startsWith(github.ref, 'refs/tags/v') || inputs.confirmar != 'produccion')
        run: |
          echo "::error::Producción se despliega solo desde una versión (etiqueta vX.Y.Z en «Use workflow from») y escribiendo «produccion» en la confirmación."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: El commit pasó la integración continua
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exitosas=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow integracion.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$exitosas" -eq 0 ]; then
            echo "::error::El commit $GITHUB_SHA no tiene una corrida exitosa de la integración continua."
            exit 1
          fi
      # La misma CLI que se usa desde el computador; la versión se fija aquí.
      - name: CLI de Railway
        run: npm install --global @railway/cli@5.63.3
      # Solo este paso ve el token. `--ci` espera a que termine la construcción y falla si falla.
      - name: campo (migra antes de arrancar), oficina, portal, worker y respaldos
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service campo --ci
          for servicio in oficina portal worker; do railway up --service "$servicio" --ci; done
          railway up infra/respaldos --path-as-root --service respaldos --ci
      # Las direcciones son variables de cada entorno de GitHub. Tras construir, Railway tarda en cambiar
      # de contenedor: se reintenta hasta 5 minutos antes de dar el despliegue por fallido.
      - name: /salud responde en campo, oficina y portal
        env:
          CAMPO_URL: ${{ vars.CAMPO_URL }}
          OFICINA_URL: ${{ vars.OFICINA_URL }}
          PORTAL_URL: ${{ vars.PORTAL_URL }}
        run: |
          for url in "$CAMPO_URL" "$OFICINA_URL" "$PORTAL_URL"; do
            curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors --max-time 15 "$url/salud" > /dev/null
            echo "$url/salud responde"
          done
