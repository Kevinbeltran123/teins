# Integración continua (ADR-0018). Lo barato falla primero: tipos, reglas de arquitectura,
# licencias y pruebas rápidas; después integración con PostgreSQL real y extremo a extremo.
name: Integración

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, arquitectura, licencias y pruebas rápidas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - name: Tipos
        run: pnpm typecheck
      - name: Reglas de arquitectura
        run: pnpm arquitectura
      - name: Licencias (sin AGPL ni restricciones comerciales)
        run: pnpm licencias
      - name: Vulnerabilidades conocidas graves
        run: pnpm audit --prod --audit-level high
      # Todos los paquetes menos servidor, que corre aparte con PostgreSQL y S3 reales; uno nuevo entra solo.
      - name: Pruebas de los paquetes (incluye el arnés de fallas)
        run: pnpm --filter "./paquetes/*" --filter "!@teins/servidor" test
      - name: Compilación de las superficies
        run: pnpm --filter @teins/campo --filter @teins/oficina build
      - name: Presupuesto de rendimiento de campo
        run: pnpm presupuesto

  imagen:
    name: Imagen de contenedor
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen única (web y worker)
        run: docker build -t teins:${{ github.sha }} .
      - name: La imagen no lleva secretos y corre sin privilegios
        run: |
          docker run --rm --entrypoint sh teins:${{ github.sha }} -c 'test "$(whoami)" = node && test -z "$(find / -name .env -not -path "/proc/*" 2>/dev/null)"'

  secretos:
    name: Secretos fuera del repositorio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # En un pull request, gitleaks lee sus commits por la API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integracion:
    name: Servidor con PostgreSQL y S3 reales
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - name: Chromium para el PDF del informe (la misma versión de playwright-core del servidor)
        run: pnpm --filter @teins/servidor exec playwright-core install --with-deps chromium-headless-shell
      - name: Pruebas de integración (Testcontainers)
        run: pnpm --filter @teins/servidor test

  extremo-a-extremo:
    name: Extremo a extremo en ${{ matrix.nombre }}
    needs: calidad
    runs-on: ubuntu-latest
    # Un navegador por trabajo, en paralelo: los dos juntos ya pasaban de los 30 minutos (iteración 42).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { navegador: chromium, nombre: Chromium }
          - { navegador: webkit, nombre: WebKit }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/preparar
      - name: PostgreSQL y S3 locales
        run: docker compose up -d --wait
      - name: Configuración del servidor para la prueba (datos ficticios, secreto de un solo uso)
        working-directory: paquetes/servidor
        run: sed "s|^AUTH_SECRETO=$|AUTH_SECRETO=$(openssl rand -base64 32)|" .env.example > .env
      # Chromium siempre: el worker imprime los PDF con él, también en el trabajo de WebKit.
      - name: Navegadores
        run: pnpm --filter @teins/e2e exec playwright install --with-deps chromium ${{ matrix.navegador }}
      # «<navegador>-bandeja» depende de «<navegador>»: corre todas las pruebas en paralelo y al final, sola, la de la bandeja compartida.
      - name: Pruebas
        run: pnpm --filter @teins/e2e test --project=${{ matrix.navegador }}-bandeja
      - name: Reporte de la prueba
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-e2e-${{ matrix.navegador }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
